<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>七只小牛签约系统</title>
<style>
:root{
 --bg:#f3f6fb;--white:#fff;--line:#e3e9f2;--ink:#213149;--sub:#6d7c92;
 --blue:#2463eb;--nav:#162940;--green:#168264;--red:#bf4b4b;--orange:#ac7a29
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.65 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
button,input,select,textarea{font:inherit}
button{cursor:pointer;border:1px solid #d7e0ed;background:white;color:var(--ink);border-radius:7px;padding:8px 13px}
button:hover:not(:disabled){border-color:#9eb9ec;background:#f4f8ff}
button:disabled{opacity:.45;cursor:not-allowed}
input,select,textarea{border:1px solid #d8e1ed;border-radius:6px;padding:9px 11px;outline-color:#a5c1ff;background:white;color:var(--ink);max-width:100%}
textarea{resize:vertical;min-height:90px;line-height:1.8}
.primary{background:var(--blue);border-color:var(--blue);color:white}
.primary:hover:not(:disabled){background:#174dc3;color:white}
.danger{color:var(--red)}
.small{padding:5px 10px;font-size:12px}
h1{font-size:23px;margin:0 0 7px}
h2{font-size:16px;margin:0 0 17px}
h3{font-size:14px;margin:0 0 7px}
p{margin:7px 0 14px}
.muted{font-size:12px;color:var(--sub)}
.actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.between{justify-content:space-between}
.card{background:white;border:1px solid var(--line);border-radius:12px;padding:22px;margin-bottom:18px;box-shadow:0 5px 22px #233d5e05}
.head{display:flex;justify-content:space-between;align-items:flex-start;gap:15px;margin-bottom:22px}
.grid{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(310px,1fr);gap:20px}
.equal{grid-template-columns:1fr 1fr}
.sidebar{position:fixed;inset:0 auto 0 0;width:214px;background:var(--nav);color:#b6c5d9;padding:24px 14px;display:flex;flex-direction:column;z-index:10}
.logo{font-size:21px;font-weight:750;color:white;padding:0 13px 25px;letter-spacing:1px}
.logo small{display:block;font-size:10px;letter-spacing:2px;color:#829bbd;margin-top:5px}
.nav{width:100%;text-align:left;border:0;color:#b6c5d9;background:transparent;padding:11px 13px;margin:2px 0}
.nav.active,.nav:hover:not(:disabled){background:#294565;color:white}
.sidefoot{margin-top:auto;font-size:11px;padding:20px 12px 0;color:#839ab8}
.workspace{margin-left:214px}
.topbar{height:72px;background:#ffffffef;border-bottom:1px solid var(--line);padding:0 28px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:9;backdrop-filter:blur(10px)}
main{padding:27px 28px;max-width:1700px;margin:auto}
.avatar{width:33px;height:33px;border-radius:50%;background:#edf3ff;color:var(--blue);display:grid;place-items:center;font-weight:700}
.hero{background:linear-gradient(115deg,#1c3c62,#3b6ba2);color:white;padding:29px 31px;border:0}
.hero p{color:#d0dff0}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:15px;margin-bottom:20px}
.stat{background:white;border:1px solid var(--line);border-radius:10px;padding:21px}
.stat span{font-size:12px;color:var(--sub)}
.stat strong{display:block;font-size:31px;margin-top:7px}
.tag{display:inline-block;padding:3px 8px;border-radius:5px;font-size:11px;background:#eef1f6;color:#68778c;white-space:nowrap}
.blue{background:#edf4ff;color:#2a63c8}
.green{background:#eaf7ef;color:#19845e}
.purple{background:#f3edff;color:#7d56b1}
.orange{background:#fff5e3;color:#a57629}
.red{background:#fff0ee;color:#bc4e4e}
.tip{padding:12px 15px;border:1px solid #dce8fd;background:#f0f6ff;color:#52719c;border-radius:8px;font-size:12px;margin-bottom:17px}
.warn{background:#fff8eb;border-color:#f1e0bd;color:#98753b}
.filters{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:16px;align-items:center}
.tablebox{overflow:auto;border:1px solid var(--line);border-radius:10px;background:white}
table{border-collapse:collapse;width:100%;font-size:12px;white-space:nowrap}
th{background:#f8fafd;padding:13px 15px;text-align:left;color:#718198;font-weight:500}
td{padding:14px 15px;border-top:1px solid var(--line)}
tr:hover td{background:#fbfcff}
.title{font-size:13px;font-weight:600;min-width:175px;max-width:310px;white-space:normal}
.empty{text-align:center;padding:45px 15px;color:#8a98ab}
.pagination{display:flex;justify-content:flex-end;align-items:center;gap:10px;margin-top:15px;color:var(--sub);font-size:12px}
.field{display:block;font-size:12px;color:#62728a;margin-bottom:14px}
.field input,.field select,.field textarea{width:100%;display:block;margin-top:6px;font-size:13px}
.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 13px}
.full{grid-column:1/-1}
.kv{display:flex;justify-content:space-between;gap:15px;padding:9px 0;border-bottom:1px dashed var(--line);font-size:12px}
.kv:last-child{border:0}
.kv span{color:var(--sub);flex-shrink:0}
.kv b{font-weight:500;text-align:right;overflow-wrap:anywhere}
.flow{display:flex;background:white;border:1px solid var(--line);padding:18px 10px;border-radius:10px;overflow:auto;margin-bottom:20px}
.step{flex:1;min-width:95px;text-align:center;color:#98a3b4;font-size:11px}
.step i{display:block;margin:0 auto 6px;width:25px;height:25px;line-height:25px;border-radius:50%;background:#edf1f6;font-style:normal}
.step.active{color:var(--blue);font-weight:600}
.step.active i{background:var(--blue);color:white}
.step.done{color:var(--green)}
.step.done i{background:#e7f5ee}
.tabs{display:flex;gap:20px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow:auto}
.tab{border:0;border-radius:0;border-bottom:2px solid transparent;background:transparent;color:#8391a4;padding:9px 0;white-space:nowrap}
.tab.active{color:var(--blue);border-bottom-color:var(--blue)}
.doc{background:white;padding:37px 43px;border:1px solid var(--line);border-radius:4px;min-height:520px}
.doc h2{text-align:center;font-size:22px;margin:10px 0 25px}
.docmeta{text-align:right;font-size:11px;color:#8996a9;margin-bottom:16px}
.docbody{white-space:pre-wrap;overflow-wrap:anywhere;font:14px/2.05 "Songti SC","SimSun",serif}
.signarea{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:35px;padding-top:22px;border-top:1px solid var(--line);font-size:12px}
.seal{width:135px;height:135px;display:block;margin:8px 0}
.record{position:relative;border-left:2px solid #e2e8f1;padding:0 0 23px 20px;margin-left:5px}
.record:before{content:"";position:absolute;width:8px;height:8px;left:-5px;top:5px;background:#819fc8;border-radius:50%}
.record:last-child{padding-bottom:0}
.record p{font-size:12px;color:#65758b;white-space:pre-wrap;overflow-wrap:anywhere}
.modal{position:fixed;inset:0;background:#17283d88;z-index:100;display:flex;align-items:center;justify-content:center;padding:20px}
.modalbox{background:white;border-radius:13px;width:650px;max-width:97vw;max-height:94vh;overflow:auto;padding:24px;box-shadow:0 20px 80px #0002}
.large{width:1060px}
.modalhead{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:20px}
.modalhead h2{margin:0}
.modalfoot{display:flex;justify-content:flex-end;gap:9px;margin-top:20px;flex-wrap:wrap}
.editor{width:1490px;padding:0;display:flex;flex-direction:column;height:94vh;overflow:hidden}
.editor>.modalhead{padding:18px 24px;margin:0;border-bottom:1px solid var(--line)}
.uploadtop{background:#eef5ff;border:1px dashed #8bb0ed;border-radius:10px;margin:15px 20px 0;padding:17px 20px;flex-shrink:0}
.uploadtop.drag{background:#deecff}
.uploadtop input{max-width:360px}
.uploadtop h3{font-size:16px;margin-bottom:5px}
.editlayout{display:grid;grid-template-columns:minmax(0,1fr) 440px;min-height:0;flex:1;margin-top:15px}
.editpreview{overflow:auto;background:#eaf0f7;padding:20px;min-width:0}
.editpreview .doc{max-width:850px;margin:auto;min-height:800px;box-shadow:0 5px 20px #263f5e0b}
.editfields{overflow:auto;padding:0 22px;min-width:0}
.editfields .modalfoot{position:sticky;bottom:0;background:white;padding:15px 0;border-top:1px solid var(--line);z-index:2}
.recognize{padding:13px;border:1px solid #dae7fc;background:#f5f9ff;border-radius:8px;margin-bottom:16px}
.recrow{display:grid;grid-template-columns:80px minmax(0,1fr) 45px;gap:7px;font-size:11px;padding:6px 0;align-items:start}
.recrow strong{font-weight:500;overflow-wrap:anywhere}
.recrow button{padding:1px 4px;font-size:10px}
.diffold,.diffnew{white-space:pre-wrap;overflow-wrap:anywhere;padding:10px;border-radius:6px;margin:5px 0;font-size:12px}
.diffold{background:#fff0ee;color:#ab4e49}
.diffnew{background:#eaf7ef;color:#247b51}
.pdf{width:100%;height:73vh;min-height:450px;border:0}
.scanimg{display:block;max-width:100%;margin:0 auto}
.toast{position:fixed;top:82px;left:50%;transform:translateX(-50%);background:#263b55;color:white;border-radius:8px;padding:12px 20px;z-index:500;max-width:90vw;box-shadow:0 8px 30px #0002}
.login{min-height:100vh;display:grid;place-items:center;padding:25px;background:radial-gradient(ellipse at 80% 0,#dce8ff,transparent 60%),#f3f6fb}
.logincard{width:430px;max-width:100%;padding:34px;border:1px solid var(--line);border-radius:18px;background:white;box-shadow:0 20px 60px #28476e12}
.loginmark{width:55px;height:55px;background:var(--blue);color:white;display:grid;place-items:center;font-size:26px;border-radius:13px;margin-bottom:20px}
.signheader{background:white;border-bottom:1px solid var(--line);padding:18px 30px;display:flex;justify-content:space-between;align-items:center;gap:15px}
.signpage{max-width:1000px;margin:24px auto;padding:0 20px}
.signfooter{position:sticky;bottom:0;background:#ffffffef;border-top:1px solid var(--line);padding:17px 25px;backdrop-filter:blur(10px)}
.signbrand{font-size:21px;font-weight:750;color:#2451a1}
[hidden]{display:none!important}
@media(max-width:1100px){
 .sidebar{width:185px}.workspace{margin-left:185px}
 .grid{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}
 .editlayout{grid-template-columns:minmax(0,1fr) 365px}
 .editfields .formgrid{grid-template-columns:1fr}main{padding:20px}
}
@media(max-width:740px){
 .sidebar{position:static;width:auto;padding:10px;display:block}
 .sidebar nav{display:flex;overflow:auto}.nav{width:auto;white-space:nowrap}
 .logo{padding:5px 10px}.logo small,.sidefoot{display:none}
 .workspace{margin:0}.topbar{position:static;height:auto;padding:14px;flex-wrap:wrap}
 .equal,.formgrid{grid-template-columns:1fr}.head{flex-wrap:wrap}
 .editlayout{display:block;overflow:auto}
 .editpreview,.editfields{overflow:visible}.editpreview .doc{min-height:400px}
 .doc{padding:25px}.stats{gap:10px}.stat{padding:15px}
 .uploadtop{margin:10px;padding:12px}.uploadtop input{width:100%}
}
</style>
</head>
<body>
<div id="app"></div>
<div id="modalRoot"></div>

<script>
"use strict";

/* ---------- 基本配置 ---------- */
const STORE="qzn-contract-workspace-v7";
const FILEDB="qzn-contract-files-v7";
const LIMIT=10;
const FINANCE="finance";
const SYSTEM={id:"system",name:"系统",title:"自动流程",role:"system"};

/*
 * 登录账号只用于权限、申请人、审批人及日志。
 * 不配置、不比较、不强制覆盖合同甲方主体。
 */
const USERS=[
 {id:"biz1",name:"张三",role:"biz",title:"业务经理",dept:"采购部"},
 {id:"biz2",name:"王五",role:"biz",title:"业务经理",dept:"商务部"},
 {id:"chief",name:"陈主管",role:"chief",title:"法务主管",dept:"法务部"},
 {id:"legal1",name:"李四",role:"legal",title:"法务专员",dept:"法务部"},
 {id:"legal2",name:"赵六",role:"legal",title:"法务专员",dept:"法务部"},
 {id:FINANCE,name:"孙会计",role:"finance",title:"财务审批人",dept:"财务部"}
];
const PASSWORD="123456";

/*
 * 所有业务账号共用主体列表，与账号无绑定关系。
 * credit、legal 请填写真实资料；未配置时留空，允许人工填写。
 */
const PARTIES=[
 {name:"七只小牛",address:"7",credit:"",legal:"",contact:"陈经理",phone:"021-68888888"},
 {name:"八只小牛",address:"8",credit:"",legal:"",contact:"李经理",phone:"021-68888889"},
 {name:"九只小牛",address:"9",credit:"",legal:"",contact:"王经理",phone:"021-68888890"},
 {name:"十只小牛",address:"10",credit:"",legal:"",contact:"赵经理",phone:"021-68888891"}
];
const TYPES=["报价单","采购协议","单方函件"];
const S={
 draft:["草稿",""],assign:["待主管分派","purple"],
 legal:["法务审批中","purple"],finance:["财务审批中","orange"],
 returned:["退回待修改","red"],ready:["待甲方签章","orange"],
 signed_a:["甲方已签 · 待发送","blue"],pending_b:["对方未完成","orange"],
 expired:["链接已失效",""],completed:["双方签署完成","green"],
 unilateral_done:["单方签署完成","green"],terminated:["已终止",""]
};
const ENTITY_FIELDS=[
 ["Name","主体名称"],["Credit","统一社会信用代码"],["Address","地址"],
 ["Legal","法定代表人"],["Contact","联系人"],["Phone","联系电话"],
 ["Email","电子邮箱"],["Bank","开户行"],["Account","银行账号"],
 ["AccountName","账户名称"],["Invoice","开票信息"]
];
const LABELS={
 amount:"合同金额",service:"采购内容",taxRate:"含税说明",
 deliveryDays:"交付期限",deliveryMethod:"交付方式",
 settleMethod:"结算方式",projectName:"项目名称"
};
for(const [key,label] of ENTITY_FIELDS){
 LABELS["a"+key]="甲方"+label;
 LABELS["b"+key]="乙方"+label;
}
const COMMON_FIELDS=[
 {key:"service",label:"采购内容 / 产品服务",type:"textarea",required:true},
 {key:"amount",label:"合同总金额（元）",type:"number",required:true},
 {key:"taxRate",label:"含税说明",type:"text",required:true},
 {key:"deliveryDays",label:"交付期限（自然日）",type:"number",required:true},
 {key:"deliveryMethod",label:"交付方式",type:"text",required:true},
 {key:"settleMethod",label:"结算方式",type:"select",options:["预付","后付"],required:true}
];

const PURCHASE=`通用采购协议

甲方：{{aName}}
地址：{{aAddress}}
联系人：{{aContact}}
联系电话：{{aPhone}}

乙方：{{bName}}
地址：{{bAddress}}
联系人：{{bContact}}
联系电话：{{bPhone}}

鉴于，甲方有意向乙方购买产品/服务，乙方愿意向甲方提供满足甲方需求的产品/服务。现根据《中华人民共和国民法典》，经双方友好协商，就甲方采购乙方{{service}}产品/服务事宜签订本协议，以资共同遵守。

一、采购内容
{{service}}

二、交付与验收
1、本合同签订后{{deliveryDays}}个自然日内，乙方以{{deliveryMethod}}方式向甲方交付本合同约定产品/服务，如涉及包装、运输、安装等，相关费用由乙方承担。
2、甲方应于收货后三个工作日内进行验收，如有异议，应及时向乙方提出由乙方自费进行退换货等调整。
3、如乙方未按照本合同约定进行交付，每逾期一日，应按照合同总额万分之五的标准向甲方支付违约金。

三、结算
1、本合同总金额为人民币{{amount}}元（含税：{{taxRate}}）。
2、结算方式：{{settleMethod}}。
3、甲方开票信息：{{aInvoice}}
4、乙方收款信息：
账户名称：{{bAccountName}}
开户行：{{bBank}}
银行账号：{{bAccount}}

四、双方权利与义务
1、乙方保证所提供的产品/服务符合国家、行业相关标准以及本附件规定的质量标准。

五、知识产权与保密
1、乙方保证对其提供的产品/服务具有合法有效知识产权或已获得相关权利人的授权。

六、违约责任
6.1、甲方未按本合同约定付款的，每逾期一日，按照合同总金额的千分之一向乙方支付违约金。

七、不可抗力
1、因不可抗力导致一方不能履行或延迟履行本协议，受影响的一方不承担违约责任。

八、争议管辖
1、因本合同引起的争议，双方应友好协商解决。协商不成的，任一方均有权将其提交至甲方住所地人民法院诉讼。

九、其他
1、本合同经双方加盖公章或合同章后生效。

（以下无正文，为签字页）`.replace("6.1、","1、");

const NDA=`保密承诺函

致：{{bName}}（下称“贵方”或“披露方”）

本司，{{aName}}（下称“本司”或“接收方”），鉴于本司与贵方拟开展的{{projectName}}项目（下称“项目”）中，贵方作为信息披露方将向本司披露若干保密信息。本司作为保密信息接收方，特此就项目保密事宜，向贵方郑重承诺如下：

第一条 保密信息
1.1 本函件所称保密信息，是指贵方向本司提供的或因项目由本司知悉的与贵方商业秘密有关的所有信息，包括但不限于商业计划、战略及融资计划、交易方案、财务信息、产品信息等。
1.2 保密信息不论纸质、电子、声像或其他形式。

第二条 保密义务
2.1 本司对与项目有关的及在开展项目过程中知悉的保密信息负有保密义务，无论项目是否成立均不得泄露。

第三条 保密信息专有权
3.1 本司理解并同意，保密信息及与之相关的权利均为贵方的专有财产。

第四条 违约责任
4.1 本司违反本函件约定将给贵方造成重大和不能挽回的损害，本司应赔偿因此给贵方造成的全部损失。

第五条 生效及其他
5.1 本承诺函自本司加盖公章之日起生效。

特此承诺。
承诺方：{{aName}}（公章）`;

/* ---------- 工具和数据 ---------- */
const $=id=>document.getElementById(id);
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({
 "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
}[c]));
const clone=x=>JSON.parse(JSON.stringify(x));
const now=()=>new Date().toISOString();
const uid=p=>p+(globalThis.crypto?.randomUUID?
 crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2));
const user=id=>USERS.find(u=>u.id===id);
const userName=id=>user(id)?.name||"—";
const fmt=v=>v?new Date(v).toLocaleString("zh-CN",{hour12:false}):"—";
const money=v=>v===""||v==null?"—":Number(v).toLocaleString("zh-CN",{style:"currency",currency:"CNY"});
function need(ok,message="当前账号无权执行此操作。"){if(!ok)throw Error(message)}
function B(action,text,id="",cls=""){
 return `<button type="button" data-action="${esc(action)}" data-id="${esc(id)}" class="${esc(cls)}">${text}</button>`;
}
function KV(k,v){return `<div class="kv"><span>${esc(k)}</span><b>${esc(v??"—")}</b></div>`}
function H(title,sub,buttons=""){
 return `<div class="head"><div><h1>${title}</h1><div class="muted">${sub}</div></div><div class="actions">${buttons}</div></div>`;
}
function MH(title){
 return `<div class="modalhead"><h2>${title}</h2>${B("close","关闭","","small")}</div>`;
}
let toastTimer;
function toast(message){
 document.querySelector(".toast")?.remove();
 const div=document.createElement("div");
 div.className="toast";div.textContent=message;
 document.body.append(div);clearTimeout(toastTimer);
 toastTimer=setTimeout(()=>div.remove(),4200);
}
function fresh(){
 return {schema:7,revision:0,seq:100000,contracts:[],messages:[],logs:[],templates:[
  {id:"t1",code:"TPL-001",name:"通用采购协议",type:"采购协议",signType:"bilateral",
   body:PURCHASE,fields:clone(COMMON_FIELDS),version:1,enabled:true,history:[]},
  {id:"t2",code:"TPL-002",name:"保密承诺函",type:"单方函件",signType:"unilateral",
   body:NDA,fields:[{key:"projectName",label:"项目名称",type:"text",required:true}],
   version:1,enabled:true,history:[]}

/* ---------- 原件存储 ---------- */
function openDB(){
 if(filePromise)return filePromise;
 filePromise=new Promise((resolve,reject)=>{
  if(!window.indexedDB){reject(Error("浏览器不支持附件存储。"));return}
  const req=indexedDB.open(FILEDB,1);
  req.onupgradeneeded=()=>req.result.createObjectStore("files",{keyPath:"id"});
  req.onsuccess=()=>resolve(req.result);
  req.onerror=()=>reject(Error("无法打开附件存储。"));
 }).catch(e=>{filePromise=null;throw e});
 return filePromise;
}
async function saveFile(blob,name){
 const database=await openDB();
 const meta={id:uid("file-"),name:name||blob.name,type:blob.type,size:blob.size};
 await new Promise((resolve,reject)=>{
  const t=database.transaction("files","readwrite");
  t.objectStore("files").put({...meta,blob});
  t.oncomplete=resolve;
  t.onerror=()=>reject(Error("附件保存失败。"));
  t.onabort=()=>reject(Error("附件保存已中止。"));
 });
 return meta;
}
async function readFile(id){
 const database=await openDB();
 return new Promise((resolve,reject)=>{
  const r=database.transaction("files").objectStore("files").get(id);
  r.onsuccess=()=>resolve(r.result);
  r.onerror=()=>reject(Error("附件读取失败。"));
 });
}
function download(name,content,type="application/octet-stream"){
 const blob=content instanceof Blob?content:new Blob([content],{type});
 const url=URL.createObjectURL(blob),a=document.createElement("a");
 a.href=url;a.download=name;document.body.append(a);a.click();a.remove();
 setTimeout(()=>URL.revokeObjectURL(url),30000);
}
async function attachment(c,preview=false){
 need(visible(c));need(c.file?.id,"暂无上传原件。");
 const actor=account,stored=await readFile(c.file.id);
 need(account===actor&&visible(get(c.id)),"账号或权限已变化。");
 need(stored?.blob,"本浏览器未找到对应原件。");
 if(!tx(()=>log(preview?"预览附件":"下载附件",stored.name,get(c.id))))return;
 if(!preview||!/\.(pdf|png|jpe?g)$/i.test(stored.name)){
  download(stored.name,stored.blob);return;
 }
 const url=URL.createObjectURL(stored.blob);
 modal(`${MH(esc(stored.name))}${/\.pdf$/i.test(stored.name)?
 `<iframe class="pdf" src="${url}"></iframe>`:
 `<img class="scanimg" src="${url}" alt="合同扫描件">`}`,"large");
 urls.push(url);
}

/* ---------- 文件解析与双主体识别 ---------- */
async function parseDocx(buffer){
 const data=new Uint8Array(buffer),view=new DataView(buffer);
 need(data.length>=22,"DOCX 文件无效。");
 let end=-1;
 for(let i=data.length-22;i>=Math.max(0,data.length-65557);i--){
  if(view.getUint32(i,true)===0x06054b50){end=i;break}
 }
 need(end>=0,"未找到 DOCX 压缩目录。");
 const count=view.getUint16(end+10,true);let p=view.getUint32(end+16,true);
 for(let n=0;n<count;n++){
  need(p+46<=data.length&&view.getUint32(p,true)===0x02014b50,"DOCX 目录损坏。");
  const method=view.getUint16(p+10,true),size=view.getUint32(p+20,true),
   unpacked=view.getUint32(p+24,true),nl=view.getUint16(p+28,true),
   el=view.getUint16(p+30,true),cl=view.getUint16(p+32,true),off=view.getUint32(p+42,true);
  need(p+46+nl+el+cl<=data.length,"DOCX 目录越界。");
  const name=new TextDecoder().decode(data.subarray(p+46,p+46+nl));
  if(name==="word/document.xml"){
   need(unpacked<=8*1024*1024,"DOCX 解压正文过大。");
   need(off+30<=data.length,"DOCX 数据损坏。");
   const start=off+30+view.getUint16(off+26,true)+view.getUint16(off+28,true);
   need(start+size<=data.length,"DOCX 数据不完整。");
   let bytes=data.subarray(start,start+size);
   if(method===8){
    need(typeof DecompressionStream!=="undefined","浏览器不支持 DOCX 解压，请使用新版 Chrome 或 Edge。");
    const reader=new Blob([bytes]).stream().pipeThrough(new DecompressionStream("deflate-raw")).getReader();
    const chunks=[];let total=0;
    try{
     while(true){
      const r=await reader.read();if(r.done)break;
      total+=r.value.length;
      need(total<=8*1024*1024,"DOCX 解压体积超限。");
      chunks.push(r.value);
     }
    }catch(e){await reader.cancel();throw e}
    bytes=new Uint8Array(total);let offset=0;
    for(const chunk of chunks){bytes.set(chunk,offset);offset+=chunk.length}
   }else need(method===0,"不支持此 DOCX 压缩方式。");
   const xml=new DOMParser().parseFromString(new TextDecoder().decode(bytes),"application/xml");
   need(!xml.getElementsByTagName("parsererror").length,"DOCX 正文解析失败。");
   return [...xml.getElementsByTagNameNS("*","p")].map(paragraph=>
    [...paragraph.getElementsByTagNameNS("*","t")].map(t=>t.textContent).join("")).join("\n");
  }
  p+=46+nl+el+cl;
 }
 throw Error("未找到 DOCX 正文。");
}
async function extract(file){
 const ext=file.name.split(".").pop().toLowerCase();
 if(["txt","md"].includes(ext))return file.text();
 if(ext==="docx")return parseDocx(await file.arrayBuffer());
 if(ext==="pdf"){
  const lib=await import("https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.min.mjs");
  lib.GlobalWorkerOptions.workerSrc="https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.worker.min.mjs";
  const doc=await lib.getDocument({
   data:new Uint8Array(await file.arrayBuffer()),isEvalSupported:false
  }).promise;
  try{
   need(doc.numPages<=100,"PDF 超过 100 页，请拆分文件。");
   let text="";
   for(let n=1;n<=doc.numPages;n++){
    const page=await doc.getPage(n),content=await page.getTextContent();let y=null;
    for(const item of content.items){
     if(!("str" in item))continue;
     const ny=item.transform?.[5];
     if(y!==null&&Math.abs(ny-y)>3)text+="\n";
     text+=item.str+(item.hasEOL?"\n":" ");y=ny;
    }
    text+="\n\n";need(text.length<=150000,"提取正文过长。");
   }
   return text.trim();
  }finally{await doc.destroy()}
 }
 throw Error("不支持此文件格式。");
}
function recognize(text){
 const t=String(text).replace(/\r/g,"").replace(/\u00a0/g," ");
 const result={},ambiguous=[];
 const aliases={
  Name:"(?:公司名称|企业名称|单位名称|主体名称)",
  Credit:"(?:统一社会信用代码|社会信用代码|纳税人识别号|税号)",
  Address:"(?:注册地址|联系地址|通讯地址|住所地|住所|地址)",
  Legal:"(?:法定代表人|法人代表)",
  Contact:"(?:联系人|经办人)",
  Phone:"(?:联系电话|联系手机|手机号码|手机号|电话|手机)",
  Email:"(?:电子邮箱|电子邮件|邮箱|Email|E-mail)",
  Bank:"(?:开户银行|开户行)",
  Account:"(?:银行账号|银行帐号|收款账号|收款帐号|账号|帐号)",
  AccountName:"(?:银行账户名称|收款账户名称|账户名称|开户名称|开户名|户名)",
  Invoice:"(?:开票信息|发票信息)"
 };
 const trimValue=s=>String(s||"").trim().replace(/[；;，,]+$/,"");
 const collect=(regex,source)=>{
  const values=[];
  for(const m of source.matchAll(regex)){
   const value=trimValue(m[1]);if(value&&!values.includes(value))values.push(value);
  }
  return values;
 };
 for(const [party,prefix] of [["甲方","a"],["乙方","b"]]){
  const other=party==="甲方"?"乙方":"甲方";
  const block=new RegExp(`${party}\\s*(?:[（(][^\\n）)]{0,25}[）)])?\\s*[:：]([^]*?)(?=\\n\\s*${other}\\s*(?:[（(][^\\n）)]{0,25}[）)])?\\s*[:：]|$)`,"g");
  const blocks=[...t.matchAll(block)].map(m=>m[1].slice(0,2500));
  const nameRegex=new RegExp(`(?:^|\\n|[ \\t])${party}\\s*(?:[（(][^\\n）)]{0,25}[）)])?\\s*[:：]\\s*([^\\n]{2,150})`,"g");
  const names=collect(nameRegex,t).map(v=>v.split(/\s+(?:乙方|甲方|地址|联系人|联系电话)\s*[:：]/)[0].trim());
  const unique=[...new Set(names.filter(Boolean))];
  if(unique.length===1)result[prefix+"Name"]=unique[0];
  else if(unique.length>1)ambiguous.push(LABELS[prefix+"Name"]);
  for(const [field,label] of Object.entries(aliases)){
   const explicit=new RegExp(`${party}\\s*(?:的)?\\s*${label}\\s*[:：]\\s*([^\\n;；]{1,200})`,"gi");
   let values=collect(explicit,t);
   if(!values.length){
    const blockValues=[];
    for(const b of blocks){
     const regex=new RegExp(`(?:^|\\n|[ \\t])${label}\\s*[:：]\\s*([^\\n;；]{1,200})`,"gi");
     blockValues.push(...collect(regex,b));
    }
    values=[...new Set(blockValues)];
   }
   if(field==="Phone")values=values.map(v=>v.match(/(?:\+?86[- ]?)?1[3-9]\d{9}|0\d{2,3}[- ]?\d{7,8}(?:-\d+)?/)?.[0]||"").filter(Boolean);
   if(field==="Email")values=values.map(v=>v.match(/[A-Z0-9._%+-]+@[A-Z0-9.-]+\.[A-Z]{2,}/i)?.[0]||"").filter(Boolean);
   if(field==="Credit")values=values.map(v=>v.match(/[A-Z0-9]{18}/i)?.[0]||"").filter(Boolean);
   if(field==="Account")values=values.map(v=>v.match(/\d[\d -]{6,35}\d/)?.[0]?.replace(/[ -]/g,"")||"").filter(Boolean);
   values=[...new Set(values)];
   if(field==="Name"&&result[prefix+"Name"])continue;
   if(values.length===1)result[prefix+field]=values[0];
   else if(values.length>1)ambiguous.push(LABELS[prefix+field]);
  }
 }
 const amount=t.match(/(?:合同总金额|合同金额|合同总价|总价款|人民币)\s*(?:为|是|:|：)?\s*(?:人民币)?\s*[¥￥]?\s*([\d,，]+(?:\.\d{1,2})?)\s*(万元|元)/);
 if(amount){
  const n=Number(amount[1].replace(/[,，]/g,""))*(amount[2]==="万元"?10000:1);
  if(Number.isFinite(n))result.amount=n.toFixed(2);
 }
 return {values:result,ambiguous:[...new Set(ambiguous)]};
}
function adopt(key,overwrite=false){
 const control=$("editForm")?.elements.namedItem(key),value=editor?.recognized[key];
 if(!control||value==null||(!overwrite&&String(control.value).trim()))return false;
 control.value=value;return true;
}
function renderRecognition(ambiguous=[]){
 $("recognizeBox").hidden=false;
 $("recognizeBox").innerHTML=`
 <div class="actions between"><b style="font-size:12px">识别结果 · 待核对</b>${B("fill-empty","回填空字段","","small")}</div>
 ${Object.entries(editor.recognized).map(([k,v])=>`<div class="recrow"><span>${esc(LABELS[k]||k)}</span><strong>${esc(v)}</strong>${B("adopt","采用",k)}</div>`).join("")||'<p class="muted">未识别到足够明确的信息，请根据原件填写。</p>'}
 ${ambiguous.length?`<p class="muted">存在多个候选值，未自动回填：${esc(ambiguous.join("、"))}</p>`:""}
 <p class="muted" style="margin-bottom:0">未识别字段保留原值；“采用”覆盖单项。请核对所有信息与原件一致。</p>`;
}
async function uploadContract(file){
 const e=editor;
 need(e&&e.mode==="nonstandard"&&!e.busy,"正在读取文件，请稍候。");
 need(file&&/\.(pdf|docx|txt|md)$/i.test(file.name)&&file.size<=15*1024*1024,"仅支持 PDF、DOCX、TXT、MD，最大 15 MB。");
 if($("editBody").value.trim()&&!confirm("新文件将替换编辑区正文，是否继续？"))return;
 const before=$("editBody").value;
 e.busy=true;$("saveEditor").disabled=true;
 $("uploadState").textContent="正在读取 "+file.name+"……";
 try{
  e.file=await saveFile(file);if(editor!==e)return;
  if(e.url)URL.revokeObjectURL(e.url);
  e.url=URL.createObjectURL(file);
  const text=String(await extract(file)).trim();if(editor!==e)return;
  need(text,"未提取到文本。扫描 PDF 需先 OCR；原件已保存，可人工粘贴正文。");
  need(text.length<=150000,"正文超过长度限制。");
  need($("editBody").value===before,"读取期间正文已修改，未覆盖当前内容。");
  $("editBody").value=text;
  const recognized=recognize(text);e.recognized=recognized.values;
  let n=0;for(const key of Object.keys(e.recognized))if(adopt(key))n++;
  e.parseNote=`识别 ${Object.keys(e.recognized).length} 项，回填 ${n} 个空字段`;
  $("uploadState").textContent=`${file.name} · ${text.length} 字符 · ${e.parseNote}`;
  const title=$("editForm").elements.namedItem("title");
  if(["","非标合同"].includes(title.value.trim()))title.value=file.name.replace(/\.[^.]+$/,"");
  renderRecognition(recognized.ambiguous);livePreview();
 }catch(error){
  if(editor===e){
   e.parseNote="文本解析未成功，需人工核对";
   $("uploadState").textContent=error.message;toast(error.message);
  }
 }finally{
  e.busy=false;
  if(editor===e)$("saveEditor").disabled=false;
 }
}

 }
}

}
function submit(c){

 // 不执行任何登录账号与甲方主体一致性检查。
 if(c.mode==="standard")need(db.templates.some(t=>t.id===c.tplId&&t.enabled),"模板已停用。");

function openReview(c,pass){
 need(canApprove(c));const financial=me().role==="finance";

function flow(c){
 const names=c.mode==="standard"?["填写","免审批","甲方签署","乙方签署","完成"]:
 ["填写","主管分派","法务审批","财务审批","甲方签署","乙方签署","完成"];
 const map=c.mode==="standard"?
 {draft:0,returned:0,ready:2,signed_a:3,pending_b:3,completed:4,unilateral_done:4}:
 {draft:0,returned:0,assign:1,legal:2,finance:3,ready:4,signed_a:5,pending_b:5,completed:6,unilateral_done:6};
 const active=map[c.status]??0;
 return `<div class="flow">${names.map((n,i)=>`<div class="step ${i<active?"done":i===active?"active":""}"><i>${i<active?"✓":i+1}</i>${n}</div>`).join("")}</div>`;
}
function contractActions(c){
 let out="";
 if(canEdit(c))out+=B("edit","修改合同",c.id,"primary")+B("submit","提交申请",c.id);
 if(me()?.role==="biz"&&c.owner===account){
  if(["assign","legal","finance"].includes(c.status))out+=B("withdraw","撤回",c.id);
  if(canSign(c))out+=B("sign","进入签署中心",c.id,"primary");
  if(c.status==="pending_b")out+=B("open-b","打开乙方签署页",c.id)+B("resend","重新发送链接",c.id);
  if(!["completed","unilateral_done","terminated"].includes(c.status))out+=B("terminate","终止",c.id,"danger");
  if(["completed","unilateral_done"].includes(c.status))out+=B("archive-download","下载合同",c.id);
 }
 if(me()?.role==="chief"&&["assign","legal"].includes(c.status))out+=B("assign",c.status==="assign"?"分派法务":"改派法务",c.id,"primary");
 if(canApprove(c))out+=B("approve","审批通过",c.id,"primary")+B("reject","退回业务",c.id,"danger");
 return out||'<span class="muted">当前节点无需你处理</span>';
}

function openVersion(c,n,diff){
 need(visible(c));
 const v=c.versions.find(v=>v.version===n);need(v);
 let html=`<div class="docbody">${esc(v.body)}</div>`;
 if(diff){
  const prev=c.versions.find(v=>v.version===n-1);need(prev);
  let fields="",lines="";
  const keys=new Set([...Object.keys(prev.data),...Object.keys(v.data)]);
  for(const k of keys)if(prev.data[k]!==v.data[k]){
   fields+=`<h3>${esc(LABELS[k]||k)}</h3><div class="diffold">− ${esc(prev.data[k]||"（空）")}</div><div class="diffnew">+ ${esc(v.data[k]||"（空）")}</div>`;
  }
  const a=prev.body.split("\n"),b=v.body.split("\n");
  for(let i=0;i<Math.max(a.length,b.length);i++)if(a[i]!==b[i]){
   lines+=`<div class="muted">第 ${i+1} 行</div><div class="diffold">− ${esc(a[i]??"（无）")}</div><div class="diffnew">+ ${esc(b[i]??"（删除）")}</div>`;
  }
  html=`<div class="tip">逐行对比用于定位变化；插入或删除行可能造成后续行错位，请结合全文审阅。</div>
  <h2>字段差异</h2>${fields||'<p class="muted">无变化</p>'}
  <h2 style="margin-top:20px">正文差异</h2>${lines||'<p class="muted">无变化</p>'}`;
 }
 if(!tx(()=>log(diff?"查看版本差异":"查看历史版本",`V${n}`,c)))return;
 modal(`${MH(diff?`V${n-1} → V${n}`:`版本 V${n}`)}${html}`,"large");
}

function signLink(c,party){
 const invite=party==="a"?c.aInvite:c.bInvite;

  page:"sign",id:c.id,party,token:invite.token
 }).toString();

function signingContext(){
 const c=get(route.get("id")),party=route.get("party"),token=route.get("token");
 need(c&&["a","b"].includes(party),"签署任务不存在。");
 const invite=party==="a"?c.aInvite:c.bInvite;
 need(invite&&invite.token===token&&invite.version===c.version&&c.signVersion===c.version,"签署链接无效或版本已变化。");
 need(c.status!=="terminated","该协议已终止。");
 if(!c.signatures?.[party])need(invite.expiresAt>Date.now(),"签署链接已失效，请联系业务重新发送。");
 if(party==="b")need(c.signType==="bilateral"&&c.signatures.a,"甲方尚未完成签署。");
 return {c,party,token,invite};
}

 need(canSign(c));

 need(popup,"请允许浏览器打开新页面。");

  if(!c.aInvite||c.aInvite.expiresAt<Date.now()){
   c.aInvite={token:uid("a-"),version:c.version,expiresAt:Date.now()+3*86400000,actorId:account};
  }
  log("进入签署中心","打开独立模拟法大大页面。",c);
 });

function simulateSend(c,actor){
 need(c.signatures.a&&c.signType==="bilateral"&&["signed_a","pending_b"].includes(c.status),"当前合同不能发送乙方签署链接。");
 need(/^1[3-9]\d{9}$/.test(c.data.bPhone),"乙方手机号不正确。");
 c.bInvite={token:uid("b-"),version:c.version,expiresAt:Date.now()+3*86400000,phone:c.data.bPhone};
 c.status="pending_b";c.sentAt=now();
 log("模拟发送乙方签署链接",`模拟短信收件号码：${c.data.bPhone}；有效期 3 天，未实际发送短信。`,c,actor);
 message(c.owner,"甲方已签署，乙方签署链接已模拟发送",c);
}
function archive(c){
 need(c.signatures.a&&c.signatures.b&&c.signType==="bilateral");
 c.status="completed";c.archivedAt=now();c.archiveNo="ARC-"+c.no;
 log("自动归档","双方已完成模拟签署，自动进入合同汇总表。",c,SYSTEM);
 message(c.owner,"双方签署完成，合同已自动归档",c);
 for(const u of USERS.filter(u=>["chief","legal","finance"].includes(u.role))){
  message(u.id,"新增已归档合同："+c.title,c);
 }

function renderSign(){
 try{

  const verified=verifiedToken===token;
  $("app").innerHTML=`
  <header class="signheader"><div><span class="signbrand">法大大</span>
  <span class="tag blue" style="margin-left:10px">模拟签署平台</span></div>
  <span class="muted">${party==="a"?"甲方签章":"乙方签署"} · V${c.version}</span></header>
  <div class="signpage">
  <div class="tip">当前为本地模拟签署流程，验证码、短信和印章不具有真实平台签名能力。</div>
  ${done?`<div class="card"><h1>${party==="a"?"甲方签署已完成":"乙方签署已完成"}</h1>
   ${party==="a"&&c.signType==="bilateral"?
    `<p>已向乙方联系电话 <b>${esc(c.data.bPhone)}</b> 模拟发送签署链接。</p>
    <div class="actions">${B("sign-open-b","打开乙方签署页面","","primary")}${B("sign-copy-b","复制乙方签署链接")}
    ${c.status!=="completed"?B("sign-resend","重新模拟发送"):""}</div>
    <p class="muted" style="margin-top:12px">同一浏览器中打开链接即可继续乙方签署。</p>`:
    `<p>${c.signType==="unilateral"?"单方协议办理完成，保留在业务“已签署”；按汇总表双签规则，不进入合同汇总表。":"甲乙双方均已签署完成，系统已自动归档至合同汇总表。"}</p>`}
   ${c.archivedAt?KV("归档编号",c.archiveNo):""}</div>`:
   !verified?`<div class="card" style="max-width:480px;margin:30px auto">
   <h1>签署身份验证</h1>
   <p class="muted">${party==="a"?"甲方":"乙方"}：${esc(party==="a"?c.data.aName:c.data.bName)}</p>
   ${KV("联系人",party==="a"?c.data.aContact:c.data.bContact)}${KV("联系电话",phone)}
   <div class="actions" style="margin-top:18px">${B("sign-code","获取模拟验证码")}
   <input id="verifyCode" placeholder="6 位验证码" maxlength="6" inputmode="numeric" style="width:140px"></div>
   <div class="tip" style="margin-top:15px">点击获取后，页面会显示本次模拟验证码。</div>
   ${B("sign-verify","验证并查看合同","","primary")}</div>`:""}
  ${done||verified?docHTML(c):""}</div>
  ${!done&&verified?`<footer class="signfooter"><div class="actions between" style="max-width:960px;margin:auto">
  <label><input type="checkbox" id="agreeSign"> 我已阅读并确认当前版本合同内容</label>
  <div class="actions"><span class="muted">${esc(party==="a"?c.data.aName:c.data.bName)}</span>
  ${B("sign-confirm",party==="a"?"确认甲方签章":"确认乙方签署","","primary")}</div></div></footer>`:""}`;
 }catch(e){
  $("app").innerHTML=`<div class="login"><div class="logincard"><h1>签署链接不可用</h1><p>${esc(e.message)}</p><p class="muted">请联系发起业务重新发送有效链接。</p></div></div>`;
 }
}
async function signingAction(action){
 const {c,party,token,invite}=signingContext();
 const actor=party==="a"?(user(invite.actorId)||SYSTEM):{
  id:"external:"+c.id,name:c.data.bContact||c.data.bName,title:"乙方签署人",role:"external"
 };
 if(action==="sign-code"){
  if(tx(()=>log("获取模拟签署验证码",`签署方：${party==="a"?"甲方":"乙方"}；验证码未通过真实短信发送。`,c,actor))){
   sentCodeToken=token;toast("本次模拟验证码：123456");
  }
  return;
 }
 if(action==="sign-verify"){
  need(sentCodeToken===token&&$("verifyCode")?.value==="123456","请先获取模拟验证码，再填写 123456。");
  if(tx(()=>log("通过模拟身份验证",party==="a"?"甲方验证通过。":"乙方验证通过。",c,actor))){
   verifiedToken=token;renderSign();
  }
  return;
 }
 if(action==="sign-confirm"){
  need(verifiedToken===token&&$("agreeSign")?.checked,"请先验证身份并勾选合同确认。");
  tx(()=>{
   const current=signingContext().c;
   need(!current.signatures[party],"当前签署方已完成签署。");
   if(party==="a")need(current.status==="ready","合同不在甲方签署阶段。");
   else need(current.status==="pending_b"&&current.signatures.a,"合同不在乙方签署阶段。");
   current.signatures[party]={
    at:now(),by:actor.name,actorId:actor.id,version:current.version,source:"simulation"
   };
   log(party==="a"?"甲方模拟签章完成":"乙方模拟签署完成",`已确认 V${current.version}。`,current,actor);
   if(party==="a"){
    if(current.signType==="unilateral"){
     current.status="unilateral_done";
     message(current.owner,"单方协议已完成签署",current);
     log("单方协议办理完成","按双签归档规则，不进入合同汇总表。",current,SYSTEM);
    }else{
     current.status="signed_a";simulateSend(current,SYSTEM);
    }
   }else archive(current);
  });
  return;
 }
 if(action==="sign-open-b"){
  need(party==="a"&&c.bInvite);
  window.open(signLink(c,"b"),"_blank","noopener,noreferrer");return;
 }
 if(action==="sign-resend"){
  need(party==="a");tx(()=>simulateSend(c,actor));return;
 }
 if(action==="sign-copy-b"){
  need(party==="a"&&c.bInvite);await copyLink(signLink(c,"b"));
 }
}
async function copyLink(value){

  await navigator.clipboard.writeText(value);toast("签署链接已复制。");

  modal(`${MH("复制签署链接")}<label class="field">选择并复制下方链接<textarea id="copyText" readonly>${esc(value)}</textarea></label>`);
  $("copyText").select();
 }
}

 <div class="modalfoot">${B("close","取消")}<button class="primary" id="importSave">确认导入并归档</button></div>
 </form>`);
}
async function validateScan(file){
 need(file instanceof Blob&&file.size>0&&file.size<=30*1024*1024,"请选择不超过 30 MB 的扫描件。");
 need(/\.(pdf|jpe?g|png)$/i.test(file.name),"仅支持 PDF、JPG、PNG。");
 const bytes=new Uint8Array(await file.slice(0,1024).arrayBuffer());
 if(/\.pdf$/i.test(file.name))need(new TextDecoder().decode(bytes).includes("%PDF-"),"PDF 文件头无效。");
 else if(/\.png$/i.test(file.name))need(bytes[0]===137&&bytes[1]===80&&bytes[2]===78&&bytes[3]===71,"PNG 文件头无效。");
 else need(bytes[0]===255&&bytes[1]===216,"JPEG 文件头无效。");
}
async function saveImport(form,values){
 need(hasSummary());
 if(form.dataset.busy==="1")return;
 const actor=account,button=$("importSave");
 form.dataset.busy="1";button.disabled=true;
 try{
  need(values.confirmed,"请确认双方均已盖章。");
  need(values.title.trim()&&values.aName.trim()&&values.bName.trim()&&values.note.trim(),"请填写完整信息。");
  if(values.amount)need(/^\d+(\.\d{1,2})?$/.test(values.amount)&&Number(values.amount)<=999999999999,"金额格式不正确。");
  const signed=new Date(values.signedDate+"T12:00:00");
  need(Number.isFinite(signed.getTime()),"签署日期无效。");
  const endToday=new Date();endToday.setHours(23,59,59,999);
  need(signed<=endToday,"签署完成日期不能晚于今天。");
  await validateScan(values.file);
  need(account===actor&&hasSummary()&&$("importForm")===form,"账号或窗口已变化。");
  const file=await saveFile(values.file);
  need(account===actor&&hasSummary()&&$("importForm")===form,"账号或窗口已变化。");
  tx(()=>{
   const at=signed.toISOString();
   const c={
    id:uid("c-"),no:`QN-${new Date().getFullYear()}-${++db.seq}`,
    title:values.title.trim(),owner:account,dept:me().dept,
    mode:"imported",status:"completed",version:1,signVersion:1,
    data:{aName:values.aName.trim(),bName:values.bName.trim(),amount:values.amount||""},
    body:"纸质协议扫描件，合同内容以导入原件为准。",
    type:"采购协议",signType:"bilateral",file,fields:[],
    template:"",tplId:"",tplCode:"纸质导入",tplVersion:null,
    createdAt:now(),updatedAt:now(),versions:[],approvals:[],participants:[],
    assignee:null,financeEntered:false,aInvite:null,bInvite:null,
    signatures:{
     a:{at,by:values.aName.trim(),source:"paper"},
     b:{at,by:values.bName.trim(),source:"paper"}
    },
    archivedAt:now()
   };
   c.archiveNo="ARC-"+c.no;
   db.contracts.unshift(c);
   versions(c,"导入纸质扫描件："+values.note.trim());
   log("导入纸质协议",values.note.trim(),c);
   for(const u of USERS.filter(u=>["chief","legal","finance"].includes(u.role))){
    message(u.id,"新增已归档合同："+c.title,c);
   }
   view="summary";page=1;
  });
 }finally{
  if($("importForm")===form){form.dataset.busy="0";button.disabled=false}
 }
}

/* ---------- 模板、消息、日志 ---------- */
function templatesPage(){
 need(me()?.role==="chief");
 return H("合同模板","保留模板选择、模板版本和自定义字段。",B("template-new","新增模板","","primary"))+
 db.templates.map(t=>`<div class="card"><div class="actions between">
 <div><h2 style="margin:0">${esc(t.name)} <span class="tag">${esc(t.code)} · V${t.version}</span>
 <span class="tag ${t.enabled?"green":""}">${t.enabled?"启用中":"已停用"}</span></h2>
 <div class="muted">${esc(t.type)} · ${t.signType==="unilateral"?"单方协议":"双方协议"}</div></div>
 <div class="actions">${B("template-edit","编辑发布",t.id)}${B("template-toggle",t.enabled?"停用":"启用",t.id)}</div>
 </div></div>`).join("");
}
function templateEditor(id=""){
 need(me()?.role==="chief");
 const t=db.templates.find(x=>x.id===id);
 if(id)need(t,"模板不存在。");
 modal(`${MH(t?"编辑模板":"新增模板")}
 <form id="templateForm" data-id="${esc(id)}" data-version="${t?.version||0}">
 <div class="formgrid">
 ${input("模板名称 *","name",t?.name||"","text",'required maxlength="100"')}
 <label class="field">合同类型<select name="type">${TYPES.map(v=>`<option ${t?.type===v?"selected":""}>${v}</option>`).join("")}</select></label>
 <label class="field">签署方式<select name="signType"><option value="bilateral">双方协议</option><option value="unilateral" ${t?.signType==="unilateral"?"selected":""}>单方协议</option></select></label>
 <label class="field">上传模板正文<input type="file" id="templateUpload" accept=".docx,.txt,.md"></label></div>
 <label class="field">正文 *<textarea id="templateBody" name="body" required maxlength="150000" style="min-height:260px">${esc(t?.body||"")}</textarea></label>
 <div class="tip">甲乙方字段使用 {{aName}}、{{aAddress}}、{{aContact}}、{{aPhone}}、{{bName}} 等；业务字段按下方定义。</div>
 <label class="field">业务字段 JSON *<textarea name="fields" required style="min-height:170px;font-family:monospace">${esc(JSON.stringify(t?.fields||COMMON_FIELDS,null,2))}</textarea>
 <span class="muted">type 支持 text、textarea、number、select；select 的 options 为字符串数组。</span></label>
 ${input("发布说明 *","note","","text",'required maxlength="1000"')}
 <div class="modalfoot">${B("close","取消")}<button class="primary">发布</button></div></form>`,"large");
}
function validateTemplateFields(value){
 let fields;
 try{fields=JSON.parse(value)}catch{throw Error("业务字段 JSON 格式错误。")}
 need(Array.isArray(fields)&&fields.length<=100,"业务字段必须是数组，最多 100 项。");
 const used=new Set();
 const reserved=new Set([
  "title","type","signType","body","note","__proto__","prototype","constructor",
  ...ENTITY_FIELDS.flatMap(([k])=>["a"+k,"b"+k])
 ]);
 for(const f of fields){
  need(f&&typeof f==="object"&&/^[A-Za-z][A-Za-z0-9_]{0,49}$/.test(f.key||""),"字段 key 应以英文字母开头，仅包含字母、数字及下划线。");
  need(!reserved.has(f.key)&&!used.has(f.key),"字段 key 重复或与系统字段冲突："+f.key);
  used.add(f.key);
  need(typeof f.label==="string"&&f.label.trim(),"字段名称不能为空。");
  need(["text","textarea","number","select"].includes(f.type),"字段类型不正确。");
  if(f.type==="select")need(Array.isArray(f.options)&&f.options.length>0&&f.options.every(x=>typeof x==="string"),"下拉字段 options 必须是非空字符串数组。");
 }
 return fields.map(f=>({
  key:f.key,label:f.label.trim(),type:f.type,required:!!f.required,
  ...(f.type==="select"?{options:f.options}: {})
 }));
}
function messagesPage(){
 const rows=db.messages.filter(m=>m.to===account);
 return H("消息通知","分派、审批、退回与签署完成提醒。",B("read-all","全部已读"))+
 `<div class="card">${rows.map(m=>`<div class="kv"><div><b>${!m.read?"● ":""}${esc(m.title)}</b><div class="muted">${fmt(m.at)}</div></div>${B("open-message","查看",m.id,"small")}</div>`).join("")||'<div class="empty">暂无消息</div>'}</div>`;
}
function logsPage(){
 const rows=ownLogs();
 return H("操作日志",me().role==="chief"?"法务主管可查看全部账号、乙方签署人及系统操作记录。":"仅展示当前账号自己的操作记录。",
 B("export-logs","导出日志"))+
 `<div class="card">${logHTML(rows.slice(-150))}${rows.length>150?'<p class="muted">页面展示最近 150 条，导出包含全部有权限查看的记录。</p>':""}</div>`;
}
function exportLogs(){
 const rows=ownLogs();
 const out=[["时间","操作人","岗位","操作","详情","合同ID","版本"]];
 rows.forEach(r=>out.push([fmt(r.at),r.name,r.role,r.action,r.detail,r.cid,r.version||""]));
 if(!tx(()=>log("导出操作日志",`导出 ${rows.length} 条有权限查看的记录。`)))return;
 download("操作日志.csv","\uFEFF"+out.map(r=>r.map(csvCell).join(",")).join("\r\n"),"text/csv;charset=utf-8");
}

/* ---------- 表单事件 ---------- */
document.addEventListener("submit",async event=>{
 event.preventDefault();
 const form=event.target;
 if(!(form instanceof HTMLFormElement)||!form.reportValidity())return;
 const values=Object.fromEntries(new FormData(form));
 try{
  if(form.id==="loginForm"){
   need(user(values.account)&&values.password===PASSWORD,"账号或密码错误。");
   const id=values.account;
   if(tx(()=>log("登录系统","进入账号工作区。",null,user(id)))){
    account=id;view="home";page=1;render();
   }
   return;
  }
  need(me(),"请先登录。");
  if(form.id==="editForm"){saveEditor(form);return}
  if(form.id==="assignForm"){
   tx(()=>{
    const c=get(form.dataset.id);
    need(c&&me().role==="chief"&&c.mode==="nonstandard"&&
     ["assign","legal"].includes(c.status)&&c.version===Number(form.dataset.version));
    need(user(values.assignee)?.role==="legal"&&values.reason.trim(),"请选择法务并填写说明。");
    const old=c.assignee;
    need(c.status==="assign"||old!==values.assignee,"请选择不同的承办法务。");
    c.assignee=values.assignee;c.status="legal";
    c.participants=[...new Set([...(c.participants||[]),c.assignee])];
    log(old?"改派法务":"分派法务",
     `${old?"原法务："+userName(old)+"；":""}承办法务：${userName(c.assignee)}；${values.reason.trim()}`,c);
    message(c.assignee,"收到待审批合同："+c.title,c);
    if(old&&old!==c.assignee)message(old,"合同已改派其他法务："+c.title,c);
   });
   return;
  }
  if(form.id==="reviewForm"){
   tx(()=>{
    const c=get(form.dataset.id);
    need(c&&canApprove(c)&&c.version===Number(form.dataset.version),"合同版本、状态或审批权限已变化。");
    const pass=form.dataset.pass==="1",financial=me().role==="finance";
    need(values.opinion.trim(),"请填写审批意见。");
    if(pass)need(values.checked,"请先勾选核对确认。");
    const node=financial?"财务审批":"法务审批";
    c.approvals.push({
     id:uid("approval-"),version:c.version,node,result:pass?"通过":"退回",
     byId:account,by:me().name,at:now(),opinion:values.opinion.trim()
    });
    log(node+(pass?"通过":"退回"),values.opinion.trim(),c);
    if(!pass){
     c.status="returned";c.legalVersion=null;c.financeVersion=null;
     c.returnReason=node+"退回："+values.opinion.trim();
     message(c.owner,c.returnReason,c);
    }else if(financial){
     c.financeVersion=c.version;enterSigning(c);
    }else{
     c.legalVersion=c.version;c.status="finance";c.financeEntered=true;
     message(FINANCE,"收到待财务审批合同："+c.title,c);
     log("进入财务审批","法务已通过，自动提交孙会计审批。",c,SYSTEM);
    }
   });
   return;
  }
  if(form.id==="reasonForm"){
   tx(()=>{
    const c=get(form.dataset.id),kind=form.dataset.kind;
    need(c&&me().role==="biz"&&c.owner===account);
    need(values.reason.trim(),"请填写操作原因。");
    if(kind==="withdraw"){
     need(["assign","legal","finance"].includes(c.status),"当前状态不能撤回。");
     c.status="draft";c.legalVersion=null;c.financeVersion=null;
     c.returnReason="业务撤回："+values.reason.trim();
     log("撤回申请",values.reason.trim(),c);
    }else{
     need(kind==="terminate"&&!["completed","unilateral_done","terminated"].includes(c.status),"当前状态不能终止。");
     c.status="terminated";c.aInvite=null;c.bInvite=null;
     log("终止流程",values.reason.trim(),c);
    }
   });
   return;
  }
  if(form.id==="importForm"){await saveImport(form,values);return}
  if(form.id==="templateForm"){
   need(me().role==="chief");
   need(form.dataset.busy!=="1","模板正在读取，请稍候。");
   const fields=validateTemplateFields(values.fields);
   need(values.name.trim()&&values.body.trim()&&values.note.trim(),"请填写模板名称、正文和发布说明。");
   tx(()=>{
    let t=db.templates.find(x=>x.id===form.dataset.id);
    if(form.dataset.id){
     need(t&&t.version===Number(form.dataset.version),"模板版本已变化。");
     const snapshot=clone(t);delete snapshot.history;
     t.history=t.history||[];
     t.history.push({...snapshot,at:now(),by:me().name,note:values.note.trim()});
     Object.assign(t,{
      name:values.name.trim(),body:values.body.trim(),fields,
      type:values.type,signType:values.signType,version:t.version+1
     });
    }else{
     const maxCode=Math.max(0,...db.templates.map(x=>Number(String(x.code).replace(/^TPL-/,""))||0));
     t={
      id:uid("tpl-"),code:"TPL-"+String(maxCode+1).padStart(3,"0"),
      name:values.name.trim(),type:values.type,signType:values.signType,
      body:values.body.trim(),fields,version:1,enabled:true,history:[]
     };
     db.templates.push(t);
    }
    log("发布合同模板",`${t.code} · V${t.version}；${values.note.trim()}`);
   });
  }
 }catch(e){toast(e.message||"操作失败。")}
});

/* ---------- 按钮事件 ---------- */
document.addEventListener("click",async event=>{
 const button=event.target.closest?.("button[data-action]");
 if(!button||button.disabled)return;
 const action=button.dataset.action,id=button.dataset.id||"";
 try{
  if(action==="close"){closeModal();return}
  if(signingPage){
   if(action.startsWith("sign-"))await signingAction(action);
   return;
  }
  need(me(),"请先登录。");
  if(action==="logout"){
   if(tx(()=>log("退出系统","退出账号工作区。"))){
    account="";view="home";filters={q:"",status:"",mode:"",days:""};
    render();
   }
   return;
  }
  if(action==="go"){
   const allowed=["home","messages","logs",
    ...(me().role==="biz"?["create","pending","signed"]:["tasks","handled"]),
    ...(hasSummary()?["summary"]:[]),
    ...(me().role==="chief"?["templates"]:[])
   ];
   need(allowed.includes(id));closeModal();
   view=id;page=1;filters={q:"",status:"",mode:"",days:""};render();return;
  }
  if(action==="new-standard"){openEditor("",id);return}
  if(action==="new-nonstandard"){openEditor();return}
  if(action==="convert"){convert();return}
  if(action==="adopt"){need(editor);adopt(id,true);livePreview();return}
  if(action==="fill-empty"){
   need(editor);
   for(const key of Object.keys(editor.recognized))adopt(key);
   livePreview();return;
  }
  if(action==="editor-original"){await editorOriginal();return}
  if(action==="filter"){
   filters={
    q:$("filterQ").value.trim(),mode:$("filterMode").value,
    status:$("filterStatus")?.value||"",days:$("filterDays").value
   };
   page=1;render();return;
  }
  if(action==="clear-filter"){
   filters={q:"",status:"",mode:"",days:""};page=1;render();return;
  }
  if(action==="page"){page+=Number(id);render();return}
  if(action==="tab"){
   need(["document","approvals","versions","logs"].includes(id));
   tab=id;render();return;
  }
  if(action==="import"){openImport();return}
  if(action==="export-summary"){exportSummary();return}
  if(action==="export-logs"){exportLogs();return}
  if(action==="template-new"){templateEditor();return}
  if(action==="template-edit"){templateEditor(id);return}
  if(action==="template-toggle"){
   need(me().role==="chief");
   tx(()=>{
    const t=db.templates.find(x=>x.id===id);need(t);
    t.enabled=!t.enabled;log(t.enabled?"启用合同模板":"停用合同模板",t.name);
   });return;
  }
  if(action==="read-all"){
   tx(()=>{db.messages.filter(m=>m.to===account).forEach(m=>m.read=true)});
   return;
  }
  if(action==="open-message"){
   const m=db.messages.find(x=>x.id===id&&x.to===account);need(m);
   const c=get(m.cid);need(c&&visible(c),"当前无权查看该合同。");
   tx(()=>{m.read=true;cid=c.id;tab="document";view="detail"});
   return;
  }
  const c=get(id);
  need(c&&visible(c),"合同不存在或无权查看。");
  if(action==="detail"){cid=c.id;view="detail";tab="document";render();return}
  if(action==="edit"){openEditor(c.id);return}
  if(action==="submit"){tx(()=>submit(c));return}
  if(action==="assign"){openAssign(c);return}
  if(action==="approve"){openReview(c,true);return}
  if(action==="reject"){openReview(c,false);return}
  if(action==="withdraw"){openReason(c,"withdraw");return}
  if(action==="terminate"){openReason(c,"terminate");return}
  if(action==="sign"){openSignCenter(c);return}
  if(action==="open-b"){
   need(me().role==="biz"&&c.owner===account&&c.bInvite&&c.status==="pending_b");
   window.open(signLink(c,"b"),"_blank","noopener,noreferrer");return;
  }
  if(action==="resend"){
   need(me().role==="biz"&&c.owner===account);
   tx(()=>simulateSend(c,me()));return;
  }
  if(action==="preview-original"){await attachment(c,true);return}
  if(action==="download-original"){await attachment(c,false);return}
  if(action==="archive-preview"){await archivePreview(c);return}
  if(action==="archive-download"){await archiveDownload(c);return}
  if(action==="version"||action==="diff"){
   openVersion(c,Number(button.dataset.version),action==="diff");
  }
 }catch(e){toast(e.message||"操作失败。")}
});

/* ---------- 字段、文件、拖放 ---------- */
document.addEventListener("input",event=>{
 if(editor&&event.target.closest?.("#editForm"))livePreview();
});
document.addEventListener("change",async event=>{
 const target=event.target;
 try{
  if(target.id==="partyPick"){
   if(target.value)chooseParty(target.value);
   return;
  }
  if(target.id==="contractUpload"){
   if(target.files?.[0])await uploadContract(target.files[0]);
   target.value="";return;
  }
  if(target.id==="templateUpload"){
   const file=target.files?.[0];if(!file)return;
   const form=$("templateForm");need(form&&me()?.role==="chief");
   need(form.dataset.busy!=="1","正在读取模板，请稍候。");
   need(/\.(docx|txt|md)$/i.test(file.name)&&file.size<=15*1024*1024,"模板支持 DOCX、TXT、MD，最大 15 MB。");
   const actor=account,body=$("templateBody"),before=body.value;
   if(before.trim()&&!confirm("上传内容将替换模板正文，是否继续？")){
    target.value="";return;
   }
   form.dataset.busy="1";
   const save=form.querySelector('button:not([type="button"])');
   if(save)save.disabled=true;
   try{
    const text=String(await extract(file)).trim();
    need(account===actor&&$("templateForm")===form,"账号或窗口已变化。");
    need(text&&text.length<=150000,"模板正文为空或超过长度限制。");
    need(body.value===before,"读取期间正文已修改，未覆盖当前内容。");
    body.value=text;
   }finally{
    if($("templateForm")===form){
     form.dataset.busy="0";
     if(save)save.disabled=false;
     target.value="";
    }
   }
   return;
  }
  if(editor&&target.closest?.("#editForm"))livePreview();
 }catch(e){toast(e.message||"处理失败。")}
});
document.addEventListener("dragover",event=>{
 const area=event.target.closest?.("#uploadTop");
 if(area&&editor?.mode==="nonstandard"){
  event.preventDefault();area.classList.add("drag");
 }
});
document.addEventListener("dragleave",event=>{
 const area=event.target.closest?.("#uploadTop");
 if(area&&!area.contains(event.relatedTarget))area.classList.remove("drag");
});
document.addEventListener("drop",async event=>{
 const area=event.target.closest?.("#uploadTop");
 if(!area||editor?.mode!=="nonstandard")return;
 event.preventDefault();area.classList.remove("drag");
 try{
  const file=event.dataTransfer?.files?.[0];
  if(file)await uploadContract(file);
 }catch(e){toast(e.message||"上传失败。")}
});

/* ---------- 多页面同步与初始化 ---------- */
window.addEventListener("storage",event=>{
 if(event.key!==STORE)return;
 try{
  if(!event.newValue){
   closeModal();db=fresh();account="";render();
   toast("本地数据已在其他页面清除。");return;
  }
  sync();
  if(editor){
   toast("其他页面更新了数据；保存时会检查版本，请先保留当前填写内容。");
   return;
  }
  render();
 }catch(e){toast("同步本地数据失败："+e.message)}
});
window.addEventListener("hashchange",()=>location.reload());
render();
