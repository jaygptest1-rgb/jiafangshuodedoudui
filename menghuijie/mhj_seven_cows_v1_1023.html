<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>七七七合同管理系统</title>
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Sans+SC:wght@400;500;600;700&family=Noto+Serif+SC:wght@500;600;700&display=swap">
<style>

:root{
  --brand:#2067E8; --brand-2:#1B57CE; --brand-3:#4D8DF2; --brand-deep:#1443A8; --brand-soft:#EAF2FE; --brand-line:#D4E4FB;
  --ink:#1F3A66; --ink-2:#2067E8; --ink-3:#4D8DF2; --ink-dark:#173C78; --ink-soft:#A9C6EE;
  --red:#C0392B; --red-deep:#A93226; --red-bg:#FBE9E5;
  --paper:#FFFFFF; --card:#FFFFFF; --line:#E4EDFB; --line-strong:#C9DCF6;
  --text:#22303E; --muted:#5B6E8C; --faint:#9AA9C0;
  --green:#2E8B63; --green-bg:#E6F4ED;
  --amber:#B97A24; --amber-bg:#F9EFDC;
  --fill:#FFF3D2; --fill-line:#D9A93C;
  --radius:10px; --shadow:0 1px 2px rgba(32,103,232,.06),0 4px 16px rgba(32,103,232,.07);
  --font-ui:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,-apple-system,sans-serif;
  --font-doc:"Noto Serif SC","Songti SC","SimSun",serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:var(--font-ui);color:var(--text);background:var(--paper);font-size:14px;-webkit-font-smoothing:antialiased}
#app{min-width:1180px;height:100vh;display:flex}
button{font-family:var(--font-ui);cursor:pointer}
input,select,textarea{font-family:var(--font-ui)}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#BFD4F2;border-radius:6px;border:2px solid var(--paper)}
::-webkit-scrollbar-track{background:transparent}

/* ===== 侧边栏 ===== */
.sidebar{width:236px;flex:0 0 236px;background:linear-gradient(180deg,#2E7CF0 0%,#1C5FD2 100%);color:#D5E6FB;display:flex;flex-direction:column;position:relative;z-index:10}
.side-logo{display:flex;align-items:center;gap:11px;padding:20px 18px 16px}
.logo-tile{width:40px;height:40px;border-radius:10px;background:#FFF;display:flex;align-items:center;justify-content:center;box-shadow:0 3px 10px rgba(13,43,94,.25);flex:0 0 40px;overflow:hidden}
.logo-tile img{width:34px;height:auto;display:block}
.logo-cow{font-size:15px;font-weight:800;color:#165DFF;letter-spacing:1px;line-height:1;font-style:italic}
.side-logo .name{font-size:14.5px;font-weight:700;color:#FFF;letter-spacing:.3px;line-height:1.35}
.side-logo .sub{font-size:10px;color:#B4CCF2;margin-top:2px;letter-spacing:1.2px}
.side-nav{flex:1;padding:8px 12px}
.nav-item{display:flex;align-items:center;gap:11px;padding:11px 13px;border-radius:8px;color:#C0D6F5;font-size:13.5px;cursor:pointer;margin-bottom:3px;border-left:3px solid transparent;transition:background .15s,color .15s;user-select:none}
.nav-item svg{flex:0 0 18px}
.nav-item:hover{background:rgba(255,255,255,.1);color:#FFF}
.nav-item.active{background:rgba(255,255,255,.18);color:#FFF;border-left-color:#FFF;font-weight:600}
.nav-group{font-size:11px;color:#8FB4EA;padding:16px 13px 7px;letter-spacing:2px}
.side-foot{padding:14px 18px;border-top:1px solid rgba(255,255,255,.18);font-size:11px;color:#A9C6EE;line-height:1.7}
.side-foot .badge{display:inline-block;background:rgba(255,255,255,.18);color:#FFF;padding:2px 8px;border-radius:10px;font-size:10px;margin-bottom:6px;letter-spacing:1px}

/* ===== 主区域 ===== */
.main{flex:1;display:flex;flex-direction:column;min-width:0}
.topbar{height:64px;background:var(--card);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:18px;padding:0 28px;flex:0 0 64px}
.topbar .crumb{display:flex;align-items:baseline;gap:10px;min-width:0}
.crumb h1{font-size:17px;font-weight:700;color:var(--ink);white-space:nowrap}
.crumb .desc{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top-search{flex:1;max-width:360px;position:relative;margin-left:auto}
.top-search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--faint)}
.top-search input{width:100%;height:36px;border:1px solid var(--line-strong);border-radius:8px;background:#F5F9FF;padding:0 12px 0 36px;font-size:13px;color:var(--text);outline:none;transition:border .15s,box-shadow .15s}
.top-search input:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(32,103,232,.12);background:#FFF}
.top-user{display:flex;align-items:center;gap:12px;margin-left:8px}
.bell{position:relative;width:36px;height:36px;border-radius:8px;border:1px solid var(--line-strong);background:var(--card);display:flex;align-items:center;justify-content:center;color:var(--muted)}
.bell:hover{color:var(--brand);border-color:var(--brand-3)}
.bell .dot{position:absolute;top:7px;right:8px;width:7px;height:7px;border-radius:50%;background:var(--red);border:1.5px solid #FFF}
.user-chip{display:flex;align-items:center;gap:10px}
.avatar{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,#3E87F4,#1B57CE);color:#FFF;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600}
.user-chip .u-name{font-size:13px;font-weight:600;color:var(--text)}
.user-chip .u-role{font-size:11px;color:var(--muted)}
.content{flex:1;overflow-y:auto;padding:26px 28px 40px}

/* ===== 通用组件 ===== */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:36px;padding:0 16px;border-radius:8px;border:1px solid transparent;font-size:13px;font-weight:500;transition:all .15s;white-space:nowrap}
.btn svg{flex:0 0 16px}
.btn-primary{background:var(--brand-2);color:#FFF}
.btn-primary:hover{background:var(--brand-deep)}
.btn-red{background:var(--red);color:#FFF}
.btn-red:hover{background:var(--red-deep)}
.btn-ghost{background:var(--card);border-color:var(--line-strong);color:var(--text)}
.btn-ghost:hover{border-color:var(--brand-3);color:var(--brand-2)}
.btn-sm{height:30px;padding:0 12px;font-size:12.5px;border-radius:7px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;gap:5px;padding:2.5px 9px;border-radius:20px;font-size:11.5px;font-weight:500;white-space:nowrap}
.chip::before{content:"";width:5px;height:5px;border-radius:50%;background:currentColor}
.chip-green{background:var(--green-bg);color:var(--green)}
.chip-red{background:var(--red-bg);color:var(--red-deep)}
.chip-amber{background:var(--amber-bg);color:var(--amber)}
.chip-blue{background:var(--brand-soft);color:var(--brand-deep)}
.chip-gray{background:#EDF1F6;color:#5B6B7D}
.tag{display:inline-block;padding:2px 8px;border-radius:5px;background:#EDF1F6;color:#55667B;font-size:11px;margin-right:6px}
.tbl{width:100%;border-collapse:collapse}
.tbl th{font-size:12px;color:var(--muted);font-weight:600;text-align:left;padding:10px 14px;border-bottom:1px solid var(--line);background:#F3F8FF;white-space:nowrap}
.tbl td{padding:12px 14px;border-bottom:1px solid #EDF3FC;font-size:13px;vertical-align:middle}
.tbl tbody tr{transition:background .12s}
.tbl tbody tr:hover{background:#F7FAFF}
.tbl .cell-main{font-weight:600;color:var(--ink);cursor:pointer}
.tbl .cell-sub{font-size:11.5px;color:var(--muted);margin-top:2px}
.tbl .mono{font-family:ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;font-size:12.5px;color:#3D5A8C}
.empty{padding:56px 20px;text-align:center;color:var(--muted)}
.empty svg{margin:0 auto 12px;color:#BFD3EF;display:block}
.empty .e-title{font-size:14px;font-weight:600;color:#5B6E8C;margin-bottom:4px}
.empty .e-sub{font-size:12.5px}
.kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:22px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px 20px;position:relative;overflow:hidden}
.kpi::after{content:"";position:absolute;right:-18px;top:-18px;width:74px;height:74px;border-radius:50%;background:radial-gradient(circle,rgba(32,103,232,.07),transparent 70%)}
.kpi .k-label{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:7px}
.kpi .k-label svg{color:var(--brand)}
.kpi .k-num{font-size:30px;font-weight:700;color:var(--ink);margin:8px 0 4px;font-variant-numeric:tabular-nums;letter-spacing:-.5px}
.kpi .k-foot{font-size:11.5px;color:var(--muted)}
.kpi .k-foot .up{color:var(--green);font-weight:600}
.section-title{display:flex;align-items:center;justify-content:space-between;margin:26px 0 14px}
.section-title h2{font-size:15px;font-weight:700;color:var(--ink);display:flex;align-items:center;gap:9px}
.section-title h2::before{content:"";width:4px;height:15px;border-radius:2px;background:var(--brand)}
.section-title .more{font-size:12px;color:var(--brand);cursor:pointer}
.section-title .more:hover{text-decoration:underline}

/* ===== 工作台 ===== */
.flow-wrap{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:22px 24px}
.flow-head{display:flex;align-items:center;gap:12px;margin-bottom:20px}
.flow-head .f-title{font-size:15px;font-weight:700;color:var(--ink)}
.flow-auto{display:inline-flex;align-items:center;gap:6px;background:var(--green-bg);color:var(--green);font-size:11.5px;font-weight:600;padding:3px 10px;border-radius:20px;margin-left:auto}
.flow{display:grid;grid-template-columns:repeat(6,1fr);gap:0;position:relative}
.flow .fstep{text-align:center;position:relative;padding:0 8px}
.flow .fstep:not(:last-child)::after{content:"";position:absolute;top:19px;left:calc(50% + 26px);width:calc(100% - 52px);height:2px;background:var(--line-strong);border-top:2px dashed #C9DCF6}
.flow .f-ic{width:40px;height:40px;border-radius:50%;margin:0 auto 10px;display:flex;align-items:center;justify-content:center;background:var(--brand-soft);color:var(--brand);border:1.5px solid var(--brand-line);position:relative;z-index:1}
.flow .fstep.done .f-ic{background:var(--green-bg);color:var(--green);border-color:var(--green)}
.flow .fstep.hot .f-ic{background:var(--red-bg);color:var(--red);border-color:var(--red)}
.flow .f-name{font-size:12.5px;font-weight:600;color:var(--ink)}
.flow .f-desc{font-size:11px;color:var(--muted);margin-top:3px;line-height:1.5}
.flow .f-auto{display:inline-block;font-size:10px;color:var(--brand-deep);background:var(--brand-soft);border-radius:8px;padding:1px 6px;margin-top:5px;font-weight:600}
.dash-cols{display:grid;grid-template-columns:1.4fr 1fr;gap:16px}
.recent-item{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid #EDF3FC}
.recent-item:last-child{border-bottom:none}
.recent-item .r-ic{width:34px;height:34px;border-radius:8px;background:var(--brand-soft);color:var(--brand);display:flex;align-items:center;justify-content:center;flex:0 0 34px}
.recent-item .r-main{flex:1;min-width:0}
.recent-item .r-name{font-size:13px;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.recent-item .r-sub{font-size:11.5px;color:var(--muted);margin-top:2px}
.recent-item .r-right{text-align:right;flex:0 0 auto}
.recent-item .r-time{font-size:11px;color:var(--faint)}
.bar-chart{display:flex;align-items:flex-end;gap:18px;height:130px;padding:10px 6px 0;border-bottom:1px solid var(--line);margin:6px 14px 0}
.bar-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:7px;height:100%;justify-content:flex-end}
.bar-col .b-val{font-size:11px;font-weight:700;color:var(--brand-deep);font-variant-numeric:tabular-nums}
.bar-col .b-bar{width:60%;border-radius:5px 5px 0 0;background:linear-gradient(180deg,#4D8DF2,#2067E8);min-height:3px;transition:height .4s}
.bar-col .b-bar.hot{background:linear-gradient(180deg,#F29B66,#E85B3F)}
.bar-col .b-lab{font-size:11px;color:var(--muted)}
.expiry-item{display:flex;align-items:center;gap:11px;padding:11px 16px;border-bottom:1px solid #EDF3FC}
.expiry-item:last-child{border-bottom:none}
.expiry-item .e-days{width:44px;height:44px;border-radius:10px;background:var(--amber-bg);color:var(--amber);display:flex;flex-direction:column;align-items:center;justify-content:center;flex:0 0 44px;font-weight:700;line-height:1.1}
.expiry-item .e-days .n{font-size:15px}
.expiry-item .e-days .u{font-size:9px;font-weight:500}
.expiry-item .e-main{flex:1;min-width:0}
.expiry-item .e-name{font-size:12.5px;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.expiry-item .e-sub{font-size:11px;color:var(--muted);margin-top:2px}

/* ===== 订立合同向导 ===== */
.wizard{margin:0 auto;max-width:1060px}
.stepper{display:flex;align-items:flex-start;margin:6px 0 24px}
.step{flex:1;display:flex;flex-direction:column;align-items:center;position:relative}
.step:not(:last-child)::after{content:"";position:absolute;top:17px;left:calc(50% + 24px);width:calc(100% - 48px);height:2px;background:var(--line-strong)}
.step.done:not(:last-child)::after{background:var(--brand)}
.step .s-ic{width:34px;height:34px;border-radius:50%;background:#F0F5FD;border:1.5px solid var(--brand-line);color:var(--muted);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;position:relative;z-index:1;transition:all .2s}
.step.done .s-ic{background:var(--brand);border-color:var(--brand);color:#FFF}
.step.active .s-ic{background:var(--brand-2);border-color:var(--brand-2);color:#FFF;box-shadow:0 0 0 5px rgba(32,103,232,.15)}
.step .s-name{font-size:12.5px;font-weight:600;margin-top:9px;color:var(--muted)}
.step.active .s-name{color:var(--ink)}
.step.done .s-name{color:var(--brand-deep)}
.step .s-sub{font-size:10.5px;color:var(--faint);margin-top:2px}

.tpl-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.tpl-card{border:1.5px solid var(--line);border-radius:12px;background:var(--card);padding:20px 18px;cursor:pointer;transition:all .15s;position:relative}
.tpl-card:hover{border-color:var(--brand-3);box-shadow:var(--shadow);transform:translateY(-2px)}
.tpl-card.sel{border-color:var(--brand);box-shadow:0 0 0 3px rgba(32,103,232,.12),var(--shadow)}
.tpl-card .t-ic{width:42px;height:42px;border-radius:10px;display:flex;align-items:center;justify-content:center;margin-bottom:13px}
.tpl-card .t-name{font-size:14.5px;font-weight:700;color:var(--ink)}
.tpl-card .t-tag{display:inline-block;font-size:10.5px;color:var(--brand-deep);background:var(--brand-soft);border-radius:4px;padding:1.5px 7px;margin-top:7px;font-weight:600}
.tpl-card .t-scene{font-size:12px;color:var(--muted);line-height:1.6;margin:11px 0 6px;min-height:38px}
.tpl-card .t-fields{font-size:11px;color:var(--faint);display:flex;align-items:center;gap:5px}
.tpl-card .t-check{position:absolute;top:14px;right:14px;width:22px;height:22px;border-radius:50%;background:var(--brand);color:#FFF;display:none;align-items:center;justify-content:center}
.tpl-card.sel .t-check{display:flex}

.form-card{padding:26px 30px}
.form-sec{margin-bottom:24px}
.form-sec:last-child{margin-bottom:4px}
.form-sec h3{font-size:13.5px;font-weight:700;color:var(--ink);display:flex;align-items:center;gap:8px;margin-bottom:15px;padding-bottom:9px;border-bottom:1px solid var(--line)}
.form-sec h3 .sec-no{width:20px;height:20px;border-radius:6px;background:var(--brand);color:#FFF;font-size:11px;display:flex;align-items:center;justify-content:center}
.form-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px 18px}
.f-item{display:flex;flex-direction:column;gap:6px}
.f-item.wide{grid-column:span 2}
.f-item.full{grid-column:span 3}
.f-item label{font-size:12px;font-weight:600;color:#3D5A8C}
.f-item label .req{color:var(--red);margin-left:2px}
.f-item input,.f-item select,.f-item textarea{border:1px solid var(--line-strong);border-radius:7px;padding:8.5px 11px;font-size:13px;color:var(--text);outline:none;background:#FFF;transition:border .15s,box-shadow .15s;width:100%}
.f-item textarea{resize:vertical;min-height:66px}
.f-item input:focus,.f-item select:focus,.f-item textarea:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(32,103,232,.12)}
.f-item input.invalid,.f-item select.invalid,.f-item textarea.invalid{border-color:var(--red);box-shadow:0 0 0 3px rgba(192,57,43,.1)}
.f-item .hint{font-size:11px;color:var(--faint)}
.f-item .hint-err{font-size:11px;color:var(--red);display:none}
.f-item input.invalid ~ .hint-err,.f-item select.invalid ~ .hint-err{display:block}
.f-item .prefix{position:relative}
.f-item .prefix input{padding-left:60px}
.f-item .prefix .px{position:absolute;left:11px;top:50%;transform:translateY(-50%);font-size:11px;color:var(--muted);font-family:ui-monospace,Menlo,Consolas,monospace}
.big-note{display:flex;gap:11px;align-items:flex-start;padding:12px 15px;border-radius:9px;background:var(--amber-bg);border:1px solid #F0D9AE;font-size:12.5px;color:#7A5418;line-height:1.8;margin-bottom:20px}
.big-note svg{flex:0 0 17px;margin-top:2px}
.wiz-actions{display:flex;align-items:center;justify-content:space-between;margin-top:26px;padding-top:20px;border-top:1px solid var(--line)}
.wiz-actions .right{display:flex;gap:10px}

/* ===== 合同文书 ===== */
.doc-stage{display:grid;grid-template-columns:1fr 320px;gap:20px;align-items:start}
.doc-paper{background:#FFFEFB;border:1px solid var(--line-strong);border-radius:4px;box-shadow:0 8px 30px rgba(32,103,232,.10);padding:46px 52px;font-family:var(--font-doc);font-size:14.5px;line-height:2.05;color:#2B2B28;position:relative;max-height:640px;overflow-y:auto}
.doc-paper .doc-head{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:2px solid #2B2B28;padding-bottom:14px;margin-bottom:22px}
.doc-paper .doc-no{font-size:12px;color:#6B675E;font-family:var(--font-ui)}
.doc-paper .doc-no b{color:#2B2B28;font-size:12.5px}
.doc-paper .doc-title{font-size:21px;font-weight:700;text-align:center;letter-spacing:6px;margin:6px 0 4px}
.doc-paper .doc-sub{text-align:center;font-size:12px;color:#6B675E;letter-spacing:2px;margin-bottom:22px}
.doc-paper .part{font-weight:700;margin:16px 0 6px;font-size:15px}
.doc-paper .clause{text-indent:2em;margin:4px 0}
.doc-paper .fill{background:var(--fill);border-bottom:1px dashed var(--fill-line);padding:0 3px;border-radius:2px}
.doc-paper .sign-row{display:flex;justify-content:space-between;margin-top:46px;padding-top:18px;border-top:1px dashed #C9C4B6}
.doc-paper .sign-box{text-align:center;font-size:12.5px;color:#55524B;line-height:2.2;position:relative}
.doc-paper .sign-box .sb-line{display:inline-block;border-bottom:1px solid #55524B;min-width:170px;padding-bottom:2px}
.party-seal{position:absolute;left:52%;top:56%;transform:translate(-50%,-50%) rotate(-4deg);opacity:.95;pointer-events:none}
.party-seal.stamp-in{animation:stampIn .55s cubic-bezier(.22,1.4,.36,1) forwards}
.doc-paper .seal-water{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);opacity:.07;pointer-events:none}
.doc-side{display:flex;flex-direction:column;gap:14px;position:sticky;top:0}
.side-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px}
.side-card h4{font-size:13px;font-weight:700;color:var(--ink);margin-bottom:13px;display:flex;align-items:center;gap:7px}
.side-card h4::before{content:"";width:3px;height:13px;border-radius:2px;background:var(--brand)}
.side-card h4 .h4-tag{margin-left:auto;font-size:10.5px;font-weight:600}
.meta-row{display:flex;justify-content:space-between;font-size:12.5px;padding:6.5px 0;border-bottom:1px dashed #EDF3FC}
.meta-row:last-child{border-bottom:none}
.meta-row .mk{color:var(--muted)}
.meta-row .mv{color:var(--text);font-weight:500;text-align:right}
.link-box{margin-top:11px;border:1px dashed var(--brand-3);border-radius:8px;background:var(--brand-soft);padding:9px 11px;font-size:11.5px;color:var(--brand-deep);word-break:break-all;position:relative;padding-right:46px;font-family:ui-monospace,Menlo,Consolas,monospace;line-height:1.6}
.link-box .copy-btn{position:absolute;right:5px;top:5px;height:26px;padding:0 8px;border-radius:6px;border:none;background:var(--brand);color:#FFF;font-size:11px;display:flex;align-items:center;gap:4px}
.link-box .copy-btn:hover{background:var(--brand-deep)}
.pipe{display:flex;flex-direction:column;gap:0}
.pipe-item{display:flex;gap:12px;position:relative;padding-bottom:20px}
.pipe-item:last-child{padding-bottom:0}
.pipe-item::before{content:"";position:absolute;left:13px;top:30px;bottom:2px;width:2px;background:var(--line-strong)}
.pipe-item:last-child::before{display:none}
.pipe-ic{width:28px;height:28px;border-radius:50%;flex:0 0 28px;display:flex;align-items:center;justify-content:center;background:#F0F5FD;color:var(--muted);border:1.5px solid var(--brand-line);position:relative;z-index:1}
.pipe-item.done .pipe-ic{background:var(--green-bg);color:var(--green);border-color:var(--green)}
.pipe-item.running .pipe-ic{background:var(--amber-bg);color:var(--amber);border-color:var(--amber)}
.pipe-item .pipe-main{flex:1;padding-top:3px}
.pipe-item .pipe-name{font-size:12.5px;font-weight:600;color:var(--text)}
.pipe-item .pipe-desc{font-size:11px;color:var(--muted);margin-top:2px}
.spinner{width:14px;height:14px;border:2px solid rgba(185,122,36,.3);border-top-color:var(--amber);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.review-item{display:flex;gap:10px;padding:8px 0;border-bottom:1px dashed #EDF3FC;align-items:flex-start}
.review-item:last-child{border-bottom:none}
.review-item .rv-ic{width:20px;height:20px;border-radius:50%;flex:0 0 20px;display:flex;align-items:center;justify-content:center;margin-top:1px}
.review-item.ok .rv-ic{background:var(--green-bg);color:var(--green)}
.review-item.warn .rv-ic{background:var(--amber-bg);color:var(--amber)}
.review-item .rv-main{flex:1;min-width:0}
.review-item .rv-name{font-size:12.5px;font-weight:600;color:var(--text)}
.review-item .rv-desc{font-size:11px;color:var(--muted);margin-top:1px;line-height:1.6}

/* ===== 印章 ===== */
.seal{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) scale(1.9);opacity:0;pointer-events:none;z-index:5}
.seal.stamp-in{animation:stampIn .55s cubic-bezier(.22,1.4,.36,1) forwards}
@keyframes stampIn{0%{opacity:0;transform:translate(-50%,-50%) scale(2.1) rotate(-8deg)}55%{opacity:1;transform:translate(-50%,-50%) scale(.96) rotate(-3deg)}100%{opacity:1;transform:translate(-50%,-50%) scale(1) rotate(-4deg)}}
.seal svg{display:block}

/* ===== 归档成功 ===== */
.success-wrap{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:44px;text-align:center;max-width:660px;margin:30px auto}
.success-ic{width:64px;height:64px;border-radius:50%;background:var(--green-bg);color:var(--green);display:flex;align-items:center;justify-content:center;margin:0 auto 18px}
.success-wrap h2{font-size:21px;color:var(--ink);margin-bottom:8px}
.success-wrap .s-sub{font-size:13px;color:var(--muted);margin-bottom:26px}
.success-meta{display:grid;grid-template-columns:repeat(2,1fr);gap:0;border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:24px;text-align:left}
.sm-row{display:flex;padding:12px 16px;border-bottom:1px solid var(--line);background:#F7FAFF}
.sm-row:nth-child(odd){border-right:1px solid var(--line)}
.sm-row .mk{font-size:12px;color:var(--muted);width:92px;flex:0 0 92px;align-self:center}
.sm-row .mv{font-size:13px;font-weight:600;color:var(--text);align-self:center}
.sm-row .mv.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;color:#3D5A8C}
.success-link{display:flex;align-items:center;gap:10px;border:1px dashed var(--brand-3);border-radius:9px;background:var(--brand-soft);padding:10px 14px;margin-bottom:24px;text-align:left;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;color:var(--brand-deep)}
.success-link .sl-t{font-family:var(--font-ui);font-size:11.5px;color:var(--muted);flex:0 0 auto}
.success-link .sl-url{flex:1;word-break:break-all;line-height:1.5}
.success-actions{display:flex;gap:12px;justify-content:center}

/* ===== 列表工具栏 ===== */
.list-toolbar{display:flex;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.search-box{position:relative;flex:1;min-width:220px;max-width:340px}
.search-box svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--faint)}
.search-box input{width:100%;height:36px;border:1px solid var(--line-strong);border-radius:8px;padding:0 11px 0 34px;font-size:13px;outline:none;background:var(--card)}
.search-box input:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(32,103,232,.12)}
.select-box{height:36px;border:1px solid var(--line-strong);border-radius:8px;padding:0 10px;font-size:13px;color:var(--text);background:var(--card);outline:none}
.batch-bar{display:flex;align-items:center;gap:12px;background:linear-gradient(90deg,#2569E8,#1B57CE);color:#FFF;border-radius:9px;padding:9px 16px;margin-bottom:14px;animation:slideDown .2s ease}
@keyframes slideDown{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:translateY(0)}}
.batch-bar .b-count{font-size:13px;font-weight:600}
.batch-bar .b-spacer{flex:1}
.tbl td input[type=checkbox],.tbl th input[type=checkbox]{width:16px;height:16px;accent-color:var(--brand);cursor:pointer}

/* ===== 弹窗 ===== */
.modal-overlay{position:fixed;inset:0;background:rgba(13,43,94,.45);backdrop-filter:blur(2px);z-index:100;display:flex;align-items:center;justify-content:center;animation:fadeIn .18s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal{background:var(--card);border-radius:14px;box-shadow:0 24px 70px rgba(13,43,94,.3);width:min(960px,94vw);max-height:88vh;display:flex;flex-direction:column;animation:modalIn .22s cubic-bezier(.2,1.1,.35,1)}
@keyframes modalIn{from{opacity:0;transform:translateY(14px) scale(.985)}to{opacity:1;transform:translateY(0) scale(1)}}
.modal.modal-sm{width:min(460px,92vw)}
.modal-head{display:flex;align-items:center;gap:12px;padding:17px 22px;border-bottom:1px solid var(--line)}
.modal-head h3{font-size:15px;font-weight:700;color:var(--ink);flex:1}
.modal-close{width:30px;height:30px;border-radius:7px;border:none;background:#F0F5FD;color:var(--muted);display:flex;align-items:center;justify-content:center}
.modal-close:hover{background:var(--brand-soft);color:var(--brand-deep)}
.modal-body{padding:20px 22px;overflow-y:auto}
.modal-foot{display:flex;justify-content:flex-end;gap:10px;padding:15px 22px;border-top:1px solid var(--line)}
.modal-view{display:grid;grid-template-columns:1fr 300px;gap:0}
.modal-view .mv-paper{background:#FFFEFB;padding:34px 38px;font-family:var(--font-doc);font-size:13.5px;line-height:2;color:#2B2B28;position:relative;overflow-y:auto;max-height:62vh}
.modal-view .mv-side{padding:20px 22px;border-left:1px solid var(--line);background:#F6FAFF;overflow-y:auto;max-height:62vh}
.void-reason textarea{width:100%;min-height:84px;border:1px solid var(--line-strong);border-radius:8px;padding:10px 12px;font-size:13px;outline:none;resize:vertical}
.void-reason textarea:focus{border-color:var(--red);box-shadow:0 0 0 3px rgba(192,57,43,.1)}
.void-reason .v-tip{font-size:11.5px;color:var(--muted);margin-top:7px}

/* ===== Toast ===== */
.toast-root{position:fixed;right:22px;bottom:22px;z-index:200;display:flex;flex-direction:column;gap:10px}
.toast{background:#173C78;color:#EAF1F8;border-radius:10px;padding:12px 18px;font-size:13px;display:flex;align-items:center;gap:10px;box-shadow:0 10px 30px rgba(13,43,94,.35);animation:toastIn .25s cubic-bezier(.2,1.1,.35,1);max-width:400px}
.toast.out{animation:toastOut .25s ease forwards}
@keyframes toastIn{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:translateX(0)}}
@keyframes toastOut{to{opacity:0;transform:translateX(24px)}}
.toast .t-ic{width:22px;height:22px;border-radius:50%;flex:0 0 22px;display:flex;align-items:center;justify-content:center}
.toast.ok .t-ic{background:var(--green)}
.toast.warn .t-ic{background:var(--amber)}
.toast.err .t-ic{background:var(--red)}

.page-enter{animation:pageIn .25s ease}
@keyframes pageIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}

/* ============================================================
   v3 新增：角色体系 / 标准-非标双流程 / 审核工作流
============================================================ */
.chip-purple{background:#F1ECFA;color:#6C4AB6}
.chip-gray{background:#EDF1F6;color:#5B6B7D}

/* 顶栏角色切换 */
.role-switch{position:relative;display:flex;align-items:center}
.role-switch select{height:36px;border:1px solid var(--line-strong);border-radius:8px;padding:0 30px 0 12px;font-size:12.5px;font-weight:600;color:var(--ink);background:var(--card);outline:none;cursor:pointer;appearance:none;-webkit-appearance:none;transition:border .15s}
.role-switch select:hover{border-color:var(--brand-3)}
.role-switch select:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(32,103,232,.12)}
.role-switch .rs-arrow{position:absolute;right:10px;top:50%;transform:translateY(-50%);pointer-events:none;color:var(--faint)}
.role-switch .rs-ic{position:absolute;left:10px;top:50%;transform:translateY(-50%);pointer-events:none;color:var(--brand)}
.role-switch select{padding-left:32px}

/* 导航待办角标 */
.nav-badge{display:inline-flex;align-items:center;justify-content:center;min-width:18px;height:18px;border-radius:9px;background:var(--red);color:#FFF;font-size:10.5px;font-weight:700;padding:0 5px;margin-left:auto;letter-spacing:0}

/* 标准 / 非标 双入口 */
.kind-tabs{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:20px}
.kind-tab{border:1.5px solid var(--line);border-radius:13px;padding:20px 22px;display:flex;gap:15px;align-items:center;cursor:pointer;transition:all .15s;background:var(--card);text-align:left}
.kind-tab:hover{border-color:var(--brand-3);box-shadow:var(--shadow);transform:translateY(-1px)}
.kind-tab.sel{border-color:var(--brand);box-shadow:0 0 0 3px rgba(32,103,232,.12),var(--shadow)}
.kind-tab .kt-ic{width:48px;height:48px;border-radius:12px;flex:0 0 48px;display:flex;align-items:center;justify-content:center}
.kind-tab .kt-name{font-size:15px;font-weight:700;color:var(--ink);display:flex;align-items:center;gap:8px}
.kind-tab .kt-desc{font-size:12px;color:var(--muted);margin-top:5px;line-height:1.7}
.kind-tab .kt-tag{display:inline-block;font-size:10.5px;font-weight:600;padding:2px 8px;border-radius:4px}

/* 非标上传 */
.ns-form{max-width:860px;margin:0 auto}
.upload-zone{border:1.5px dashed var(--brand-3);border-radius:11px;background:var(--brand-soft);padding:28px;text-align:center;cursor:pointer;transition:all .15s}
.upload-zone:hover{background:#E0EDFE;border-color:var(--brand)}
.upload-zone .uz-ic{width:44px;height:44px;border-radius:50%;background:var(--card);color:var(--brand);display:flex;align-items:center;justify-content:center;margin:0 auto 10px;box-shadow:var(--shadow)}
.upload-zone .uz-main{font-size:13.5px;font-weight:600;color:var(--ink)}
.upload-zone .uz-sub{font-size:11.5px;color:var(--muted);margin-top:4px}
.file-chip{display:inline-flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line-strong);border-radius:8px;padding:8px 13px;font-size:12.5px;color:var(--ink)}
.file-chip svg{color:var(--brand)}
.flow-notice{display:flex;gap:11px;align-items:flex-start;padding:13px 16px;border-radius:9px;background:var(--brand-soft);border:1px solid var(--brand-line);font-size:12.5px;color:#2A5CAD;line-height:1.8;margin-bottom:20px}

/* 审核任务列表 */
.task-item{display:flex;gap:15px;padding:17px 20px;border-bottom:1px solid #EDF3FC;align-items:flex-start;transition:background .12s}
.task-item:hover{background:#F7FAFF}
.task-item .t-ic{width:40px;height:40px;border-radius:10px;flex:0 0 40px;display:flex;align-items:center;justify-content:center}
.task-item .t-main{flex:1;min-width:0}
.task-item .t-name{font-size:13.5px;font-weight:700;color:var(--ink);cursor:pointer}
.task-item .t-name:hover{color:var(--brand-2)}
.task-item .t-sub{font-size:11.5px;color:var(--muted);margin-top:4px;line-height:1.7}
.task-item .t-right{flex:0 0 auto;text-align:right;display:flex;flex-direction:column;gap:8px;align-items:flex-end}

/* 非标流程状态条 */
.flow-strip{display:flex;align-items:center;gap:0;margin:4px 0 2px}
.fs-node{display:flex;align-items:center;gap:7px;flex:1;min-width:0}
.fs-node:last-child{flex:0 0 auto}
.fs-node .fs-dot{width:14px;height:14px;border-radius:50%;flex:0 0 14px;background:#E4EDFB;border:2px solid #C9DCF6}
.fs-node.done .fs-dot{background:var(--green);border-color:var(--green)}
.fs-node.cur .fs-dot{background:var(--brand);border-color:var(--brand);box-shadow:0 0 0 4px rgba(32,103,232,.15)}
.fs-node.warn .fs-dot{background:var(--red);border-color:var(--red)}
.fs-node .fs-line{height:2px;flex:1;background:#E4EDFB;margin:0 8px}
.fs-node.done .fs-line,.fs-node.cur .fs-line{background:var(--brand-3)}
.fs-node .fs-name{font-size:11px;color:var(--muted);white-space:nowrap}
.fs-node.done .fs-name{color:var(--green)}
.fs-node.cur .fs-name{color:var(--brand-deep);font-weight:700}

/* 版本时间线 */
.timeline{margin-top:4px}
.tl-item{display:flex;gap:13px;position:relative;padding-bottom:17px}
.tl-item:last-child{padding-bottom:0}
.tl-item::before{content:"";position:absolute;left:12px;top:26px;bottom:2px;width:2px;background:var(--line-strong)}
.tl-item:last-child::before{display:none}
.tl-dot{width:26px;height:26px;border-radius:50%;flex:0 0 26px;display:flex;align-items:center;justify-content:center;background:#F0F5FD;color:var(--brand);border:1.5px solid var(--brand-line);position:relative;z-index:1;font-size:10px;font-weight:700}
.tl-item.act .tl-dot{background:var(--brand);color:#FFF;border-color:var(--brand)}
.tl-item.rej .tl-dot{background:var(--red-bg);color:var(--red);border-color:#F3C9C1}
.tl-item.ok .tl-dot{background:var(--green-bg);color:var(--green);border-color:var(--green)}
.tl-main{flex:1;padding-top:1px}
.tl-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tl-ver{font-size:11px;font-weight:700;color:var(--brand-deep);font-family:ui-monospace,Menlo,Consolas,monospace;background:var(--brand-soft);padding:1px 7px;border-radius:4px}
.tl-act{font-size:12.5px;font-weight:600;color:var(--text)}
.tl-who{font-size:11px;color:var(--muted)}
.tl-time{font-size:10.5px;color:var(--faint);font-family:ui-monospace,Menlo,Consolas,monospace}
.tl-comment{font-size:12px;color:#3D5A8C;background:#F4F8FF;border-radius:7px;padding:7px 11px;margin-top:6px;line-height:1.7}
.tl-file{display:inline-flex;align-items:center;gap:6px;font-size:11px;color:var(--brand-deep);margin-top:6px}

/* 审核动作面板 */
.audit-panel{border:1px solid var(--brand-line);border-radius:10px;background:#F6FAFF;padding:15px 16px;margin-top:14px}
.audit-panel h5{font-size:12.5px;font-weight:700;color:var(--ink);margin-bottom:10px;display:flex;align-items:center;gap:6px}
.audit-panel textarea{width:100%;min-height:74px;border:1px solid var(--line-strong);border-radius:8px;padding:10px 12px;font-size:12.5px;outline:none;resize:vertical;font-family:var(--font-ui);margin-bottom:10px}
.audit-panel textarea:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(32,103,232,.12)}
.audit-panel .ap-actions{display:flex;gap:8px;flex-wrap:wrap}
.role-tag{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;padding:2px 8px;border-radius:5px;background:var(--brand-soft);color:var(--brand-deep)}
</style>
</head>
<body>
<div id="app">
  <aside class="sidebar">
    <div class="side-logo">
      <div class="logo-tile"><span class="logo-cow">七七七</span></div>
      <div>
        <div class="name">七七七合同管理系统</div>
        <div class="sub">CONTRACT AUTO · FLOW</div>
      </div>
    </div>
    <nav class="side-nav" id="side-nav"></nav>
    <div class="side-foot">
      <div class="badge">DEMO 原型</div><br>
      七七七 · 法务部<br>标准/非标双流程 · 分级审核<br>演示环境 · 数据为模拟数据
    </div>
  </aside>
  <div class="main">
    <header class="topbar">
      <div class="crumb">
        <h1 id="crumb-title">工作台总览</h1>
        <span class="desc" id="crumb-desc">标准合同全自动 · 非标合同分级审核</span>
      </div>
      <div class="top-search">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="global-search" placeholder="搜索合同编号 / 名称 / 相对方…" onkeydown="if(event.key==='Enter')globalSearch(this.value)">
      </div>
      <div class="role-switch" title="切换演示角色">
        <svg class="rs-ic" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-6.5 8-6.5s8 2.5 8 6.5"/></svg>
        <select id="role-select" onchange="switchRole(this.value)">
          <option value="biz">业务人员 · 张明</option>
          <option value="legal">法务专员 · 李雯</option>
          <option value="legalLead">法务主管 · 王建国</option>
          <option value="finance">财务 · 陈芳</option>
          <option value="tech">技术 · 刘洋</option>
        </select>
        <svg class="rs-arrow" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
      </div>
      <div class="top-user" style="margin-left:4px">
        <button class="bell" onclick="toast('info','您有新的抄送与审核动态','ok')">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18 9a6 6 0 1 0-12 0c0 6-2.5 7.5-2.5 7.5h17S18 15 18 9"/><path d="M10.3 20.5a2 2 0 0 0 3.4 0"/></svg>
          <span class="dot"></span>
        </button>
        <div class="user-chip">
          <div class="avatar" id="user-avatar">张</div>
          <div>
            <div class="u-name" id="user-name">张明</div>
            <div class="u-role" id="user-role">市场部 · 业务申请人</div>
          </div>
        </div>
      </div>
    </header>
    <main class="content" id="view"></main>
  </div>
</div>
<div class="modal-root" id="modal-root"></div>
<div class="toast-root" id="toast-root"></div>

<script>
"use strict";
/* ============================================================
   v3 数据层：模板库 + 角色体系 + 标准/非标双流程状态机
============================================================ */
const TEMPLATES = {
  purchase:{id:"purchase",name:"商品采购合同",tag:"采购类",scene:"适用于通用物资、办公用品与原材料采购",color:"#E7EEF7",fields:[
    {key:"goods",label:"采购标的",ph:"如：办公笔记本电脑 20 台",req:1},
    {key:"quantity",label:"采购数量",ph:"如：20 台",req:1},
    {key:"unitPrice",label:"单价（元）",ph:"如：6200",req:1},
    {key:"deliveryPlace",label:"交付地点",ph:"上海市浦东新区 XX 路 XX 号",req:1},
    {key:"deliveryDays",label:"交付期限（天）",ph:"如：30",req:1},
    {key:"qualityStd",label:"质量标准",ph:"国标 / 双方约定标准",req:0},
    {key:"warranty",label:"质保期（月）",ph:"如：12",req:1},

const $ = (s,r)=>(r||document).querySelector(s);
const $$ = (s,r)=>Array.from((r||document).querySelectorAll(s));
function esc(v){return String(v==null?"":v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function fmtMoney(n){const v=Number(n||0);return v?v.toLocaleString("zh-CN")+" 元":"—";}
function fmtNum(n){return Number(n||0).toLocaleString("zh-CN");}
function pad(n){return String(n).padStart(4,"0");}
function nextNo(){return "HT-2026-"+pad(state.counter+1);}
function nextNsNo(){return "NS-2026-"+pad(state.nsCounter+1);}
function nowStr(){const d=new Date();const p=n=>String(n).padStart(2,"0");return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate())+" "+p(d.getHours())+":"+p(d.getMinutes())+":"+p(d.getSeconds());}
function todayStr(){const d=new Date();const p=n=>String(n).padStart(2,"0");return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate());}
function ts(d){return new Date(d.getFullYear(),d.getMonth(),d.getDate()).getTime();}
function addDays(d,n){const x=new Date(d);x.setDate(x.getDate()+n);return x;}
function bumpVersion(v){const x=parseFloat(v.slice(1));return "V"+Math.round((x+0.1)*10)/10;}
function toast(kind,msg){
  const root=$("#toast-root");
  const el=document.createElement("div");
  el.className="toast "+(kind==="err"?"err":kind==="warn"?"warn":"ok");
  const ic=kind==="err"
    ? '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>'
    : kind==="warn"
    ? '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"><path d="M12 5v9M12 19h.01"/></svg>'
    : '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5 5L20 6.5"/></svg>';
  el.innerHTML='<span class="t-ic">'+ic+'</span><span>'+msg+'</span>';
  root.appendChild(el);
  setTimeout(()=>{el.classList.add("out");setTimeout(()=>el.remove(),260);},3000);
}
function openModal(html,sm){
  const root=$("#modal-root");
  root.innerHTML='<div class="modal-overlay" onclick="if(event.target===this)closeModal()"><div class="modal'+(sm?" modal-sm":"")+'">'+html+'</div></div>';
}
function closeModal(){$("#modal-root").innerHTML="";}
function modalHead(title){
  return '<div class="modal-head"><h3>'+title+'</h3><button class="modal-close" onclick="closeModal()"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>';
}
function copyText(txt,msg){
  const ta=document.createElement("textarea");
  ta.value=txt;ta.style.position="fixed";ta.style.opacity="0";
  document.body.appendChild(ta);ta.select();ta.setSelectionRange(0,99999);
  let ok=false;
  try{ok=document.execCommand("copy");}catch(e){}
  ta.remove();
  if(!ok&&navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).catch(function(){});ok=true;}

function monthlyData(){
  const months=[];const d=new Date();
  for(let i=5;i>=0;i--){const dt=new Date(d.getFullYear(),d.getMonth()-i,1);months.push({label:(dt.getMonth()+1)+"月",key:dt.getFullYear()+"-"+String(dt.getMonth()+1).padStart(2,"0")});}
  const counts=months.map(function(m){return state.contracts.filter(function(c){return c.status==="archived"&&c.archivedAt.slice(0,7)===m.key;}).length;});
  return {months:months.map(function(m){return m.label;}),counts:counts,max:Math.max.apply(null,counts.concat([1]))};
}
function expiryList(){
  const t0=ts(new Date()),t1=ts(addDays(new Date(),90));
  return state.contracts.filter(function(c){return c.status==="archived"&&c.endDate;})
    .filter(function(c){const t=ts(new Date(c.endDate));return t>=t0&&t<=t1;})
    .sort(function(a,b){return a.endDate.localeCompare(b.endDate);}).slice(0,5);
}

function onNsFile(input){
  const f=input.files&&input.files[0];
  if(f){nsDraft.sourceFile=f.name;}

function nsFlowStrip(status){
  const defs=[
    {k:"pending_tech",n:"业务上传",done:1},
    {k:"pending_finance",n:"技术审核"},
    {k:"pending_legal",n:"财务审核"},
    {k:"pending_legal_lead",n:"法务专员"},
    {k:"signed",n:"法务主管"}
  ];
  const order=["pending_biz","pending_tech","pending_finance","pending_legal","pending_legal_lead","signed"];
  const cur=order.indexOf(status);
  let html="";
  defs.forEach(function(d,i){
    const nodeIdx=[0,1,2,3,4][i];
    const done=cur>nodeIdx+1||status==="signed"&&i<4;
    const isCur=cur===nodeIdx+1;
    html+='<div class="fs-node '+(done?"done":isCur?"cur":"")+'"><span class="fs-dot"></span><span class="fs-name">'+d.n+'</span>'+(i<4?'<span class="fs-line"></span>':"")+'</div>';
  });
  return html;
}
function submitNsContract(){
  const need=[["name","ns-name","合同名称"],["partyB","ns-partyB","相对方"],["amount","ns-amount","合同金额"]];
  const miss=[];
  need.forEach(function(p){if(!(nsDraft[p[0]]||"").trim()){const el=$("#"+p[1]);if(el)el.classList.add("invalid");miss.push(p[2]);}});
  if(!nsDraft.sourceFile){toast("warn","请先选择要上传的合同文件");return;}
  if(miss.length){toast("warn","请完善必填项："+miss.join("、"));return;}
  const amt=parseFloat(nsDraft.amount);
  if(amt<=BIG_AMOUNT&&nsDraft.comment.indexOf("改动")<0&&nsDraft.comment.indexOf("模板")<0&&nsDraft.comment.indexOf("对方")<0){
    /* 金额低于阈值且未说明条款差异：提示可走标准流程，但不阻断（演示保留弹窗提醒） */
    toast("info","金额未超阈值且未说明条款差异，若为标准模板建议走标准合同流程");
  }
  const id="ns"+Date.now();
  const no=nextNsNo();
  state.nsCounter++;
  const now=nowStr();
  const ns={id:id,no:no,name:nsDraft.name.trim(),partyB:nsDraft.partyB.trim(),amount:String(amt),sourceFile:nsDraft.sourceFile,status:"pending_tech",version:"V1.0",submittedAt:now,submittedBy:operator(),partyA:($("#ns-partyA")&&$("#ns-partyA").value)||ENTITIES[0],
    versions:[{v:"V1.0",at:now,by:operator(),act:"业务上传",comment:nsDraft.comment.trim()||"对方模板，需分级审核",file:nsDraft.sourceFile}]};
  state.nsContracts.unshift(ns);
  saveState();
  draft.step=2;render();
  const okNo=$("#ns-ok-no"),okName=$("#ns-ok-name"),okFile=$("#ns-ok-file");
  if(okNo)okNo.textContent=no;
  if(okName)okName.textContent=nsDraft.name.trim();
  if(okFile)okFile.textContent=nsDraft.sourceFile;
  toast("ok","非标合同已提交，进入技术审核环节");
}

function collectForm(){

  $$("#view .f-item input,#view .f-item textarea,#view .f-item select").forEach(function(el){
    const k=el.dataset.k;
    if(k&&k!=="partyA"){if(k==="no"){v.no="HT-2026-"+el.value.trim();}else{v[k]=el.value.trim();}}
  });

function submitWizard(){
  const v=collectForm();
  const t=TEMPLATES[draft.templateId];
  const required=["name","partyA","partyB","aContact","bContact","startDate","endDate","signDate"];
  if(t.id!=="nda")required.push("amount");
  t.fields.forEach(function(fd){required.push(fd.key);});
  const missing=[];
  required.forEach(function(k){const val=String(v[k]||"").trim();if(!val)missing.push(k);});
  if(v.startDate && v.endDate && v.endDate<v.startDate){
    toast("err","履约截止日不能早于起始日");
    ["startDate","endDate"].forEach(function(k){const el=$("#f-"+k);if(el)el.classList.add("invalid");});
    return;
  }
  if(missing.length){
    const labels=[];
    missing.forEach(function(k){
      let el=document.getElementById("f-"+k);
      if(k==="partyA")el=el||$("#f-partyA-cust");
      if(el)el.classList.add("invalid");
      const map={name:"合同名称",partyA:"签约主体",partyB:"乙方名称",aContact:"甲方联系人",bContact:"乙方联系人",startDate:"履约起始日",endDate:"履约截止日",signDate:"签约日期",amount:"合同金额"};
      labels.push(map[k]||(t.fields.find(function(f){return f.key===k;})||{}).label||k);
    });
    toast("warn","请完善必填项："+labels.join("、"));
    return;
  }
  draft.step=3;render();
}
let archiving=false;

  if(archiving)return;archiving=true;

  const side=$("#view .doc-side");
  const btn=$("#view .doc-side .btn-red");

  if(sealEl){sealEl.classList.remove("stamp-in");void sealEl.offsetWidth;sealEl.classList.add("stamp-in");}
  let pipes=[
    {name:"自动校验合同要素",desc:"必填项 · 期限 · 智能条款扫描"},
    {name:"生成标准化合同文本",desc:"法务模板套打 · 条款锁定"},

    {name:"抄送董事长办公室",desc:"归档即抄送 · 全程留痕"}
  ];
  if(big)pipes.splice(2,0,{name:"大额合同 · 法务复核",desc:"金额超阈值自动并行复核"});
  const stepMsgs=["合同要素校验通过，智能审查无阻断","标准化合同文本已生成","我方公章已加盖，电子签约链接已生成并待对方签署"].concat(big?["法务复核通过，可归档"]:[],["已归档至法务部合同卷宗","已抄送董事长办公室"]);
  side.insertAdjacentHTML("beforeend",'<div class="side-card" id="pipe-run" style="border-color:var(--brand-3)"><h4>自动化执行中</h4><div class="pipe" id="pipe-list">'+
    pipes.map(function(p,i){return '<div class="pipe-item '+(i===0?"running":"")+'"><div class="pipe-ic">'+(i===0?'<span class="spinner"></span>':'<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9 12l2 2 4-4"/></svg>')+'</div><div class="pipe-main"><div class="pipe-name">'+p.name+'</div><div class="pipe-desc">'+p.desc+'</div></div></div>';}).join("")+
  '</div></div>');

    setTimeout(function(){
      p.classList.remove("running");p.classList.add("done");
      p.querySelector(".pipe-ic").innerHTML='<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5 5L20 6.5"/></svg>';
      p.querySelector(".pipe-desc").textContent=stepMsgs[i];
      if(i===0)toast("ok","要素校验通过，智能审查完成");
      if(i===2)toast("ok","签约链接已生成并发送对方签署");
      if(i===3)toast("ok","已自动归档至法务部卷宗");
      if(i===pipeEls.length-1){toast("ok","合同已抄送董事长办公室");finishArchive(c);}
    },650*(i+1));
  });
}

function sealSvg(name,size){
  name=name||"七七七信息技术";
  const r=size/2;
  const arcR=r-16;
  const arcLen=Math.PI*arcR;
  const fs=Math.max(7.5,Math.min(15,arcLen*0.92/Math.max(name.length,4)));
  return '<svg width="'+size+'" height="'+size+'" viewBox="0 0 '+size+' '+size+'" xmlns="http://www.w3.org/2000/svg">'+
    '<circle cx="'+r+'" cy="'+r+'" r="'+(r-4)+'" fill="none" stroke="#C0392B" stroke-width="4"/>'+
    '<circle cx="'+r+'" cy="'+r+'" r="'+(r-12)+'" fill="none" stroke="#C0392B" stroke-width="1.4"/>'+
    '<path id="sealArc-'+size+'" d="M '+(r-arcR)+' '+r+' A '+arcR+' '+arcR+' 0 0 1 '+(r+arcR)+' '+r+'" fill="none"/>'+
    '<text font-family="Noto Sans SC,sans-serif" font-size="'+fs+'" fill="#C0392B" font-weight="700"><textPath href="#sealArc-'+size+'" startOffset="50%" text-anchor="middle">'+esc(name)+'</textPath></text>'+
    '<polygon points="'+starPoints(r,r*0.42,r*0.18)+'" fill="#C0392B"/>'+
    '<text x="'+r+'" y="'+(r+r*0.30)+'" text-anchor="middle" font-family="Noto Sans SC,sans-serif" font-size="'+(size*0.105)+'" fill="#C0392B" font-weight="700" letter-spacing="2">合同专用章</text>'+
  '</svg>';
}
function starPoints(cx,ro,ri){
  const pts=[];
  for(let i=0;i<10;i++){
    const ang=Math.PI/2 + i*Math.PI/5;
    const rad=i%2===0?ro:ri;
    pts.push((cx+rad*Math.cos(ang)).toFixed(1)+","+(cx-rad*Math.sin(ang)).toFixed(1));
  }
  return pts.join(" ");
}
function smartReview(c){
  const t=TEMPLATES[c.template];
  const checks=[];
  if(t.id==="purchase"||t.id==="sales"){
    const q=parseFloat(String(c.fields.quantity||"").replace(/[^\d.]/g,""));
    const p=parseFloat(c.fields.unitPrice);
    const amt=parseFloat(c.amount);
    if(!isNaN(q)&&!isNaN(p)&&!isNaN(amt)){
      const calc=q*p;
      if(Math.abs(calc-amt)/Math.max(amt,1)>0.02)checks.push({ok:false,t:"金额一致性校验",d:"数量 × 单价 = "+fmtNum(calc)+"，与合同总额 "+fmtNum(amt)+" 不一致，请核对"});
      else checks.push({ok:true,t:"金额一致性校验",d:"数量 × 单价与合同总额一致（"+fmtNum(calc)+"）"});
    }else checks.push({ok:true,t:"金额一致性校验",d:"金额要素齐备"});
  }else if(c.amount){checks.push({ok:true,t:"金额要素校验",d:"合同金额已填写"});}
  if(c.startDate&&c.endDate){
    const days=(ts(new Date(c.endDate))-ts(new Date(c.startDate)))/86400000;
    if(days<30)checks.push({ok:false,t:"履约期限校验",d:"履约期仅 "+Math.round(days)+" 天，请确认期限合理性"});
    else checks.push({ok:true,t:"履约期限校验",d:"履约期 "+Math.round(days)+" 天，期限合理"});
  }
  const riskWords=["无限责任","单方解除","放弃追偿","免责","赔偿上限","违约金 100%"];
  const allTxt=[c.name,c.remark].concat(t.fields.map(function(f){return c.fields[f.key]||"";})).join(" ");
  const hit=riskWords.find(function(w){return allTxt.indexOf(w)>=0;});
  if(hit)checks.push({ok:false,t:"敏感条款扫描",d:"检测到敏感表述「"+hit+"」，建议法务确认"});
  else checks.push({ok:true,t:"敏感条款扫描",d:"未发现高风险敏感条款"});
  checks.push({ok:true,t:"模板合规校验",d:"已匹配法务标准模板「"+t.name+"」，必备条款齐备"});
  return checks;
}

function downloadContract(id){
  const c=state.contracts.find(function(x){return x.id===id;});
  if(!c)return;
  const html=buildStandaloneHtml(c);
  const blob=new Blob([html],{type:"text/html;charset=utf-8"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url;
  a.download=(c.no+"-"+c.name+".html").replace(/[\\/:*?"<>|]/g,"_");
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(function(){URL.revokeObjectURL(url);},2000);
  toast("ok","合同文件已下载："+c.no);
}

function nsCmt(){

function bindNsFileInput(){

function doNsApprove(id){
  const comment=nsCmt();
  if(!comment){toast("warn","请填写审核意见");return;}
  const c=state.nsContracts.find(function(x){return x.id===id;});
  if(!c)return;
  const now=nowStr();
  const next={"pending_tech":"pending_finance","pending_finance":"pending_legal","pending_legal":"pending_legal_lead"};
  const to=next[c.status];
  c.status=to;c.sourceFile=c.sourceFile;
  c.versions.push({v:c.version,at:now,by:operator(),act:"审核通过",comment:comment,file:c.sourceFile});
  saveState();closeModal();
  toast("ok","已通过，流转至「"+NS_STATUS_LABEL[to]+"」");
  render();
}
function doNsReject(id){
  const comment=nsCmt();
  if(!comment){toast("warn","请填写退回意见（必填，将完整留痕）");return;}
  const c=state.nsContracts.find(function(x){return x.id===id;});
  if(!c)return;
  const now=nowStr();

}
function doNsModify(id){

    '<div class="list-toolbar" style="padding:16px 16px 0;margin-bottom:6px">'+

      '<span style="margin-left:auto;font-size:12.5px;color:var(--muted)">共 <b style="color:var(--brand-deep)">'+list.length+'</b> 份作废合同 · 全程留痕可追溯</span>'+
    '</div>'+
    '<table class="tbl"><thead><tr>'+
      '<th>合同编号</th><th>合同名称</th><th>我方签约主体</th><th>相对方</th><th>合同金额</th><th>作废原因</th><th>作废时间</th><th style="width:130px">操作</th>'+
    '</tr></thead><tbody>'+(rows||'<tr><td colspan="8"><div class="empty"><div class="e-title">暂无作废合同</div><div class="e-sub">作废记录将在此保留，不可删除</div></div></td></tr>')+'</tbody></table>'+
  '</div>';
}
function voidFilter(kw){go("voided",{q:kw});}

/* ============================================================
   批量操作记录
============================================================ */
function renderLogs(){
  const logs=state.logs.slice().sort(function(a,b){return b.time.localeCompare(a.time);});
  const ic=function(type){return type==="批量作废"
    ? '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2M6.5 7l.9 13.2a1 1 0 0 0 1 .8h7.2a1 1 0 0 0 1-.8L17.5 7M10 11v6M14 11v6"/></svg>'
    : '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7 10l5 5 5-5M4 21h16"/></svg>';};
  return '<div class="card">'+
    '<div class="list-toolbar" style="padding:16px 16px 0;margin-bottom:6px">'+
      '<span style="font-size:12.5px;color:var(--muted)">批量导出 / 批量作废等操作全量留痕，供法务与审计追溯</span>'+
      '<span style="margin-left:auto;font-size:12.5px;color:var(--muted)">共 <b style="color:var(--brand-deep)">'+logs.length+'</b> 条记录</span>'+
    '</div>'+
    (logs.map(function(l){
      const red=l.type==="批量作废";
      const refs=l.refs&&l.refs.length?'<div style="margin-top:6px"><span class="tag" style="background:var(--brand-soft);color:var(--brand-deep)">涉及合同</span>'+l.refs.map(function(r){return '<span class="tag">'+r+'</span>';}).join("")+'</div>':"";
      return '<div style="display:flex;gap:14px;padding:16px 20px;border-bottom:1px solid #EDF3FC;align-items:flex-start">'+
        '<div class="r-ic" style="width:38px;height:38px;border-radius:9px;flex:0 0 38px;display:flex;align-items:center;justify-content:center;background:'+(red?"var(--red-bg)":"var(--brand-soft)")+';color:'+(red?"var(--red)":"var(--brand)")+'">'+ic(l.type)+'</div>'+
        '<div style="flex:1;min-width:0">'+
          '<div style="display:flex;align-items:center;gap:10px"><span style="font-size:13.5px;font-weight:700;color:var(--ink)">'+l.type+'</span><span class="chip '+(red?"chip-red":"chip-green")+'">'+l.count+' 份</span><span class="chip chip-gray">'+esc(l.operator)+'</span></div>'+
          '<div style="font-size:12px;color:var(--muted);margin-top:5px;line-height:1.6">'+esc(l.detail)+'</div>'+refs+
        '</div>'+
        '<div style="text-align:right;flex:0 0 auto"><div style="font-size:11px;color:var(--faint);font-family:ui-monospace,Menlo,Consolas,monospace">'+l.time+'</div><span class="chip chip-green" style="margin-top:6px">已完成</span></div>'+
      '</div>';
    }).join(""))+
  '</div>';
}

/* ============================================================
   合同查看弹窗 + 全局搜索
============================================================ */
function viewContract(id){
  const c=state.contracts.find(function(x){return x.id===id;});
  if(!c)return;
  const big=!!c.amount&&Number(c.amount)>BIG_AMOUNT;
  const isNs=c.signType==="非标终版";
  const status=c.status==="voided"?'<span class="chip chip-red">已作废</span>':(isNs?'<span class="chip chip-purple">非标终版</span>':'<span class="chip chip-green">已归档</span>');
  openModal(modalHead("合同详情 · "+esc(c.name))+
    '<div class="modal-body" style="padding:0"><div class="modal-view">'+
      '<div class="mv-paper">'+buildDocHtml(c)+'</div>'+
      '<div class="mv-side">'+
        '<div class="side-card" style="margin-bottom:14px"><h4>合同要素</h4>'+
          '<div class="meta-row"><span class="mk">合同编号</span><span class="mv mono">'+c.no+'</span></div>'+
          (c.nsNo?'<div class="meta-row"><span class="mk">非标编号</span><span class="mv mono">'+c.nsNo+'</span></div>':"")+
          '<div class="meta-row"><span class="mk">合同状态</span><span class="mv">'+status+'</span></div>'+
          '<div class="meta-row"><span class="mk">生成方式</span><span class="mv">'+esc(c.signType||"标准模板")+'</span></div>'+
          '<div class="meta-row"><span class="mk">我方主体</span><span class="mv">'+esc(c.partyA)+'</span></div>'+
          '<div class="meta-row"><span class="mk">相对方</span><span class="mv">'+esc(c.partyB)+'</span></div>'+
          (c.amount?'<div class="meta-row"><span class="mk">合同金额</span><span class="mv">'+fmtMoney(c.amount)+'</span></div>':"")+
          '<div class="meta-row"><span class="mk">履约期限</span><span class="mv">'+c.startDate+' 至 '+c.endDate+'</span></div>'+
          '<div class="meta-row"><span class="mk">归档时间</span><span class="mv" style="font-size:11px">'+esc(c.archivedAt||"")+'</span></div>'+
          '<div class="meta-row"><span class="mk">归档人</span><span class="mv">'+esc(c.archivedBy||operator())+'</span></div>'+
        '</div>'+
        '<div class="side-card" style="margin-bottom:14px;border-color:var(--brand-3)"><h4>电子化签约</h4>'+
          '<div class="meta-row"><span class="mk">签约平台</span><span class="mv">七七七电子签约</span></div>'+
          '<div class="meta-row"><span class="mk">我方公章</span><span class="mv"><span class="chip chip-red">已加盖</span></span></div>'+
          '<div class="meta-row"><span class="mk">对方签署</span><span class="mv"><span class="chip chip-amber">待签署</span></span></div>'+
          '<div class="link-box">'+signLink(c.no)+'<button class="copy-btn" onclick="copyText(\''+signLink(c.no)+'\')">复制</button></div>'+
        '</div>'+
        (c.status==="voided"
          ?'<div class="side-card" style="background:var(--red-bg);border-color:#F3C9C1;margin-bottom:14px"><h4 style="color:var(--red-deep)">作废信息</h4>'+
            '<div class="meta-row"><span class="mk">作废时间</span><span class="mv" style="font-size:11px">'+esc(c.voidAt||"")+'</span></div>'+
            '<div style="font-size:12px;color:#7C3B30;line-height:1.8;margin-top:8px">原因：'+esc(c.voidReason||"")+'</div></div>'
          :'<div class="side-card" style="background:'+(isNs?"#F1ECFA":"var(--green-bg)")+';border-color:'+(isNs?"#D9C9F2":"#CBE7D8")+';margin-bottom:14px"><h4 style="color:'+(isNs?"#6C4AB6":"var(--green)")+'">'+(isNs?"分级审核流转":"全自动流转")+'</h4>'+
            '<div style="font-size:12px;color:'+(isNs?"#5B3E9E":"#2F6B51")+';line-height:1.9">'+(isNs?'本单为非标合同终版，经技术 → 财务 → 法务专员 → 法务主管分级审核，全部意见与版本已留痕；':'本单为零审批标准模板合同，要素校验通过后直接归档；')+'归档完成即时抄送董事长办公室。</div></div>')+
        '<div style="display:flex;gap:8px">'+
          '<button class="btn btn-primary" style="flex:1" onclick="downloadContract(\''+c.id+'\')">下载合同</button>'+
          '<button class="btn btn-ghost" style="flex:1" onclick="copyText(\''+signLink(c.no)+'\')">复制签约链接</button>'+
        '</div>'+
      '</div>'+
    '</div></div>');
}
function globalSearch(kw){
  kw=(kw||"").trim();
  if(!kw){toast("info","请输入合同编号 / 名称 / 相对方关键词");return;}
  go("archived",{q:kw});
  toast("ok","已在已归档中搜索："+kw);
}

/* ============================================================
   启动
============================================================ */
window.draftStep2=function(){draft.step=2;render();};
window.draftPartyA=function(){return draft.values.partyA;};
if(!location.hash)location.replace("#/dashboard");
router();
</script>
