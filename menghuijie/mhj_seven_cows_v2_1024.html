  }
 `,"large");

 urls.push(url);
}

/* =========================================================
 * 7. 乙方文本信息识别
 * 本地规则识别，不向外部服务发送粘贴信息。
 * 支持带标签文本、部分无标签公司名称和手机号。
 * ========================================================= */

const qznFieldDefinitions=[
 {
  key:"bName",
  label:"主体名称",
  aliases:[
   "乙方主体名称","乙方公司名称","乙方名称",
   "公司名称","企业名称","单位名称","主体名称",
   "企业全称","公司全称","名称","乙方"
  ]
 },
 {
  key:"bCredit",
  label:"统一社会信用代码",
  aliases:[
   "统一社会信用代码","统一信用代码",
   "社会信用代码","纳税人识别号","税号"
  ]
 },
 {
  key:"bAddress",
  label:"地址",
  aliases:[
   "公司注册地址","注册地址","联系地址",
   "通讯地址","公司地址","经营地址","住所地","住所","地址"
  ]
 },
 {
  key:"bLegal",
  label:"法定代表人",
  aliases:["法定代表人","法人代表","法人"]
 },
 {
  key:"bContact",
  label:"联系人",
  aliases:["业务联系人","联系人员","联系人","经办人","对接人"]
 },
 {
  key:"bPhone",
  label:"联系电话",
  aliases:[
   "联系人手机号","联系人电话","联系电话",
   "手机号码","手机电话","手机号","电话","手机"
  ]
 },
 {
  key:"bEmail",
  label:"电子邮箱",
  aliases:["电子邮箱","电子邮件","联系邮箱","邮箱","E-mail","Email"]
 },
 {
  key:"bBank",
  label:"开户行",
  aliases:["开户银行","开户行"]
 },
 {
  key:"bAccount",
  label:"银行账号",
  aliases:["银行账号","银行帐号","收款账号","收款帐号","账号","帐号"]
 },
 {
  key:"bAccountName",
  label:"账户名称",
  aliases:["银行账户名称","收款账户名称","账户名称","开户名称","开户名","户名"]
 }
];

function qznEscapeRegex(value){
 return String(value).replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
}

function qznUnique(values){
 return [...new Set(values.map(v=>String(v).trim()).filter(Boolean))];
}

function qznCleanValue(value){
 return String(value||"")
  .replace(/^[\s:：=，,；;、|]+/,"")
  .replace(/[\s，,；;、|]+$/,"")
  .trim();
}

function qznPhoneCandidates(text){
 return qznUnique(
  (String(text).match(
   /(?:\+?86[- ]?)?1[3-9]\d{9}|0\d{2,3}[- ]?\d{7,8}(?:-\d{1,6})?/g
  )||[]).map(phone=>{
   const compact=phone.replace(/\s/g,"");

   // 大陆手机号去掉国家区号，保持原保存校验兼容。
   if(/^(?:\+86|86)1[3-9]\d{9}$/.test(compact)){
    return compact.replace(/^(?:\+86|86)/,"");
   }
   return compact;
  })
 );
}

function qznParsePartyText(raw){
 const text=String(raw||"")
  .replace(/\r\n?/g,"\n")
  .replace(/\u00a0/g," ")
  .trim();

 const values={};
 const ambiguous=[];
 const candidates={};

 const aliasToKey=new Map();

 for(const field of qznFieldDefinitions){
  candidates[field.key]=[];

  for(const alias of field.aliases){
   aliasToKey.set(alias.toLowerCase(),field.key);
  }
 }

 const aliases=[...aliasToKey.keys()]
  .sort((a,b)=>b.length-a.length);

 /*
  * 有冒号/等号时允许识别单行连续标签：
  * 公司名称：... 税号：... 地址：...
  * 无冒号时要求标签出现在行首或分隔符之后。
  */
 const labelPattern=aliases.map(qznEscapeRegex).join("|");

 const regex=new RegExp(
  `(${labelPattern})\\s*[:：=]\\s*`+
  `|(?:^|[\\n，,；;|])\\s*(${labelPattern})[ \\t]+`,
  "gim"
 );

 const hits=[];

 for(const match of text.matchAll(regex)){
  const alias=(match[1]||match[2]).toLowerCase();

  hits.push({
   key:aliasToKey.get(alias),
   start:match.index,
   valueStart:match.index+match[0].length
  });
 }

 for(let i=0;i<hits.length;i++){
  const hit=hits[i];
  let value=text.slice(
   hit.valueStart,
   i+1<hits.length?hits[i+1].start:text.length
  );

  value=qznCleanValue(value);

  if(hit.key!=="bAddress"){
   value=qznCleanValue(value.split(/\n/)[0]);
  }else{
   value=value.replace(/\n+/g," ");
  }

  if(!value)continue;

  if(hit.key==="bPhone"){
   candidates[hit.key].push(...qznPhoneCandidates(value));
  }else if(hit.key==="bCredit"){
   candidates[hit.key].push(
    ...(value.toUpperCase().match(/\b[0-9A-Z]{18}\b/g)||[])
   );
  }else if(hit.key==="bEmail"){
   candidates[hit.key].push(
    ...(value.match(/[A-Z0-9._%+-]+@[A-Z0-9.-]+\.[A-Z]{2,}/gi)||[])
   );
  }else if(hit.key==="bAccount"){
   const account=value.match(/\d[\d -]{6,35}\d/);
   if(account)candidates[hit.key].push(account[0].replace(/[ -]/g,""));
  }else{
   candidates[hit.key].push(value);
  }
 }

 // 未提供明确名称标签时，尝试从独立行中识别公司名称。
 if(!candidates.bName.length){
  const lines=text.split(/[\n，,；;|]/)
   .map(qznCleanValue)
   .filter(Boolean);

  for(const line of lines){
   if(/[:：=]/.test(line))continue;

   if(
    line.length<=150&&
    /(?:有限责任公司|股份有限公司|有限公司|合伙企业|个体工商户)$/.test(line)
   ){
    candidates.bName.push(line);
   }
  }
 }

 // 只有一个明确候选值时才自动采用。
 if(!candidates.bCredit.length){
  candidates.bCredit.push(
   ...(text.toUpperCase().match(/\b[0-9A-Z]{18}\b/g)||[])
  );
 }

 if(!candidates.bPhone.length){
  candidates.bPhone.push(...qznPhoneCandidates(text));
 }

 if(!candidates.bEmail.length){
  candidates.bEmail.push(
   ...(text.match(/[A-Z0-9._%+-]+@[A-Z0-9.-]+\.[A-Z]{2,}/gi)||[])
  );
 }

 for(const field of qznFieldDefinitions){
  const list=qznUnique(candidates[field.key]);

  if(list.length===1){
   values[field.key]=list[0];
  }else if(list.length>1){
   ambiguous.push(field.label);
  }
 }

 return {values,ambiguous};
}

   </button>

   </button>
  </div>

  </div>

  <div
   id="qznPartyResult"
   class="qzn-recognition-result"
   aria-live="polite"></div>
 `;

 grid.before(box);
}

openEditor=function(...args){
 const result=originalOpenEditor.apply(this,args);
 qznMountPartyRecognition();
 return result;
};

function qznFillParty(overwrite=false,quiet=false){
 const form=$("editForm");
 const source=$("qznPartyText");
 const resultBox=$("qznPartyResult");

 if(!editor||!form||!source||!resultBox)return;

 const text=source.value.trim();

 if(!text){
  resultBox.textContent="";
  if(!quiet)toast("请先粘贴乙方信息。");
  return;
 }

 const result=qznParsePartyText(text);
 const entries=Object.entries(result.values);

 if(!entries.length){
  resultBox.textContent=
   "未识别到明确字段。建议保留“公司名称：”“地址：”“联系人：”“电话：”等标签。";
  return;
 }

 if(overwrite&&!confirm("将覆盖本次识别到的对应乙方字段，是否继续？")){
  return;
 }

 const filled=[];
 const skipped=[];

 for(const [key,value] of entries){
  const control=form.elements.namedItem(key);
  if(!control)continue;

  const label=LABELS[key]||key;

  if(!overwrite&&String(control.value||"").trim()){
   skipped.push(label);
   continue;
  }

  control.value=value;
  filled.push(label);
 }

 // 继续使用原来的实时预览逻辑。
 livePreview();

 const lines=[
  `识别到 ${entries.length} 项，已填写 ${filled.length} 项。`
 ];

 if(filled.length)lines.push("已填写："+filled.join("、"));
 if(skipped.length)lines.push("保留已有值："+skipped.join("、"));

 if(result.ambiguous.length){
  lines.push("多个候选值，未自动填写："+result.ambiguous.join("、"));
 }

 lines.push("");
 lines.push("识别结果：");

 for(const [key,value] of entries){
  lines.push(`${LABELS[key]||key}：${value}`);
 }

 resultBox.textContent=lines.join("\n");
}

/* =========================================================
 * 9. 增强模块事件
 * 使用独立 data-qzn-action，不干扰原按钮分派。
 * ========================================================= */

document.addEventListener("click",event=>{
 const button=event.target.closest?.("button[data-qzn-action]");
 if(!button)return;

 event.preventDefault();
 event.stopImmediatePropagation();

 const action=button.dataset.qznAction;

 Promise.resolve().then(async()=>{
  need(me(),"请先登录。");

  if(action==="return"){
   const c=get(button.dataset.id);
   need(c&&visible(c)&&qznCanReturn(c));
   openReview(c,false);
   return;
  }

  if(action==="party-fill-empty"){
   qznFillParty(false);
   return;
  }

  if(action==="party-fill-overwrite"){
   qznFillParty(true);
   return;
  }

  if(
   action==="review-file-preview"||
   action==="review-file-download"
  ){
   await qznReadReviewAttachment(
    button.dataset.id,
    button.dataset.approval,
    action==="review-file-preview"
   );
  }
 }).catch(error=>{
  toast(error.message||"操作失败。");
 });
},true);

document.addEventListener("change",event=>{
 if(event.target.id==="qznOpinionPreset"){
  const selected=event.target.value;
  const textarea=$("qznOpinion");

  if(selected&&textarea){
   textarea.value=selected;
  }
 }

 if(
  event.target.id==="qznPartyAutoFill"&&
  event.target.checked
 ){
  qznFillParty(false,true);
 }
});

document.addEventListener("input",event=>{
 if(event.target.id!=="qznPartyText")return;

 clearTimeout(qznRecognitionTimer);

 const currentEditor=editor;

 qznRecognitionTimer=setTimeout(()=>{
  if(editor!==currentEditor)return;
  if(!$("qznPartyAutoFill")?.checked)return;

  try{
   qznFillParty(false,true);
  }catch(error){
   toast(error.message||"信息识别失败。");
  }
 },500);
});

/*
 * 不改存储名称，不迁移或清空历史合同。
 * 若页面已初始化，则刷新页面展示，使新增列立即生效。
 */
if(typeof render==="function"){
 render();
}
})();
</script>
