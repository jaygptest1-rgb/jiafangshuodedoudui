<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>七只小牛签约系统</title>
<style>
:root{
 --bg:#f6f9ff;--white:#fff;--line:#dbe6f8;--ink:#1f2b45;--sub:#64748f;
 --blue:#165dff;--nav:#1551e0;--green:#168264;--red:#bf4148;--orange:#ac7a29
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.65 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
button,input,select,textarea{font:inherit}
button{cursor:pointer;border:1px solid #cddaf6;background:white;color:var(--ink);border-radius:7px;padding:8px 13px}
button:hover:not(:disabled){border-color:#8fb2ff;background:#f2f7ff}
button:disabled{opacity:.45;cursor:not-allowed}
input,select,textarea{border:1px solid #cddaf6;border-radius:6px;padding:9px 11px;outline-color:#a5c1ff;background:white;color:var(--ink);max-width:100%}
textarea{resize:vertical;min-height:90px;line-height:1.8}
.primary{background:var(--blue);border-color:var(--blue);color:white}
.primary:hover:not(:disabled){background:#174dc3;color:white}
.danger{color:var(--red)}
.small{padding:5px 10px;font-size:12px}
h1{font-size:23px;margin:0 0 7px}h2{font-size:16px;margin:0 0 17px}h3{font-size:14px;margin:0 0 7px}
p{margin:7px 0 14px}
.muted{font-size:12px;color:var(--sub)}
.actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.between{justify-content:space-between}
.card{background:white;border:1px solid var(--line);border-radius:12px;padding:22px;margin-bottom:18px;box-shadow:0 5px 22px #233d5e05}
.head{display:flex;justify-content:space-between;align-items:flex-start;gap:15px;margin-bottom:22px}
.grid{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(310px,1fr);gap:20px}
.equal{grid-template-columns:1fr 1fr}
.sidebar{position:fixed;inset:0 auto 0 0;width:214px;background:linear-gradient(180deg,#1748d6 0%,#0f36a8 100%);color:#c8d8f5;padding:24px 14px;display:flex;flex-direction:column;z-index:10;box-shadow:2px 0 14px rgba(21,81,224,.12)}
.logo{font-size:21px;font-weight:750;color:white;padding:0 13px 25px;letter-spacing:1px}
.logo small{display:block;font-size:10px;letter-spacing:2px;color:#a9c1ec;margin-top:5px}
.nav{width:100%;text-align:left;border:0;color:#c8d8f5;background:transparent;padding:11px 13px;margin:2px 0;border-radius:7px}
.nav.active,.nav:hover:not(:disabled){background:#2e5ef0;color:white}
.sidefoot{margin-top:auto;font-size:11px;padding:20px 12px 0;color:#a9c1ec}
.workspace{margin-left:214px}
.topbar{height:72px;background:#ffffffef;border-bottom:1px solid var(--line);padding:0 28px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:9;backdrop-filter:blur(10px)}
main{padding:27px 28px;max-width:1700px;margin:auto}
.avatar{width:33px;height:33px;border-radius:50%;background:#edf3ff;color:var(--blue);display:grid;place-items:center;font-weight:700}
.hero{background:linear-gradient(115deg,#1748d6,#2e6cff);color:white;padding:29px 31px;border:0}
.hero p{color:#d0dff0}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:15px;margin-bottom:20px}
.stat{background:white;border:1px solid var(--line);border-radius:10px;padding:21px}
.stat span{font-size:12px;color:var(--sub)}
.stat strong{display:block;font-size:31px;margin-top:7px}
.tag{display:inline-block;padding:3px 8px;border-radius:5px;font-size:11px;background:#eef1f6;color:#68778c;white-space:nowrap}
.blue{background:#edf4ff;color:#2a63c8}.green{background:#eaf7ef;color:#19845e}
.purple{background:#f3edff;color:#7d56b1}.orange{background:#fff5e3;color:#a57629}
.red{background:#fff0ee;color:#bc4e4e}
.tip{padding:12px 15px;border:1px solid #dce8fd;background:#f0f6ff;color:#52719c;border-radius:8px;font-size:12px;margin-bottom:17px}
.warn{background:#fff8eb;border-color:#f1e0bd;color:#98753b}
.filters{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:16px;align-items:center}
.tablebox{overflow:auto;border:1px solid var(--line);border-radius:10px;background:white}
table{border-collapse:collapse;width:100%;font-size:12px;white-space:nowrap}
th{background:#f8fafd;padding:13px 15px;text-align:left;color:#718198;font-weight:500}
td{padding:14px 15px;border-top:1px solid var(--line)}
tr:hover td{background:#fbfcff}
.title{font-size:13px;font-weight:600;min-width:175px;max-width:310px;white-space:normal}
.urgent-title{color:var(--red);font-weight:800}
.empty{text-align:center;padding:45px 15px;color:#8a98ab}
.pagination{display:flex;justify-content:flex-end;align-items:center;gap:10px;margin-top:15px;color:var(--sub);font-size:12px}
.field{display:block;font-size:12px;color:#62728a;margin-bottom:14px}
.field input,.field select,.field textarea{width:100%;display:block;margin-top:6px;font-size:13px}
.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 13px}
.full{grid-column:1/-1}
.kv{display:flex;justify-content:space-between;gap:15px;padding:9px 0;border-bottom:1px dashed var(--line);font-size:12px}
.kv:last-child{border:0}.kv span{color:var(--sub);flex-shrink:0}
.kv b{font-weight:500;text-align:right;overflow-wrap:anywhere}
.flow{display:flex;background:white;border:1px solid var(--line);padding:18px 10px;border-radius:10px;overflow:auto;margin-bottom:20px}
.step{flex:1;min-width:95px;text-align:center;color:#98a3b4;font-size:11px}
.step i{display:block;margin:0 auto 6px;width:25px;height:25px;line-height:25px;border-radius:50%;background:#edf1f6;font-style:normal}
.step.active{color:var(--blue);font-weight:600}.step.active i{background:var(--blue);color:white}
.step.done{color:var(--green)}.step.done i{background:#e7f5ee}
.tabs{display:flex;gap:20px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow:auto}
.tab{border:0;border-radius:0;border-bottom:2px solid transparent;background:transparent;color:#8391a4;padding:9px 0;white-space:nowrap}
.tab.active{color:var(--blue);border-bottom-color:var(--blue)}
.doc{background:white;padding:37px 43px;border:1px solid var(--line);border-radius:4px;min-height:520px}
.doc h2{text-align:center;font-size:22px;margin:10px 0 25px}
.docmeta{text-align:right;font-size:11px;color:#8996a9;margin-bottom:16px}
.docbody{white-space:pre-wrap;overflow-wrap:anywhere;font:14px/2.05 "Songti SC","SimSun",serif}
.signarea{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:35px;padding-top:22px;border-top:1px solid var(--line);font-size:12px}
.seal{width:135px;height:135px;display:block;margin:8px 0}
.record{position:relative;border-left:2px solid #e2e8f1;padding:0 0 23px 20px;margin-left:5px}
.record:before{content:"";position:absolute;width:8px;height:8px;left:-5px;top:5px;background:#819fc8;border-radius:50%}
.record:last-child{padding-bottom:0}.record p{font-size:12px;color:#65758b;white-space:pre-wrap;overflow-wrap:anywhere}
.modal{position:fixed;inset:0;background:#17283d88;z-index:100;display:flex;align-items:center;justify-content:center;padding:20px}
.modalbox{background:white;border-radius:13px;width:650px;max-width:97vw;max-height:94vh;overflow:auto;padding:24px;box-shadow:0 20px 80px #0002}
.large{width:1060px}.modalhead{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:20px}
.modalhead h2{margin:0}.modalfoot{display:flex;justify-content:flex-end;gap:9px;margin-top:20px;flex-wrap:wrap}
.editor{width:1490px;padding:0;display:flex;flex-direction:column;height:94vh;overflow:hidden}
.editor>.modalhead{padding:18px 24px;margin:0;border-bottom:1px solid var(--line)}
.uploadtop{background:#eef5ff;border:1px dashed #8bb0ed;border-radius:10px;margin:15px 20px 0;padding:17px 20px;flex-shrink:0}
.uploadtop.drag{background:#deecff}.uploadtop input{max-width:360px}
.uploadtop h3{font-size:16px;margin-bottom:5px}
.editlayout{display:grid;grid-template-columns:minmax(0,1fr) 440px;min-height:0;flex:1;margin-top:15px}
.editpreview{overflow:auto;background:#eaf0f7;padding:20px;min-width:0}
.editpreview .doc{max-width:850px;margin:auto;min-height:800px;box-shadow:0 5px 20px #263f5e0b}
.editfields{overflow:auto;padding:0 22px;min-width:0}
.editfields .modalfoot{position:sticky;bottom:0;background:white;padding:15px 0;border-top:1px solid var(--line);z-index:2}
.recognize{padding:13px;border:1px solid #dae7fc;background:#f5f9ff;border-radius:8px;margin-bottom:16px}
.recrow{display:grid;grid-template-columns:80px minmax(0,1fr) 45px;gap:7px;font-size:11px;padding:6px 0;align-items:start}
.recrow strong{font-weight:500;overflow-wrap:anywhere}.recrow button{padding:1px 4px;font-size:10px}
.diffold,.diffnew{white-space:pre-wrap;overflow-wrap:anywhere;padding:10px;border-radius:6px;margin:5px 0;font-size:12px}
.diffold{background:#fff0ee;color:#ab4e49}.diffnew{background:#eaf7ef;color:#247b51}
.pdf{width:100%;height:73vh;min-height:450px;border:0}
.scanimg{display:block;max-width:100%;margin:0 auto}
.toast{position:fixed;top:82px;left:50%;transform:translateX(-50%);background:#263b55;color:white;border-radius:8px;padding:12px 20px;z-index:500;max-width:90vw;box-shadow:0 8px 30px #0002}
.login{min-height:100vh;display:grid;place-items:center;padding:25px;background:radial-gradient(ellipse at 80% 0,#dce8ff,transparent 60%),#f3f6fb}
.logincard{width:430px;max-width:100%;padding:34px;border:1px solid var(--line);border-radius:18px;background:white;box-shadow:0 20px 60px #28476e12}
.loginmark{width:55px;height:55px;background:var(--blue);color:white;display:grid;place-items:center;font-size:26px;border-radius:13px;margin-bottom:20px}
.signheader{background:white;border-bottom:1px solid var(--line);padding:18px 30px;display:flex;justify-content:space-between;align-items:center;gap:15px}
.signpage{max-width:1000px;margin:24px auto;padding:0 20px}
.signfooter{position:sticky;bottom:0;background:#ffffffef;border-top:1px solid var(--line);padding:17px 25px;backdrop-filter:blur(10px)}
.signbrand{font-size:21px;font-weight:750;color:#2451a1}
@media(max-width:1100px){
 .sidebar{width:185px}.workspace{margin-left:185px}
 .grid{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}
 .editlayout{grid-template-columns:minmax(0,1fr) 365px}
 .editfields .formgrid{grid-template-columns:1fr}
 main{padding:20px}
}
@media(max-width:740px){
 .sidebar{position:static;width:auto;padding:10px;display:block}
 .sidebar nav{display:flex;overflow:auto}.nav{width:auto;white-space:nowrap}
 .logo{padding:5px 10px}.logo small,.sidefoot{display:none}
 .workspace{margin:0}.topbar{position:static;height:auto;padding:14px;flex-wrap:wrap}
 .equal,.formgrid{grid-template-columns:1fr}
 .head{flex-wrap:wrap}.editlayout{display:block;overflow:auto}
 .editpreview,.editfields{overflow:visible}.editpreview .doc{min-height:400px}
 .doc{padding:25px}.stats{gap:10px}.stat{padding:15px}
 .uploadtop{margin:10px;padding:12px}.uploadtop input{width:100%}
}
</style>
</head>

<script>

 {id:"biz1",name:"张三",role:"biz",title:"业务经理",dept:"采购部"},

 {id:FINANCE,name:"孙会计",role:"finance",title:"财务审批人",dept:"财务部"}

// 仅为本地流程账号，不是服务端安全认证。
const PASSWORD="123456";
const PARTIES=[
 {name:"七只小牛",address:"7",contact:"陈经理",phone:"021-68888888"},
 {name:"八只小牛",address:"8",contact:"李经理",phone:"021-68888889"},
 {name:"九只小牛",address:"9",contact:"王经理",phone:"021-68888890"},
 {name:"十只小牛",address:"10",contact:"赵经理",phone:"021-68888891"}

const S={
 draft:["草稿",""],assign:["待主管分派","purple"],
 legal:["法务审批中","purple"],finance:["财务审批中","orange"],
 returned:["退回待修改","red"],ready:["待甲方签章","orange"],
 signed_a:["甲方已签 · 待发送","blue"],pending_b:["对方未完成","orange"],
 expired:["链接已失效",""],completed:["双方签署完成","green"],

};

 ["Email","电子邮箱"],["Bank","开户行"],["Account","银行账号"],
 ["AccountName","账户名称"],["Invoice","开票信息"]
];

};

 LABELS["a"+key]="甲方"+label;LABELS["b"+key]="乙方"+label;
}
const COMMON_FIELDS=[
 {key:"service",label:"采购内容 / 产品服务",type:"textarea",required:true},
 {key:"amount",label:"合同总金额（元）",type:"number",required:true},
 {key:"taxRate",label:"含税说明",type:"text",required:true},
 {key:"deliveryDays",label:"交付期限（自然日）",type:"number",required:true},
 {key:"deliveryMethod",label:"交付方式",type:"text",required:true},
 {key:"settleMethod",label:"结算方式",type:"select",options:["预付","后付"],required:true}
];
const PURCHASE=`通用采购协议

甲方：{{aName}}
地址：{{aAddress}}
联系人：{{aContact}}
联系电话：{{aPhone}}

乙方：{{bName}}
地址：{{bAddress}}
联系人：{{bContact}}
联系电话：{{bPhone}}

鉴于，甲方有意向乙方购买产品/服务，乙方愿意向甲方提供满足甲方需求的产品/服务。现根据《中华人民共和国民法典》，经双方友好协商，就甲方采购乙方{{service}}产品/服务事宜签订本协议，以资共同遵守。

一、采购内容
{{service}}

二、交付与验收
1、本合同签订后{{deliveryDays}}个自然日内，乙方以{{deliveryMethod}}方式向甲方交付本合同约定产品/服务，如涉及包装、运输、安装等，相关费用由乙方承担。

3、如乙方未按照本合同约定进行交付，每逾期一日，应按照合同总额万分之五的标准向甲方支付违约金。

三、结算
1、本合同总金额为人民币{{amount}}元（含税：{{taxRate}}）。
2、结算方式：{{settleMethod}}。
3、甲方开票信息：{{aInvoice}}
4、乙方收款信息：
账户名称：{{bAccountName}}
开户行：{{bBank}}
银行账号：{{bAccount}}

四、双方权利与义务
1、乙方保证所提供的产品/服务符合国家、行业相关标准以及本附件规定的质量标准。

五、知识产权与保密
1、乙方保证对其提供的产品/服务具有合法有效知识产权或已获得相关权利人的授权。

六、违约责任
1、甲方未按本合同约定付款的，每逾期一日，按照合同总金额的千分之一向乙方支付违约金。

七、不可抗力
1、因不可抗力导致一方不能履行或延迟履行本协议，受影响的一方不承担违约责任。

八、争议管辖
1、因本合同引起的争议，双方应友好协商解决。协商不成的，任一方均有权将其提交至甲方住所地人民法院诉讼。

九、其他
1、本合同经双方加盖公章或合同章后生效。

（以下无正文，为签字页）`;

const NDA=`保密承诺函

致：{{bName}}（下称“贵方”或“披露方”）

本司，{{aName}}（下称“本司”或“接收方”），鉴于本司与贵方拟开展的{{projectName}}项目（下称“项目”）中，贵方作为信息披露方将向本司披露若干保密信息。本司作为保密信息接收方，特此就项目保密事宜，向贵方郑重承诺如下：

第一条 保密信息

1.2 保密信息不论纸质、电子、声像或其他形式。

第二条 保密义务
2.1 本司对与项目有关的及在开展项目过程中知悉的保密信息负有保密义务，无论项目是否成立均不得泄露。

第三条 保密信息专有权
3.1 本司理解并同意，保密信息及与之相关的权利均为贵方的专有财产。

第四条 违约责任
4.1 本司违反本函件约定将给贵方造成重大和不能挽回的损害，本司应赔偿因此给贵方造成的全部损失。

第五条 生效及其他
5.1 本承诺函自本司加盖公章之日起生效。

特此承诺。
承诺方：{{aName}}（公章）`;

/* ---------- 原件存储 ---------- */
function openDB(){
 if(filePromise)return filePromise;
 filePromise=new Promise((resolve,reject)=>{
  need(window.indexedDB,"浏览器不支持附件存储。");
  const req=indexedDB.open(FILEDB,1);
  req.onupgradeneeded=()=>req.result.createObjectStore("files",{keyPath:"id"});
  req.onsuccess=()=>resolve(req.result);
  req.onerror=()=>{filePromise=null;reject(Error("无法打开附件存储。"))};
 });
 return filePromise;
}
async function saveFile(blob,name){
 const database=await openDB(),meta={id:uid("file-"),name:name||blob.name,type:blob.type,size:blob.size};
 await new Promise((resolve,reject)=>{
  const t=database.transaction("files","readwrite");
  t.objectStore("files").put({...meta,blob});
  t.oncomplete=resolve;t.onerror=()=>reject(Error("附件保存失败。"));
  t.onabort=()=>reject(Error("附件保存已中止。"));
 });
 return meta;
}
async function readFile(id){
 const database=await openDB();
 return new Promise((resolve,reject)=>{
  const r=database.transaction("files").objectStore("files").get(id);
  r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(Error("附件读取失败。"));
 });
}
function download(name,content,type="application/octet-stream"){
 const blob=content instanceof Blob?content:new Blob([content],{type});
 const url=URL.createObjectURL(blob),a=document.createElement("a");
 a.href=url;a.download=name;document.body.append(a);a.click();a.remove();
 setTimeout(()=>URL.revokeObjectURL(url),30000);
}
async function attachment(c,preview=false){
 need(visible(c));const actor=account;
 const stored=await readFile(c.file?.id);
 need(account===actor&&visible(c),"账号已变化。");need(stored?.blob,"本浏览器未找到对应原件。");
 if(!tx(()=>log(preview?"预览附件":"下载附件",stored.name,c)))return;
 if(!preview){download(stored.name,stored.blob);return}
 if(!/\.(pdf|png|jpe?g)$/i.test(stored.name)){download(stored.name,stored.blob);return}
 const url=URL.createObjectURL(stored.blob);
 modal(`${MH(esc(stored.name))}${/\.pdf$/i.test(stored.name)?
 `<iframe class="pdf" src="${url}"></iframe>`:`<img class="scanimg" src="${url}" alt="合同扫描件">`}`,"large");
 urls.push(url);
}

/* ---------- 文件解析与双主体识别 ---------- */
async function parseDocx(buffer){
 const data=new Uint8Array(buffer),view=new DataView(buffer);
 need(data.length>=22,"DOCX 文件无效。");
 let end=-1;
 for(let i=data.length-22;i>=Math.max(0,data.length-65557);i--){
  if(view.getUint32(i,true)===0x06054b50){end=i;break}
 }
 need(end>=0,"未找到 DOCX 压缩目录。");
 const count=view.getUint16(end+10,true);let p=view.getUint32(end+16,true);
 for(let n=0;n<count;n++){
  need(p+46<=data.length&&view.getUint32(p,true)===0x02014b50,"DOCX 目录损坏。");
  const method=view.getUint16(p+10,true),size=view.getUint32(p+20,true),
   unpacked=view.getUint32(p+24,true),nl=view.getUint16(p+28,true),
   el=view.getUint16(p+30,true),cl=view.getUint16(p+32,true),off=view.getUint32(p+42,true);
  need(p+46+nl+el+cl<=data.length,"DOCX 目录越界。");
  const name=new TextDecoder().decode(data.subarray(p+46,p+46+nl));
  if(name==="word/document.xml"){
   need(unpacked<=8*1024*1024,"DOCX 解压正文过大。");
   need(off+30<=data.length,"DOCX 数据损坏。");
   const start=off+30+view.getUint16(off+26,true)+view.getUint16(off+28,true);
   need(start+size<=data.length,"DOCX 数据不完整。");
   let bytes=data.subarray(start,start+size);
   if(method===8){
    need(typeof DecompressionStream!=="undefined","浏览器不支持 DOCX 解压，请使用新版 Chrome 或 Edge。");
    const reader=new Blob([bytes]).stream().pipeThrough(new DecompressionStream("deflate-raw")).getReader();
    const chunks=[];let total=0;
    try{while(true){
     const r=await reader.read();if(r.done)break;
     total+=r.value.length;need(total<=8*1024*1024,"DOCX 解压体积超限。");chunks.push(r.value);
    }}catch(e){await reader.cancel();throw e}
    bytes=new Uint8Array(total);let offset=0;
    for(const chunk of chunks){bytes.set(chunk,offset);offset+=chunk.length}
   }else need(method===0,"不支持此 DOCX 压缩方式。");
   const xml=new DOMParser().parseFromString(new TextDecoder().decode(bytes),"application/xml");
   need(!xml.getElementsByTagName("parsererror").length,"DOCX 正文解析失败。");
   return [...xml.getElementsByTagNameNS("*","p")].map(paragraph=>
    [...paragraph.getElementsByTagNameNS("*","t")].map(t=>t.textContent).join("")).join("\n");
  }
  p+=46+nl+el+cl;
 }
 throw Error("未找到 DOCX 正文。");
}
async function extract(file){
 const ext=file.name.split(".").pop().toLowerCase();
 if(["txt","md"].includes(ext))return file.text();
 if(ext==="docx")return parseDocx(await file.arrayBuffer());
 if(ext==="pdf"){
  const lib=await import("https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.min.mjs");
  lib.GlobalWorkerOptions.workerSrc="https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.worker.min.mjs";
  const doc=await lib.getDocument({data:new Uint8Array(await file.arrayBuffer()),isEvalSupported:false}).promise;
  try{
   need(doc.numPages<=100,"PDF 超过 100 页，请拆分文件。");
   let text="";
   for(let n=1;n<=doc.numPages;n++){
    const page=await doc.getPage(n),content=await page.getTextContent();let y=null;
    for(const item of content.items){
     if(!("str" in item))continue;
     const ny=item.transform?.[5];
     if(y!==null&&Math.abs(ny-y)>3)text+="\n";
     text+=item.str+(item.hasEOL?"\n":" ");y=ny;
    }
    text+="\n\n";need(text.length<=150000,"提取正文过长。");
   }return text.trim();
  }finally{await doc.destroy()}
 }
 throw Error("不支持此文件格式。");
}
function recognize(text){
 const t=String(text).replace(/\r/g,"").replace(/\u00a0/g," ");
 const result={},ambiguous=[];
 const aliases={
 Name:"(?:公司名称|企业名称|单位名称|主体名称)",
 Credit:"(?:统一社会信用代码|社会信用代码|纳税人识别号|税号)",
 Address:"(?:注册地址|联系地址|通讯地址|住所地|住所|地址)",
 Legal:"(?:法定代表人|法人代表)",
 Contact:"(?:联系人|经办人)",
 Phone:"(?:联系电话|联系手机|手机号码|手机号|电话|手机)",
 Email:"(?:电子邮箱|电子邮件|邮箱|Email|E-mail)",
 Bank:"(?:开户银行|开户行)",
 Account:"(?:银行账号|银行帐号|收款账号|收款帐号|账号|帐号)",
 AccountName:"(?:银行账户名称|收款账户名称|账户名称|开户名称|开户名|户名)",
 Invoice:"(?:开票信息|发票信息)"
 };
 const trimValue=s=>String(s||"").trim().replace(/[；;，,]+$/,"");
 const collect=(regex,source)=>{
  const values=[];for(const m of source.matchAll(regex)){const value=trimValue(m[1]);if(value&&!values.includes(value))values.push(value)}
  return values;
 };
 for(const [party,prefix] of [["甲方","a"],["乙方","b"]]){
  const other=party==="甲方"?"乙方":"甲方";
  const block=new RegExp(`${party}\\s*(?:[（(][^\\n）)]{0,25}[）)])?\\s*[:：]([^]*?)(?=\\n\\s*${other}\\s*(?:[（(][^\\n）)]{0,25}[）)])?\\s*[:：]|$)`,"g");
  const blocks=[...t.matchAll(block)].map(m=>m[1].slice(0,2500));
  const nameRegex=new RegExp(`(?:^|\\n|[ \\t])${party}\\s*(?:[（(][^\\n）)]{0,25}[）)])?\\s*[:：]\\s*([^\\n]{2,150})`,"g");
  const names=collect(nameRegex,t).map(v=>v.split(/\s+(?:乙方|甲方|地址|联系人|联系电话)\s*[:：]/)[0].trim());
  const unique=[...new Set(names.filter(Boolean))];
  if(unique.length===1)result[prefix+"Name"]=unique[0];
  else if(unique.length>1)ambiguous.push(LABELS[prefix+"Name"]);
  for(const [field,label] of Object.entries(aliases)){
   const explicit=new RegExp(`${party}\\s*(?:的)?\\s*${label}\\s*[:：]\\s*([^\\n;；]{1,200})`,"gi");
   let values=collect(explicit,t);
   if(!values.length){
    const blockValues=[];
    for(const b of blocks){
     const regex=new RegExp(`(?:^|\\n|[ \\t])${label}\\s*[:：]\\s*([^\\n;；]{1,200})`,"gi");
     blockValues.push(...collect(regex,b));
    }
    values=[...new Set(blockValues)];
   }
   if(field==="Phone")values=values.map(v=>v.match(/(?:\+?86[- ]?)?1[3-9]\d{9}|0\d{2,3}[- ]?\d{7,8}(?:-\d+)?/)?.[0]||"").filter(Boolean);
   if(field==="Email")values=values.map(v=>v.match(/[A-Z0-9._%+-]+@[A-Z0-9.-]+\.[A-Z]{2,}/i)?.[0]||"").filter(Boolean);
   if(field==="Credit")values=values.map(v=>v.match(/[A-Z0-9]{18}/i)?.[0]||"").filter(Boolean);
   if(field==="Account")values=values.map(v=>v.match(/\d[\d -]{6,35}\d/)?.[0]?.replace(/[ -]/g,"")||"").filter(Boolean);
   values=[...new Set(values)];
   if(field==="Name"&&result[prefix+"Name"])continue;
   if(values.length===1)result[prefix+field]=values[0];
   else if(values.length>1)ambiguous.push(LABELS[prefix+field]);
  }
 }
 const amount=t.match(/(?:合同总金额|合同金额|合同总价|总价款|人民币)\s*(?:为|是|:|：)?\s*(?:人民币)?\s*[¥￥]?\s*([\d,，]+(?:\.\d{1,2})?)\s*(万元|元)/);
 if(amount){
  const n=Number(amount[1].replace(/[,，]/g,""))*(amount[2]==="万元"?10000:1);
  if(Number.isFinite(n))result.amount=n.toFixed(2);
 }
 return {values:result,ambiguous:[...new Set(ambiguous)]};
}
function adopt(key,overwrite=false){
 const control=$("editForm")?.elements.namedItem(key),value=editor?.recognized[key];
 if(!control||value==null||(!overwrite&&String(control.value).trim()))return false;
 control.value=value;return true;
}
function renderRecognition(ambiguous=[]){
 $("recognizeBox").hidden=false;
 $("recognizeBox").innerHTML=`<div class="actions between"><b style="font-size:12px">识别结果 · 待核对</b>${B("fill-empty","回填空字段","","small")}</div>
 ${Object.entries(editor.recognized).map(([k,v])=>`<div class="recrow"><span>${esc(LABELS[k]||k)}</span><strong>${esc(v)}</strong>${B("adopt","采用",k)}</div>`).join("")||
 '<p class="muted">未识别到足够明确的信息，请根据原件填写。</p>'}
 ${ambiguous.length?`<p class="muted">存在多个候选值，未自动回填：${esc(ambiguous.join("、"))}</p>`:""}
 <p class="muted" style="margin-bottom:0">未识别字段保留原值；“采用”覆盖单项。请核对所有信息与原件一致。</p>`;
}
async function uploadContract(file){
 const e=editor;need(e&&e.mode==="nonstandard"&&!e.busy,"正在读取文件，请稍候。");
 need(/\.(pdf|docx|txt|md)$/i.test(file.name)&&file.size<=15*1024*1024,"仅支持 PDF、DOCX、TXT、MD，最大 15 MB。");
 if($("editBody").value.trim()&&!confirm("新文件将替换编辑区正文，是否继续？"))return;
 const before=$("editBody").value;e.busy=true;$("saveEditor").disabled=true;
 $("uploadState").textContent="正在读取 "+file.name+"……";
 try{
  e.file=await saveFile(file);if(editor!==e)return;
  if(e.url)URL.revokeObjectURL(e.url);e.url=URL.createObjectURL(file);
  const text=String(await extract(file)).trim();if(editor!==e)return;
  need(text,"未提取到文本。扫描 PDF 需先 OCR；原件已保存，可人工粘贴正文。");
  need(text.length<=150000,"正文超过长度限制。");
  need($("editBody").value===before,"读取期间正文已修改，未覆盖当前内容。");
  $("editBody").value=text;
  const recognized=recognize(text);e.recognized=recognized.values;
  let n=0;for(const key of Object.keys(e.recognized))if(adopt(key))n++;
  e.parseNote=`识别 ${Object.keys(e.recognized).length} 项，回填 ${n} 个空字段`;
  $("uploadState").textContent=`${file.name} · ${text.length} 字符 · ${e.parseNote}`;
  if(["","非标合同"].includes($("editForm").elements.title.value.trim()))
   $("editForm").elements.title.value=file.name.replace(/\.[^.]+$/,"");
  renderRecognition(recognized.ambiguous);livePreview();
 }catch(error){
  if(editor===e){e.parseNote="文本解析未成功，需人工核对";$("uploadState").textContent=error.message;toast(error.message)}
 }finally{e.busy=false;if(editor===e)$("saveEditor").disabled=false}
}

/* ---------- 详情 ---------- */
function flow(c){
 const names=c.mode==="standard"?["填写","免审批","甲方签署","乙方签署","完成"]:
 ["填写","主管分派","法务审批","财务审批","甲方签署","乙方签署","完成"];
 const map=c.mode==="standard"?{draft:0,returned:0,ready:2,signed_a:3,pending_b:3,completed:4,unilateral_done:4}:
 {draft:0,returned:0,assign:1,legal:2,finance:3,ready:4,signed_a:5,pending_b:5,completed:6,unilateral_done:6};
 const active=map[c.status]??0;
 return `<div class="flow">${names.map((n,i)=>`<div class="step ${i<active?"done":i===active?"active":""}"><i>${i<active?"✓":i+1}</i>${n}</div>`).join("")}</div>`;
}
function contractActions(c){

function openVersion(c,n,diff){

  const prev=c.versions.find(v=>v.version===n-1);need(prev);
  let fields="",lines="";const keys=new Set([...Object.keys(prev.data),...Object.keys(v.data)]);
  for(const k of keys)if(prev.data[k]!==v.data[k])fields+=`<h3>${esc(LABELS[k]||k)}</h3>
  <div class="diffold">− ${esc(prev.data[k]||"（空）")}</div><div class="diffnew">+ ${esc(v.data[k]||"（空）")}</div>`;
  const a=prev.body.split("\n"),b=v.body.split("\n");
  for(let i=0;i<Math.max(a.length,b.length);i++)if(a[i]!==b[i])lines+=`<div class="muted">第 ${i+1} 行</div>
  <div class="diffold">− ${esc(a[i]??"（无）")}</div><div class="diffnew">+ ${esc(b[i]??"（删除）")}</div>`;
  html=`<div class="tip">逐行对比用于定位变化；插入或删除行可能造成后续行错位，请结合全文审阅。</div>
  <h2>字段差异</h2>${fields||'<p class="muted">无变化</p>'}<h2 style="margin-top:20px">正文差异</h2>${lines||'<p class="muted">无变化</p>'}`;
 }
 if(!tx(()=>log(diff?"查看版本差异":"查看历史版本",`V${n}`,c)))return;
 modal(`${MH(diff?`V${n-1} → V${n}`:`版本 V${n}`)}${html}`,"large");
}

async function signingAction(action){

  id:"external:"+c.id,name:c.data.bContact||c.data.bName,title:"乙方签署人",role:"external"

 if(action==="sign-code"){

  toast("本次模拟验证码：123456");return;
 }
 if(action==="sign-verify"){
  need(sentCodeToken===token&&$("verifyCode").value==="123456","请先获取模拟验证码，再填写 123456。");
  tx(()=>{verifiedToken=token;log("通过模拟身份验证",party==="a"?"甲方验证通过。":"乙方验证通过。",c,actor)});
  return;
 }
 if(action==="sign-confirm"){
  need(verifiedToken===token&&$("agreeSign")?.checked,"请先验证身份并勾选合同确认。");
  tx(()=>{
   const current=signingContext().c;
   need(!current.signatures[party],"当前签署方已完成签署。");
   if(party==="a")need(current.status==="ready","合同不在甲方签署阶段。");
   else need(current.status==="pending_b"&&current.signatures.a,"合同不在乙方签署阶段。");
   current.signatures[party]={at:now(),by:actor.name,actorId:actor.id,version:current.version,source:"simulation"};
   log(party==="a"?"甲方模拟签章完成":"乙方模拟签署完成",`已确认 V${current.version}。`,current,actor);
   if(party==="a"){
    if(current.signType==="unilateral"){
     current.status="unilateral_done";
     message(current.owner,"单方协议已完成签署",current);
     log("单方协议办理完成","按双签归档规则，不进入合同汇总表。",current,SYSTEM);
    }else{current.status="signed_a";simulateSend(current,SYSTEM)}
   }else archive(current);
  });return;
 }
 if(action==="sign-open-b"){
  need(party==="a"&&c.bInvite);
  window.open(signLink(c,"b"),"_blank","noopener,noreferrer");return;
 }
 if(action==="sign-resend"){
  need(party==="a");
  tx(()=>simulateSend(c,actor));return;
 }
 if(action==="sign-copy-b"){
  need(party==="a"&&c.bInvite);
  await copyLink(signLink(c,"b"));return;
 }
}

async function validateScan(file){
 need(file instanceof Blob&&file.size>0&&file.size<=30*1024*1024,"请选择不超过 30 MB 的扫描件。");
 need(/\.(pdf|jpe?g|png)$/i.test(file.name),"仅支持 PDF、JPG、PNG。");
 const bytes=new Uint8Array(await file.slice(0,1024).arrayBuffer());
 if(/\.pdf$/i.test(file.name))need(new TextDecoder().decode(bytes).includes("%PDF-"),"PDF 文件头无效。");
 else if(/\.png$/i.test(file.name))need(bytes[0]===137&&bytes[1]===80&&bytes[2]===78&&bytes[3]===71,"PNG 文件头无效。");
 else need(bytes[0]===255&&bytes[1]===216,"JPEG 文件头无效。");
}

/* ---------- 表单 ---------- */
document.addEventListener("submit",async event=>{
 event.preventDefault();const form=event.target;
 if(!(form instanceof HTMLFormElement)||!form.reportValidity())return;
 const values=Object.fromEntries(new FormData(form));
 try{
  if(form.id==="loginForm"){
   need(user(values.account)&&values.password===PASSWORD,"账号或密码错误。");
   const id=values.account;
   if(tx(()=>log("登录系统","进入账号工作区。",null,user(id)))){account=id;view="home";render()}
   return;
  }
  need(me(),"请先登录。");
  if(form.id==="editForm"){saveEditor(form);return}
  if(form.id==="assignForm"){
   tx(()=>{
    const c=get(form.dataset.id);need(c&&me().role==="chief"&&["assign","legal"].includes(c.status)&&c.version===Number(form.dataset.version));
    need(user(values.assignee)?.role==="legal"&&values.reason.trim(),"请选择法务并填写说明。");
    const old=c.assignee;need(c.status==="assign"||old!==values.assignee,"请选择不同的承办法务。");
    c.assignee=values.assignee;c.status="legal";c.participants=[...new Set([...c.participants,c.assignee])];
    log(old?"改派法务":"分派法务",`${userName(old)} → ${userName(c.assignee)}；${values.reason.trim()}`,c);
    if(old&&old!==c.assignee)message(old,"合同已改派其他法务",c);
    message(c.assignee,(c.priority==="urgent"?"【紧急】":"")+"收到新的法务审批任务",c);message(c.owner,"合同已分派给 "+userName(c.assignee),c);
   });return;
  }
  if(form.id==="reviewForm"){
   tx(()=>{
    const c=get(form.dataset.id);need(c&&canApprove(c)&&c.version===Number(form.dataset.version));
    const legal=me().role==="legal",pass=form.dataset.pass==="1";
    need(values.opinion.trim(),"请填写审批意见。");if(pass)need(values.checked,"请完成核对确认。");
    if(!legal)need(c.legalVersion===c.version,"当前版本未完成法务审批。");
    c.approvals.push({node:legal?"法务审批":"财务审批",by:me().name,byId:account,at:now(),
     version:c.version,result:pass?"通过":"退回",opinion:values.opinion.trim()});
    log((legal?"法务":"财务")+"审批"+(pass?"通过":"退回"),values.opinion.trim(),c);
    if(!pass){
     c.status="returned";c.returnReason=(legal?"法务":"财务")+"退回："+values.opinion.trim();
     message(c.owner,c.returnReason,c);
    }else if(legal){
     c.legalVersion=c.version;c.status="finance";c.financeEntered=true;
     log("自动提交财务","固定财务审批人：孙会计。",c,SYSTEM);
     message(FINANCE,(c.priority==="urgent"?"【紧急】":"")+"收到法务已通过的财务审批任务",c);message(c.owner,"法务已通过，进入财务审批",c);
    }else{c.financeVersion=c.version;enterSigning(c)}
   });return;
  }
  if(form.id==="reasonForm"){
   tx(()=>{
    const c=get(form.dataset.id);need(c&&c.owner===account&&me().role==="biz");
    need(values.reason.trim(),"请填写原因。");
    if(form.dataset.kind==="withdraw"){
     need(["assign","legal","finance"].includes(c.status));c.status="draft";
     c.legalVersion=null;c.financeVersion=null;log("撤回申请",values.reason.trim(),c);
    }else{
     need(!["completed","unilateral_done","terminated"].includes(c.status));
     c.status="terminated";log("终止流程",values.reason.trim(),c);
    }
    if(c.assignee)message(c.assignee,"合同已撤回或终止",c);
    if(c.financeEntered)message(FINANCE,"合同已撤回或终止",c);
    if(c.mode==="nonstandard")message("chief","合同已撤回或终止",c);
   });return;
  }
  if(form.id==="importForm"){
   need(hasSummary()&&!form.dataset.busy);form.dataset.busy="1";
   const actor=account;$("importSave").disabled=true;
   try{
    need(values.confirmed&&values.note.trim(),"请确认双方盖章并填写核对说明。");
    need(values.aName.trim()&&values.bName.trim()&&values.title.trim(),"请填写合同及双方名称。");
    const date=new Date(values.signedDate+"T12:00:00");need(Number.isFinite(date.getTime())&&date.getTime()<=Date.now()+86400000,"签署日期无效。");
    const today=new Date();const day=today.getFullYear()+"-"+String(today.getMonth()+1).padStart(2,"0")+"-"+String(today.getDate()).padStart(2,"0");
    need(values.signedDate<=day,"签署日期不能晚于今天。");
    if(values.amount)need(/^\d+(\.\d{1,2})?$/.test(values.amount),"金额最多两位小数。");
    await validateScan(values.file);const file=await saveFile(values.file);
    need(actor===account&&hasSummary()&&$("importForm")===form,"账号或导入窗口已变化。");
    tx(()=>{
     need(account===actor&&hasSummary());
     const c={id:uid("c-"),no:`QN-${new Date().getFullYear()}-${++db.seq}`,title:values.title.trim(),
      owner:account,dept:me().dept,mode:"imported",status:"completed",version:1,
      type:"采购协议",signType:"bilateral",data:{aName:values.aName.trim(),bName:values.bName.trim(),amount:values.amount},
      body:"纸质已签署合同以导入扫描件为准。",file,createdAt:now(),updatedAt:now(),
      versions:[],approvals:[],participants:[],signatures:{
       a:{at:date.toISOString(),source:"paper",by:values.aName.trim()},
       b:{at:date.toISOString(),source:"paper",by:values.bName.trim()}
      },archivedAt:now(),importedBy:account,importNote:values.note.trim()};
     c.archiveNo="ARC-"+c.no;db.contracts.unshift(c);
     log("导入纸质双签合同",`${file.name}；双方盖章由导入人核对；${values.note.trim()}`,c);
     log("纸质协议归档","双方签署状态来源：导入人确认扫描件，不进行印章真实性自动判断。",c,SYSTEM);
     view="summary";filters={q:"",status:"",mode:"",days:""};page=1;
    });
   }finally{if(form.isConnected){form.dataset.busy="";$("importSave").disabled=false}}
   return;
  }
  if(form.id==="templateForm"){
   need(me().role==="chief"&&!form.dataset.loading,"模板文件正在读取。");
   const fields=JSON.parse(values.fields);
   need(Array.isArray(fields)&&fields.length<=40,"字段须为数组，最多 40 项。");
   const entityKeys=ENTITY_FIELDS.flatMap(([k])=>["a"+k,"b"+k]),seen=new Set();
   const reserved=["title","body","type","signType","note","__proto__","constructor","prototype",...entityKeys];
   for(const f of fields){
    need(f&&typeof f.key==="string"&&/^[A-Za-z][A-Za-z0-9_]{0,39}$/.test(f.key)&&!reserved.includes(f.key)&&!seen.has(f.key),"字段 key 重复或无效。");
    need(typeof f.label==="string"&&f.label.trim()&&["text","textarea","number","select"].includes(f.type),"字段定义不完整。");
    if(f.type==="select")need(Array.isArray(f.options)&&f.options.length&&f.options.every(x=>typeof x==="string"),"select 需要字符串 options。");
    seen.add(f.key);
   }
   const allowed=new Set([...entityKeys,...seen]);
   need([...values.body.matchAll(/\{\{([^{}]+)\}\}/g)].every(m=>allowed.has(m[1])),"正文存在未定义的字段占位符。");
   tx(()=>{
    need(me().role==="chief"&&values.name.trim()&&values.body.trim()&&values.note.trim());
    let t=db.templates.find(t=>t.id===form.dataset.id);
    if(form.dataset.id){
     need(t&&t.version===Number(form.dataset.version),"模板版本已变化。");
     t.history.push({version:t.version,body:t.body,fields:clone(t.fields),at:now()});t.version++;
    }else{
     const n=Math.max(0,...db.templates.map(t=>Number(t.code.replace(/\D/g,""))||0))+1;
     t={id:uid("t-"),code:"TPL-"+String(n).padStart(3,"0"),version:1,enabled:true,history:[]};db.templates.push(t);
    }
    Object.assign(t,{name:values.name.trim(),type:values.type,signType:values.signType,body:values.body.trim(),fields});
    log("发布模板",`${t.code} ${t.name} V${t.version}；${values.note.trim()}`);
   });return;
  }
 }catch(e){toast(e.message||"操作失败。")}
});

/* ---------- 点击事件 ---------- */
document.addEventListener("click",async event=>{
 const el=event.target.closest("[data-action]");if(!el)return;
 event.preventDefault();const action=el.dataset.action,id=el.dataset.id;
 try{
  if(action==="close"){closeModal();return}
  if(signingPage){await signingAction(action);return}
  need(me(),"请先登录。");
  if(action==="logout"){
   if(tx(()=>log("退出系统","退出当前账号工作区。"))){account="";view="home";closeModal();render()}return;
  }
  if(action==="go"){
   if(id==="summary")need(hasSummary());
   if(id==="templates")need(me().role==="chief");
   if(id==="create")need(me().role==="biz");
   view=id;page=1;filters={q:"",status:"",mode:"",days:""};closeModal();render();return;
  }
  if(action==="filter"){
   filters={q:$("filterQ").value.trim(),mode:$("filterMode").value,status:$("filterStatus")?.value||"",days:$("filterDays").value};
   page=1;render();return;
  }
  if(action==="clear-filter"){filters={q:"",status:"",mode:"",days:""};page=1;render();return}
  if(action==="page"){page+=Number(id);render();return}
  if(action==="new-standard"){openEditor("",id);return}
  if(action==="new-nonstandard"){openEditor();return}
  if(action==="convert"){convert();return}
  if(action==="adopt"){if(adopt(id,true))livePreview();return}
  if(action==="fill-empty"){
   let n=0;for(const k of Object.keys(editor?.recognized||{}))if(adopt(k))n++;
   livePreview();toast(`已回填 ${n} 个空字段。`);return;
  }
  if(action==="editor-original"){
   const e=editor;need(e?.file,"请先上传合同。");
   if(e.url){window.open(e.url,"_blank","noopener,noreferrer");return}
   const f=await readFile(e.file.id);need(editor===e&&f?.blob,"原件未找到或窗口已变化。");
   download(f.name,f.blob);return;
  }
  if(action==="tab"){tab=id;render();return}
  if(action==="import"){openImport();return}
  if(action==="export-summary"){exportSummary();return}
  if(action==="template-new"){templateEditor();return}
  if(action==="template-edit"){templateEditor(id);return}
  if(action==="template-toggle"){
   tx(()=>{need(me().role==="chief");const t=db.templates.find(t=>t.id===id);need(t);
    t.enabled=!t.enabled;log("启停模板",`${t.enabled?"启用":"停用"} ${t.code} ${t.name}`)});return;
  }
  if(action==="read-all"){
   tx(()=>{db.messages.filter(m=>m.to===account).forEach(m=>m.read=true);log("消息全部已读")});return;
  }
  if(action==="open-message"){
   const m=db.messages.find(m=>m.id===id&&m.to===account);need(m);
   const c=get(m.cid);
   if(c&&archived(c)&&hasSummary()){
    tx(()=>{m.read=true});await archivePreview(get(c.id));return;
   }
   tx(()=>{m.read=true;if(c&&visible(c)){cid=c.id;view="detail";tab="document";log("查看合同","从通知进入。",c)}});
   if(!c||!visible(c))toast("该合同不在当前账号可见范围。");return;
  }
  if(action==="export-logs"){
   if(!tx(()=>log("导出操作日志",me().role==="chief"?"导出全部日志。":"导出本人日志。")))return;
   download("操作日志.json",JSON.stringify(ownLogs(),null,2),"application/json;charset=utf-8");return;
  }
  const c=get(id);need(c&&visible(c),"合同不存在或无权访问。");
  if(action==="detail"){
   if(c.mode==="imported"){await archivePreview(c);return}
   tx(()=>{cid=c.id;view="detail";tab="document";log("查看合同","打开合同详情。",c)});return;
  }
  if(action==="edit"){openEditor(id);return}
  if(action==="submit"){
   need(canEdit(c));
   if(confirm(c.mode==="standard"?"标准协议将进入甲方签署，是否提交？":"提交后由法务主管分派法务，是否继续？"))tx(()=>submit(c));
   return;
  }
  if(action==="assign"){openAssign(c);return}
  if(action==="approve"){openReview(c,true);return}
  if(action==="reject"){openReview(c,false);return}
  if(action==="withdraw"||action==="terminate"){openReason(c,action);return}
  if(action==="sign"){openSignCenter(c);return}
  if(action==="open-b"){
   need(c.owner===account&&me().role==="biz"&&c.bInvite);
   window.open(signLink(c,"b"),"_blank","noopener,noreferrer");
   tx(()=>log("打开乙方模拟签署页面","用于演示乙方签署流程。",c));return;
  }
  if(action==="resend"){
   need(canSign(c)&&c.status==="pending_b");
   tx(()=>simulateSend(c,me()));toast("签署链接已重新模拟发送，旧乙方链接已失效。");return;
  }
  if(action==="archive-preview"){await archivePreview(c);return}
  if(action==="archive-download"){await archiveDownload(c);return}
  if(action==="preview-original"){await attachment(c,true);return}
  if(action==="download-original"){await attachment(c,false);return}
  if(action==="version"||action==="diff"){openVersion(c,Number(el.dataset.version),action==="diff");return}
 }catch(e){toast(e.message||"操作失败。")}
});

document.addEventListener("input",event=>{
 if(event.target.closest("#editForm"))livePreview();
});
document.addEventListener("change",async event=>{
 try{
  if(event.target.id==="editPriority"){
   const urgent=event.target.value==="urgent";
   const f=$("priorityReasonField");
   if(f)f.hidden=!urgent;
   const ta=f?f.querySelector("textarea"):null;
   if(ta)ta.required=urgent;
   return;
  }
  if(event.target.id==="partyPick"){
   const p=PARTIES.find(p=>p.name===event.target.value);if(!p)return;
   const f=$("editForm");
   f.elements.aName.value=p.name;f.elements.aAddress.value=p.address;
   f.elements.aContact.value=p.contact;f.elements.aPhone.value=p.phone;livePreview();return;
  }
  if(event.target.id==="contractUpload"){
   if(event.target.files[0])await uploadContract(event.target.files[0]);return;
  }
  if(event.target.id==="templateUpload"){
   const file=event.target.files[0],form=$("templateForm");if(!file)return;
   need(/\.(docx|txt|md)$/i.test(file.name)&&file.size<=15*1024*1024,"模板支持 DOCX、TXT、MD，最大 15 MB。");
   if($("templateBody").value.trim()&&!confirm("将替换模板正文，是否继续？"))return;
   const before=$("templateBody").value;form.dataset.loading="1";
   try{
    const text=await extract(file);
    need($("templateForm")===form&&$("templateBody").value===before,"窗口或正文已变化，未覆盖。");
    need(text.trim()&&text.length<=150000,"模板正文为空或过长。");
    $("templateBody").value=text;toast("正文已读取，请核对字段定义后发布。");
   }finally{if(form.isConnected)form.dataset.loading=""}
   return;
  }
  if(event.target.closest("#editForm"))livePreview();
 }catch(e){toast(e.message)}
});
document.addEventListener("dragover",event=>{
 const zone=event.target.closest("#uploadTop");if(zone){event.preventDefault();zone.classList.add("drag")}
});
document.addEventListener("dragleave",event=>event.target.closest("#uploadTop")?.classList.remove("drag"));
document.addEventListener("drop",async event=>{
 const zone=event.target.closest("#uploadTop");if(!zone)return;
 event.preventDefault();zone.classList.remove("drag");
 try{if(event.dataTransfer.files[0])await uploadContract(event.dataTransfer.files[0])}catch(e){toast(e.message)}
});
window.addEventListener("storage",event=>{
 if(event.key!==STORE||!event.newValue)return;
 try{
  const incoming=JSON.parse(event.newValue);
  if(incoming.schema!==7||incoming.revision===db.revision)return;
  db=incoming;
  if(!signingPage)closeModal();
  render();
 }catch(e){toast("数据同步失败，请刷新页面。")}
});
window.addEventListener("focus",()=>{
 try{
  const old=db.revision;sync();
  if(old!==db.revision){if(!signingPage)closeModal();render()}
 }catch{}
});
render();
</script>

<script>
(function installTargetedOptimizations() {
  "use strict";

  /* ======================================================
     1. 登录账号不绑定甲方主体
     业务可自行选择甲方主体。
     账号角色、部门和发起权限保持不变。
     ====================================================== */

  const DEMO_SESSION_KEY = STORE + ":current-account";
  let returnTimer = null;

  const originalRender = render;
  const originalRenderSign = renderSign;
  const originalOpenEditor = openEditor;
  const originalSaveEditor = saveEditor;
  const originalAdopt = adopt;
  const originalLog = log;
  const originalTable = table;
  const originalContractActions = contractActions;

  function saveDemoSession(id) {
    try {
      if (id) {
        sessionStorage.setItem(DEMO_SESSION_KEY, id);
      } else {
        sessionStorage.removeItem(DEMO_SESSION_KEY);
      }
    } catch (error) {
      // 会话存储不可用不影响原有页面操作。
    }
  }

  function restoreDemoSession() {
    try {
      const storedAccount = sessionStorage.getItem(DEMO_SESSION_KEY);
      if (user(storedAccount)) {
        account = storedAccount;
      }
    } catch (error) {
      // 无法恢复时继续使用原登录页。
    }
  }

  function isNDATemplate(template) {
    return !!template && (
      template.id === "t2" ||
      template.code === "TPL-002" ||
      template.name === "保密承诺函"
    );
  }

  function isNDAContract(contract) {
    return !!contract &&
      contract.mode === "standard" &&
      contract.signType === "unilateral" &&
      (
        contract.tplId === "t2" ||
        contract.tplCode === "TPL-002" ||
        contract.title === "保密承诺函"
      );
  }

  function isNDAEditor() {
    return !!editor &&
      editor.mode === "standard" &&
      editor.signType === "unilateral" &&
      (
        editor.tplId === "t2" ||

  canApprove = function patchedCanApprove(c) {

  /*
   * 捕获主管审批表单，防止原表单逻辑将主管误判为财务。
   * 法务专员、财务表单继续走原有逻辑。
   */
  document.addEventListener("submit", function handleChiefReview(event) {
    const form = event.target;

    if (
      !(form instanceof HTMLFormElement) ||
      form.id !== "reviewForm" ||
      me()?.role !== "chief"
    ) {
      return;
    }

    event.preventDefault();
    event.stopImmediatePropagation();

    if (!form.reportValidity()) return;

    try {
      const values = Object.fromEntries(new FormData(form));

      tx(() => {
        const c = get(form.dataset.id);

        need(
          c &&
          c.mode === "nonstandard" &&
          ["assign", "legal"].includes(c.status) &&
          c.version === Number(form.dataset.version),
          "合同当前节点或版本已变化。"
        );

        const pass = form.dataset.pass === "1";
        const opinion = String(values.opinion || "").trim();

        need(opinion, "请填写审批意见。");
        if (pass) need(values.checked, "请完成合同核对确认。");

        const previousAssignee = c.assignee;

        if (previousAssignee !== account) {
          c.assignee = account;

          c.participants = [
            ...new Set([...(c.participants || []), account])
          ];

          log(
            "主管自行处理",
            previousAssignee
              ? `主管接手处理，原承办法务：${userName(previousAssignee)}。`
              : "主管直接处理待调度合同。",
            c
          );

          if (previousAssignee) {
            message(
              previousAssignee,
              "合同已由法务主管自行处理",
              c
            );
          }
        }

        c.approvals.push({
          node: "法务审批",
          by: me().name,
          byId: account,
          at: now(),
          version: c.version,
          result: pass ? "通过" : "退回",
          opinion
        });

        log(
          pass ? "主管法务审批通过" : "主管法务审批退回",
          opinion,
          c
        );

        if (!pass) {
          c.status = "returned";
          c.returnReason = "法务主管退回：" + opinion;

          message(c.owner, c.returnReason, c);
          return;
        }

        c.legalVersion = c.version;
        c.status = "finance";
        c.financeEntered = true;

        log(
          "自动提交财务",
          "法务主管审批通过，自动提交固定财务审批人：孙会计。",
          c,
          SYSTEM
        );

        message(
          FINANCE,
          "收到法务主管已通过的财务审批任务",
          c
        );

        message(
          c.owner,
          "法务主管审批通过，已进入财务审批",
          c
        );
      });
    } catch (error) {
      toast(error.message || "审批操作失败。");
    }
  }, true);

      (
        c.signType === "unilateral" &&
        c.signatures?.a &&
        ["unilateral_done", "completed"].includes(c.status)
      ) ||
      (
        c.signType === "bilateral" &&
        c.status === "completed" &&
        c.signatures?.a &&
        c.signatures?.b
      );

    if (!finished) return;

    const firstCard = document.querySelector(".signpage .card");

    if (firstCard) {
      firstCard.innerHTML = `
        <h1>签署已完成</h1>

        <p>
          ${
            c.signType === "unilateral"
              ? "甲方已完成单方签章。"
              : "甲乙双方均已完成签署。"
          }
          合同已自动归档至合同汇总表。
        </p>

        ${KV("归档编号", c.archiveNo || "—")}

        <div class="tip" style="margin-top:16px;margin-bottom:0">
          即将自动返回业务“已签署”界面。
        </div>
      `;
    }

    if (returnTimer) return;

    returnTimer = setTimeout(() => {
      try {
        sync();

        const current = get(c.id);

        const stillFinished = current && (
          (
            current.signType === "unilateral" &&
            current.signatures?.a &&
            ["unilateral_done", "completed"].includes(current.status)
          ) ||
          (
            current.signType === "bilateral" &&
            current.status === "completed" &&
            current.signatures?.a &&
            current.signatures?.b
          )
        );

        if (!stillFinished) {
          returnTimer = null;
          renderSign();
          return;
        }

        /*
         * 仅用于本地模拟闭环：
         * 签署窗口回到该合同所属业务账号。
         * 正式对外乙方页面不能使用此方式恢复内部账号。
         */
        saveDemoSession(current.owner);

        const returnURL = location.href.split("#")[0] +
          "#view=signed";

        location.replace(returnURL);

        // 原文件把 signingPage 定义为常量，变更 hash 后需重载，
        // 才能切回普通工作区，而不是继续停留在签署分支。
        location.reload();
      } catch (error) {
        returnTimer = null;
        toast("签署已完成，请返回系统查看“已签署”。");
      }
    }, 1200);
  };

  /* ======================================================
     8. 菜单、说明及账号展示
     不修改底层页面 key，避免破坏原有跳转。
     ====================================================== */

  render = function patchedRender() {
    originalRender();

    if (signingPage) return;

    saveDemoSession(account || "");

    if (!me()) {
      return;
    }

    if (me().role === "chief") {
      const nav = document.querySelector(
        '.sidebar [data-action="go"][data-id="tasks"]'
      );

      if (nav) nav.textContent = "部门调度";

      if (view === "tasks") {
        const heading = document.querySelector("#main .head h1");
        if (heading) heading.textContent = "部门调度";

        const sub = document.querySelector("#main .head .muted");
        if (sub) {
          sub.textContent =
            "查看部门合同需求，分派法务专员或由主管自行审批；通过后自动提交财务。";
        }
      }
    }

    if (view === "summary") {
      const description = document.querySelector("#main .head .muted");

      if (description) {
        description.textContent =
          "法务、财务可查看全部已完成签署的协议及单方函件；显示提交人，仅提供预览和下载。";
      }
    }
  };

  /* ======================================================
     9. 恢复本地模拟账号和签署返回入口
     ====================================================== */

  if (!signingPage) {
    restoreDemoSession();

    if (route.get("view") === "signed" && me()?.role === "biz") {
      view = "signed";
      page = 1;
      filters = {
        q: "",
        status: "",
        mode: "",
        days: ""
      };
    }
  }

  /*
   * 对补丁安装前已完成的单方函件，补充归档信息。
   * 不修改历史正文、签署时间和历史版本。
   */
  const legacyUnilateral = db.contracts.filter(c =>
    c.signType === "unilateral" &&
    c.status === "unilateral_done" &&
    c.signatures?.a &&
    !c.archivedAt
  );

  if (legacyUnilateral.length) {
    tx(() => {
      for (const c of legacyUnilateral) {
        c.archivedAt = now();
        c.archiveNo = "ARC-" + c.no;

        originalLog(
          "补充单方函件归档",
          "按照更新后的归档规则，将已完成单方签章的函件纳入合同汇总表；历史正文与签署时间保持不变。",
          c,
          SYSTEM
        );
      }
    });
  } else {
    render();
  }

})();

    if(role === "chief" && view === "tasks" && chiefQueue){

  render = function(){

    if(me()?.role === "chief" && button.dataset.id === "tasks"){
      chiefQueue = button.dataset.navigationKind === "queue";

    if(["create","pending","signed","handled"].includes(button.dataset.id)){
      folderOpen = true;
    }
  },true);

  /* =========================
     二、文档读取
     ========================= */

  function decodeText(buffer){
    const bytes = new Uint8Array(buffer);

    if(bytes[0] === 0xff && bytes[1] === 0xfe){
      return new TextDecoder("utf-16le").decode(bytes);
    }

    if(bytes[0] === 0xfe && bytes[1] === 0xff){
      return new TextDecoder("utf-16be").decode(bytes);
    }

    try{
      return new TextDecoder("utf-8",{fatal:true}).decode(bytes);
    }catch{
      return new TextDecoder("gb18030").decode(bytes);
    }
  }

  function cleanText(text){
    return String(text || "")
      .replace(/^\uFEFF/,"")
      .replace(/\r\n?/g,"\n")
      .replace(/\u00a0/g," ")
      .replace(/[\u200B\u200C\u200D]/g,"")
      .replace(/[ \t]+\n/g,"\n")
      .replace(/\n{4,}/g,"\n\n\n")
      .trim();
  }

  /*
   * 依据纵向位置聚合行，同一行再按横坐标排列。
   * 对复杂双栏、旋转文字不能保证恢复排版，保留原件核对。
   */
  function pdfPageText(items){
    const tokens = items
      .filter(item => typeof item.str === "string" && item.str.trim())
      .map(item => ({
        text:item.str,
        x:item.transform?.[4] || 0,
        y:item.transform?.[5] || 0,
        width:Math.abs(item.width || 0),
        height:Math.max(
          5,
          Math.abs(item.height || item.transform?.[3] || 10)
        )
      }))
      .sort((a,b)=>b.y-a.y || a.x-b.x);

    const lines = [];

    for(const token of tokens){
      const tolerance = Math.max(2,Math.min(5,token.height * .3));

      let line = lines
        .slice(-4)
        .find(row => Math.abs(row.y-token.y) <= tolerance);

      if(!line){
        line = {y:token.y,tokens:[]};
        lines.push(line);
      }

      line.tokens.push(token);
    }

    lines.sort((a,b)=>b.y-a.y);

    return lines.map(line=>{
      const parts = line.tokens.sort((a,b)=>a.x-b.x);

      let output = "";
      let previous = null;

      for(const part of parts){
        if(previous){
          const gap = part.x-(previous.x+previous.width);
          const scale = Math.max(previous.height,part.height);

          if(gap > scale * 1.8){
            output += "\t";
          }else if(
            gap > scale * .2 &&
            !/\s$/.test(output) &&
            !/^\s/.test(part.text)
          ){
            output += " ";
          }
        }

        output += part.text;
        previous = part;
      }

      return output.trim();
    }).join("\n");
  }

  extract = async function enhancedExtract(file){
    need(
      file instanceof Blob &&
      file.size > 0 &&
      file.size <= 15 * 1024 * 1024,
      "请选择不超过 15 MB 的有效文档。"
    );

    const extension = file.name.split(".").pop().toLowerCase();

    if(["txt","md"].includes(extension)){
      const text = cleanText(decodeText(await file.arrayBuffer()));
      need(text.length <= 150000,"正文超过 150000 字符，请拆分文档。");
      return text;
    }

    if(extension !== "pdf"){
      // DOCX 保留原有解析器和解压大小限制，不改变原件处理方式。
      return cleanText(await previousExtract(file));
    }

    const pdfjs = await import(
      "https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.min.mjs"
    );

    pdfjs.GlobalWorkerOptions.workerSrc =
      "https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.worker.min.mjs";

    const task = pdfjs.getDocument({
      data:new Uint8Array(await file.arrayBuffer()),
      isEvalSupported:false
    });

    task.onPassword = (_updatePassword,reason)=>{
      task.destroy();
      toast("该 PDF 需要密码，请先上传已解除密码保护的副本。");
    };

    let pdf;

    try{
      pdf = await task.promise;

      need(pdf.numPages <= 100,"PDF 超过 100 页，请拆分后上传。");

      const pages = [];
      const noTextPages = [];
      let total = 0;

      for(let n=1;n<=pdf.numPages;n++){
        const pageObject = await pdf.getPage(n);
        const content = await pageObject.getTextContent();
        const text = cleanText(pdfPageText(content.items));

        if(!text) noTextPages.push(n);

        pages.push(text);
        total += text.length;

        need(total <= 150000,"PDF 提取正文过长，请拆分后上传。");

        pageObject.cleanup();
      }

      /*
       * 不默默丢弃无文本页。
       * 原件仍可保留，但本次自动正文提取不视为完整成功。
       */
      need(
        noTextPages.length === 0,
        "PDF 第 " + noTextPages.join("、") +
        " 页未提取到文字，可能是扫描页或空白页。" +
        "为避免漏读，本次不自动替换正文；请核对原件，必要时先进行 OCR。"
      );

      return cleanText(pages.join("\n\n"));
    }finally{
      if(pdf) await pdf.destroy();
      else await task.destroy();
    }
  };

  /* =========================
     三、甲乙方区域识别
     使用候选值和证据，不伪造置信度百分比
     ========================= */

  const fieldAliases = {
    Name:[
      "公司名称","企业名称","单位名称","主体名称"
    ],
    Credit:[
      "统一社会信用代码","社会信用代码","纳税人识别号","税号"
    ],
    Address:[
      "注册地址","联系地址","通讯地址","住所地","住所","地址"
    ],
    Legal:[
      "法定代表人","法人代表"
    ],
    Contact:[
      "联系人","联系人员","经办人"
    ],
    Phone:[
      "联系电话","联系手机","手机号码","电话号码","手机号","电话","手机"
    ],
    Email:[
      "电子邮箱","电子邮件","邮箱","E-mail","Email"
    ],
    Bank:[
      "开户银行","开户行"
    ],
    Account:[
      "银行账号","银行帐号","收款账号","收款帐号","账号","帐号"
    ],
    AccountName:[
      "银行账户名称","收款账户名称","账户名称","开户名称","开户名","户名"
    ],
    Invoice:[
      "开票信息","发票信息"
    ]
  };

  const aliasMap = new Map();

  for(const [field,aliases] of Object.entries(fieldAliases)){
    for(const alias of aliases){
      aliasMap.set(alias.toLowerCase(),field);
    }
  }

  const escapedAliases = [...aliasMap.keys()]
    .sort((a,b)=>b.length-a.length)
    .map(value=>value.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"));

  const labelPattern =
    "(?:(甲方|乙方)\\s*(?:的\\s*)?)(" +
    escapedAliases.join("|") +
    ")\\s*[:：]";

  function normalizeField(field,value){
    let text = String(value || "")
      .replace(/^[ \t:：]+|[ \t;；，,]+$/g,"")
      .trim();

    if(!text || /^[_—\-.\s]+$/.test(text)) return "";

    if(field === "Phone"){
      const hits = text.match(
        /(?:\+?86[- ]?)?1[3-9]\d{9}|0\d{2,3}[- ]?\d{7,8}(?:-\d{1,6})?/g
      ) || [];

      const unique = [...new Set(hits.map(item=>
        item.replace(/^\+?86[- ]?(?=1[3-9]\d{9}$)/,"")
            .replace(/ /g,"")
      ))];

      return unique.length === 1 ? unique[0] : "";
    }

    if(field === "Credit"){
      text = text.replace(/\s/g,"").toUpperCase();
      return /^[0-9A-Z]{18}$/.test(text) ? text : "";
    }

    if(field === "Account"){
      text = text.replace(/[\s-]/g,"");
      return /^\d{8,32}$/.test(text) ? text : "";
    }

    if(field === "Email"){
      return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(text) ? text : "";
    }

    if(text.length > (field === "Invoice" ? 1000 : 300)) return "";

    return text;
  }

  recognize = function enhancedRecognize(source){
    const text = cleanText(source);
    const candidates = {};
    const unresolved = new Set();

    function add(key,value,evidence){
      if(!value) return;

      if(!candidates[key]) candidates[key] = [];

      if(!candidates[key].some(item=>item.value === value)){
        candidates[key].push({
          value,
          evidence:String(evidence || "").slice(0,220)
        });
      }
    }

    let activeParty = "";
    let regionLines = 0;

    for(const originalLine of text.split("\n")){
      const line = originalLine.trim();

      if(!line) continue;

      if(
        /^(?:第[一二三四五六七八九十\d]+[条章节]|[一二三四五六七八九十]+[、．.])/.test(line) ||
        /^(?:鉴于|双方约定|经双方|本合同)/.test(line)
      ){
        activeParty = "";
        regionLines = 0;
      }

      const partyPattern =
        /(甲方|乙方)\s*(?:[（(][^）)\n]{0,30}[）)])?\s*[:：]/g;

      const markers = [...line.matchAll(partyPattern)];

      function parseFields(segment,party,evidence){
        const matches = [...segment.matchAll(new RegExp(labelPattern,"gi"))];

        for(let index=0;index<matches.length;index++){
          const match = matches[index];
          const field = aliasMap.get(match[2].toLowerCase());
          const explicitParty = match[1];

          const resolvedParty = explicitParty || party;
          if(!resolvedParty) continue;

          const start = match.index + match[0].length;
          const end = index+1 < matches.length
            ? matches[index+1].index
            : segment.length;

          const raw = segment.slice(start,end).trim();
          const normalized = normalizeField(field,raw);

          const key = (resolvedParty === "甲方" ? "a" : "b") + field;

          if(normalized){
            add(key,normalized,evidence);
          }else if(raw && !/^[_—\-.\s]+$/.test(raw)){
            unresolved.add(key);
          }
        }
      }

      if(markers.length){
        for(let i=0;i<markers.length;i++){
          const marker = markers[i];
          const party = marker[1];
          const start = marker.index + marker[0].length;
          const end = i+1 < markers.length
            ? markers[i+1].index
            : line.length;

          const segment = line.slice(start,end).trim();
          const firstLabel = new RegExp(labelPattern,"i").exec(segment);

          const rawName = firstLabel
            ? segment.slice(0,firstLabel.index)
            : segment;

          const name = normalizeField("Name",rawName);

          if(name){
            add(
              (party === "甲方" ? "a" : "b") + "Name",
              name,
              originalLine
            );
          }

          parseFields(segment,party,originalLine);
        }

        /*
         * 同一行同时出现甲乙方时，后续无归属字段不推测归属，
         * 避免把双列表格全部判给最后一个主体。
         */
        activeParty = markers.length === 1 ? markers[0][1] : "";
        regionLines = 0;
      }else{
        parseFields(line,activeParty,originalLine);

        regionLines++;

        if(regionLines > 24){
          activeParty = "";
        }
      }
    }

    const amountPattern =
      /(?:合同总金额|合同总价|合同金额|总价款)\s*(?:为|是)?\s*[:：]?\s*(?:人民币)?\s*[¥￥]?\s*([\d,，]+(?:\.\d{1,2})?)\s*(万元|元)/g;

    for(const match of text.matchAll(amountPattern)){
      const number = Number(match[1].replace(/[,，]/g,"")) *
        (match[2] === "万元" ? 10000 : 1);

      if(Number.isFinite(number) && number >= 0){
        add("amount",number.toFixed(2),match[0]);
      }
    }

    const values = {};
    const ambiguous = [];

    for(const [key,items] of Object.entries(candidates)){
      if(items.length === 1 && !unresolved.has(key)){
        values[key] = items[0].value;
      }else{
        ambiguous.push(LABELS[key] || key);
      }
    }

    for(const key of unresolved){
      if(!ambiguous.includes(LABELS[key] || key)){
        ambiguous.push(LABELS[key] || key);
      }
      delete values[key];
    }

    lastRecognition = {values,ambiguous,candidates};
    return lastRecognition;
  };

  /* =========================
     四、识别结果展示
     ========================= */

  renderRecognition = function enhancedRecognitionView(ambiguous=[]){
    if(!editor || !$("recognizeBox")) return;

    const result = editor.recognitionDetails;
    const box = $("recognizeBox");

    box.hidden = false;

    const entries = Object.entries(editor.recognized || {});

    box.innerHTML = `
      <div class="actions between">
        <b style="font-size:12px">信息识别 · 请核对</b>
        ${B("fill-empty","回填空字段","","small")}
      </div>

      ${entries.map(([key,value])=>{
        const evidence = result?.candidates?.[key]?.[0]?.evidence || "";

        return `
          <div class="recognition-item">
            <div class="actions between">
              <span class="recognition-label">
                ${esc(LABELS[key] || key)}
              </span>
              ${B("adopt","采用",key,"small")}
            </div>
            <div class="recognition-value">${esc(value)}</div>
            ${
              evidence
                ? `<div class="recognition-evidence">
                    原文依据：${esc(evidence)}
                  </div>`
                : ""
            }
          </div>
        `;
      }).join("") || `
        <p class="muted">
          未找到可明确归属的字段，请按原件填写。
        </p>
      `}

      ${ambiguous.length ? `
        <div class="recognition-warning">
          以下字段存在多个候选值或格式疑点，未自动回填：
          ${esc(ambiguous.join("、"))}
        </div>
      ` : ""}

      <p class="muted" style="margin:12px 0 0">
        默认不覆盖已填写内容；甲方主体可通过下拉选择。
        自动提取结果不等于原件完整性或真实性验证。
      </p>
    `;
  };

  /* =========================
     五、上传原子化处理
     解析期间不提前覆盖正文或识别结果
     ========================= */

  uploadContract = async function enhancedUpload(file){
    const state = editor;

    need(
      state &&
      state.mode === "nonstandard" &&
      !state.busy,
      "正在读取文件，请稍候。"
    );

    need(
      /\.(pdf|docx|txt|md)$/i.test(file.name) &&
      file.size > 0 &&
      file.size <= 15*1024*1024,
      "仅支持 PDF、DOCX、TXT、MD，最大 15 MB。"
    );

    const textarea = $("editBody");
    const before = textarea.value;

    if(
      before.trim() &&
      !confirm("读取成功后将替换编辑区正文，是否继续？")
    ){
      return;
    }

    const oldFile = state.file;
    let storedFile = null;
    let committed = false;

    state.busy = true;
    $("saveEditor").disabled = true;

    const uploadInput = $("contractUpload");
    if(uploadInput) uploadInput.disabled = true;

    $("uploadState").textContent =
      "正在读取文档并分析甲乙方信息，请稍候……";

    try{
      const extracted = cleanText(await extract(file));

      need(extracted,"未读取到可识别正文，请核对原件。");

      need(
        editor === state &&
        account === state.actor &&
        $("editBody") === textarea,
        "编辑窗口或当前账号已变化，本次读取未应用。"
      );

      need(
        textarea.value === before,
        "读取期间正文已被修改，本次不会覆盖当前内容。"
      );

      storedFile = await saveFile(file);

      need(
        editor === state &&
        account === state.actor &&
        textarea.value === before,
        "页面或正文已变化，本次读取未应用。"
      );

      const result = recognize(extracted);
      const newURL = URL.createObjectURL(file);

      if(state.url) URL.revokeObjectURL(state.url);

      state.file = storedFile;
      state.url = newURL;
      state.recognized = result.values;
      state.recognitionDetails = result;

      textarea.value = extracted;

      let filled = 0;

      for(const key of Object.keys(result.values)){
        if(adopt(key,false)) filled++;
      }

      state.parseNote =
        `提取 ${extracted.length} 字符；` +
        `明确候选 ${Object.keys(result.values).length} 项；` +
        `回填 ${filled} 个空字段；` +
        `待核对 ${result.ambiguous.length} 项`;

      const titleControl = $("editForm").elements.namedItem("title");

      if(
        titleControl &&
        ["","非标合同"].includes(titleControl.value.trim())
      ){
        titleControl.value = file.name.replace(/\.[^.]+$/,"");
      }

      committed = true;

      $("uploadState").textContent =
        file.name + " · " + state.parseNote;

      renderRecognition(result.ambiguous);
      livePreview();

      toast("文档已读取，请核对原件、正文和双方信息。");
    }catch(error){
      if(editor === state){
        /*
         * 只有新建且尚无原件、正文为空时，保留失败文档供人工核对。
         * 已有合同不替换旧原件，避免新原件与旧正文混淆。
         */
        if(!oldFile && !before.trim() && !committed){
          try{
            const metadata = storedFile || await saveFile(file);

            if(editor === state){
              state.file = metadata;

              if(state.url) URL.revokeObjectURL(state.url);

              state.url = URL.createObjectURL(file);
              state.parseNote =
                "自动提取未完成，原件仅供人工核对，正文需人工补充。";
            }
          }catch{
            // 附件存储失败时仍保留原错误反馈。
          }
        }

        if($("uploadState")){
          $("uploadState").textContent =
            "未自动替换正文：" + error.message +
            (state.file && !oldFile
              ? " 原件已保留，请打开原件核对并补充正文。"
              : " 原有正文和附件保持不变。");
        }

        toast(error.message || "文档读取失败，请核对文件。");
      }
    }finally{
      state.busy = false;

      if(editor === state){
        if($("saveEditor")) $("saveEditor").disabled = false;
        if($("contractUpload")) $("contractUpload").disabled = false;
      }
    }
  };

  render();
})();
</script>

<script>
(function(){
"use strict";

if(window.__QZN_APPROVAL_ENHANCEMENT__)return;
window.__QZN_APPROVAL_ENHANCEMENT__=true;

/* =========================================================
 * 1. 节点与权限
 * 不改变账号、合同归属、签署和归档权限。
 * ========================================================= */

function qznSubmitter(c){
 return userName(c.owner);
}

function qznCurrentApprover(c){
 if(c.status==="assign")return userName("chief");
 if(c.status==="legal")return userName(c.assignee);
 if(c.status==="finance")return userName(FINANCE);
 if(c.status==="returned")return "—（待提交人修改）";
 if(c.status==="draft")return "—（尚未提交）";
 return "—（非审批阶段）";
}

function qznCanReturn(c){
 if(!c||c.mode!=="nonstandard"||!me())return false;

 if(c.status==="assign"){
  return me().role==="chief";
 }

 return canApprove(c);
}

function qznPreviousNode(c){
 if(c.status==="finance"){
  return {
   status:"legal",
   actorId:c.assignee,
   label:"法务审批",
   name:userName(c.assignee)
  };
 }

 if(c.status==="legal"){
  return {
   status:"assign",
   actorId:"chief",
   label:"主管分派",
   name:userName("chief")
  };
 }

 return {
  status:"returned",
  actorId:c.owner,
  label:"提交人",
  name:qznSubmitter(c)
 };
}

function qznNodeLabel(status){
 return {
  assign:"主管分派",
  legal:"法务审批",
  finance:"财务审批"
 }[status]||"审批";
}

/* =========================================================
 * 2. 列表显示提交人及当前审批人
 * 保留原表格内容、操作和分页。
 * ========================================================= */

const originalTable=table;

table=function(rows,summary=false){
 const html=originalTable(rows,summary);
 if(!rows.length)return html;

 const holder=document.createElement("template");
 holder.innerHTML=html;

 const header=holder.content.querySelector("thead tr");
 if(!header)return html;

 // 汇总表已有“提交人”，不重复添加；其他列表保持原有增强。
 const columns = [
  {title:"提交人", value:c=>qznSubmitter(c)},
  {title:"当前审批人", value:c=>qznCurrentApprover(c)}
 ].filter(column =>
  !Array.from(header.children).some(
   th => th.textContent.trim() === column.title
  )
 );

 for(const column of columns){
  const th=document.createElement("th");
  th.textContent=column.title;
  header.insertBefore(th,header.lastElementChild);
 }

 const trs=holder.content.querySelectorAll("tbody tr");

 trs.forEach((tr,index)=>{
  const c=rows[index];
  if(!c)return;

  for(const column of columns){
   const td=document.createElement("td");
   td.textContent=column.value(c);
   tr.insertBefore(td,tr.lastElementChild);
  }
 });

 return holder.innerHTML;
};

/* =========================================================
 * 3. 当前主管也可退回
 * 主管仍使用原分派按钮，不新增“主管审批通过”节点。
 * ========================================================= */

const originalContractActions=contractActions;

contractActions=function(c){
 // 原操作区已经提供退回按钮，不再追加重复入口。
 return originalContractActions(c);
};

/* =========================================================
 * 4. 审批弹窗
 * 原来的 approve / reject 按钮继续调用 openReview。
 * 使用独立表单 ID，避免执行原审批提交分支。
 * ========================================================= */

openReview=function(c,pass){
 if(pass){
  need(canApprove(c));
 }else{
  need(qznCanReturn(c));
 }

 const previous=qznPreviousNode(c);
 const node=qznNodeLabel(c.status);
 const initialOpinion=pass?"同意":"待修订后重新提交";

 modal(`
 ${MH(node+" · "+(pass?"通过":"退回"))}

 <form
  id="qznReviewForm"
  data-id="${esc(c.id)}"
  data-version="${c.version}"
  data-status="${esc(c.status)}"
  data-assignee="${esc(c.assignee||"")}"
  data-actor="${esc(account)}"
  data-pass="${pass?"1":"0"}">

  <div class="tip">
   本次审批绑定当前合同 V${c.version}。
   ${
    pass
     ? c.status==="finance"
       ? "通过后进入甲方签署。"
       : "通过后进入固定财务审批。"
     : "退回后由所选目标环节继续处理。"
   }
  </div>

  ${KV("合同名称",c.title)}
  ${KV("提交人",qznSubmitter(c))}
  ${KV("当前审批人",qznCurrentApprover(c))}

  <div class="qzn-review-layout" style="margin-top:16px">

   ${
    pass
     ? `
      <label class="full" style="font-size:12px;margin-bottom:15px">
       <input type="checkbox" name="checked" required>
       已核对当前合同正文、相关附件和
       ${c.status==="finance"?"金额及付款信息":"主体信息与合同条款"}
      </label>`
     : `
      <label class="field full">
       退回位置 *
       <select name="returnTarget" required>
        <option value="submitter">
         退回提交人：${esc(qznSubmitter(c))}
        </option>
        <option value="previous">
         退回上一环节：${esc(previous.label)}
         / ${esc(previous.name)}
        </option>
       </select>
      </label>
      ${
       c.status==="assign"
        ? '<div class="tip full">主管分派的上一环节就是业务提交人，因此两个选项均退回业务修改。</div>'
        : ""
      }`
   }

   <label class="field full">
    快捷审批意见
    <select id="qznOpinionPreset">
     <option value="">手动填写</option>
     <option value="同意" ${pass?"selected":""}>同意</option>
     <option value="待修订后重新提交" ${pass?"":"selected"}>
      待修订后重新提交
     </option>
    </select>
   </label>

   <label class="field full">
    审批意见 *
    <textarea
     id="qznOpinion"
     name="opinion"
     required
     maxlength="3000"
     placeholder="可选择快捷意见，也可手动填写或补充"
    >${initialOpinion}</textarea>
   </label>

   ${
    !pass
     ? `
      <label class="field full">
       上传本人修改后的附件（可选）
       <input
        type="file"
        name="reviewFile"
        accept=".pdf,.doc,.docx,.txt,.md,.jpg,.jpeg,.png">
       <span class="muted">
        支持 PDF、DOC、DOCX、TXT、MD、JPG、PNG，
        最大 30 MB。附件随本次退回意见保存，
        不覆盖原合同原件。
       </span>
      </label>`
     : ""
   }
  </div>

  <div class="modalfoot">
   ${B("close","取消")}
   <button class="primary" id="qznReviewSave">
    确认${pass?"通过":"退回"}
   </button>
  </div>
 </form>`);
};

/* =========================================================
 * 5. 附件校验与保存
 * 附件保存在原 IndexedDB 文件库，审批记录存元数据。
 * ========================================================= */

function qznValidateReviewFile(file){
 if(!(file instanceof Blob)||!file.size)return false;

 need(
  file.size<=30*1024*1024,
  "审批附件不能超过 30 MB。"
 );

 need(
  /\.(pdf|doc|docx|txt|md|jpe?g|png)$/i.test(file.name||""),
  "审批附件仅支持 PDF、DOC、DOCX、TXT、MD、JPG、PNG。"
 );

 return true;
}

function qznNotifyReturn(c,approval){
 const recipients=new Set([
  c.owner,
  approval.returnToActor
 ]);

 for(const recipient of recipients){
  if(!recipient||recipient===account)continue;

  message(
   recipient,
   `${approval.node}退回至${approval.returnToLabel}：${c.title}`,
   c
  );
 }
}

async function qznSaveReview(form){
 if(form.dataset.busy==="1")return;
 if(!form.reportValidity())return;

 const values=Object.fromEntries(new FormData(form));
 const pass=form.dataset.pass==="1";
 const actor=form.dataset.actor;

 need(account===actor&&me(),"当前账号已变化，请重新打开审批窗口。");

 const c=get(form.dataset.id);

 need(c,"合同不存在。");
 need(pass?canApprove(c):qznCanReturn(c),"当前账号已不是本环节处理人。");
 need(String(values.opinion||"").trim(),"请填写审批意见。");

 if(pass)need(values.checked,"请先确认已完成核对。");
 else need(
  ["submitter","previous"].includes(values.returnTarget),
  "请选择退回位置。"
 );

 const button=$("qznReviewSave");
 form.dataset.busy="1";
 if(button)button.disabled=true;

 // 用于检查附件上传期间是否发生了其他数据变更。
 const startingRevision=db.revision;
 let attachment=null;

 try{
  if(!pass&&qznValidateReviewFile(values.reviewFile)){
   attachment=await saveFile(values.reviewFile);
  }

  need(
   $("qznReviewForm")===form&&account===actor,
   "审批窗口或账号已变化，本次未提交。"
  );

  need(
   db.revision===startingRevision,
   "附件处理期间数据已更新，请重新打开审批窗口后提交。"
  );

  const ok=tx(()=>{
   const current=get(form.dataset.id);

   need(current,"合同不存在。");
   need(account===actor,"账号已变化。");

   need(
    current.version===Number(form.dataset.version)&&
    current.status===form.dataset.status&&
    String(current.assignee||"")===form.dataset.assignee,
    "合同版本、审批节点或承办法务已变化，请重新打开审批窗口。"
   );

   need(
    pass?canApprove(current):qznCanReturn(current),
    "当前账号已无权处理此审批。"
   );

   const status=current.status;

   const chiefLegalPass=
    pass&&
    me().role==="chief"&&
    ["assign","legal"].includes(status);

   if(chiefLegalPass){
    const previousAssignee=current.assignee;

    current.assignee=account;
    current.participants=[
     ...new Set([
      ...(current.participants||[]),
      account
     ])
    ];

    if(previousAssignee!==account){
     log(
      "主管自行处理",
      previousAssignee
       ? "主管接手处理，原承办法务："+userName(previousAssignee)+"。"
       : "主管直接处理待调度合同。",
      current
     );

     if(previousAssignee){
      message(
       previousAssignee,
       "合同已由法务主管自行处理",
       current
      );
     }
    }
   }

   const node=chiefLegalPass
    ? "法务审批"
    : qznNodeLabel(status);

   const approval={
    id:uid("approval-"),
    version:current.version,
    node,
    result:pass?"通过":"退回",
    byId:account,
    by:me().name,
    at:now(),
    opinion:String(values.opinion).trim(),
    attachment,
    fromStatus:status
   };

   if(!Array.isArray(current.approvals))current.approvals=[];

   if(pass){
    current.approvals.push(approval);
    current.returnReason="";

    log(node+"通过",approval.opinion,current);

    if(status==="legal"||chiefLegalPass){
     current.legalVersion=current.version;
     current.financeVersion=null;
     current.status="finance";
     current.financeEntered=true;

     message(
      FINANCE,
      "收到待财务审批合同："+current.title,
      current
     );

     log(
      "进入财务审批",
      chiefLegalPass
       ? "法务主管审批通过，自动提交固定财务审批人：孙会计。"
       : "法务已通过，自动提交固定财务审批人。",
      current,
      SYSTEM
     );

     if(chiefLegalPass){
      message(
       current.owner,
       "法务主管审批通过，已进入财务审批",
       current
      );
     }
    }else{
     // 保留原有法务与财务版本一致性检查。
     need(
      current.legalVersion===current.version,
      "当前版本尚未通过法务审批。"
     );

     current.financeVersion=current.version;
     enterSigning(current);
    }

    return;
   }

   const target=values.returnTarget==="submitter"
    ? {
       status:"returned",
       actorId:current.owner,
       label:"提交人",
       name:qznSubmitter(current)
      }
    : qznPreviousNode(current);

   if(target.status==="legal"){
    need(
     ["legal","chief"].includes(user(target.actorId)?.role),
     "未找到原承办法务或主管，请选择退回提交人。"
    );
   }

   approval.returnTarget=values.returnTarget;
   approval.returnToStatus=target.status;
   approval.returnToActor=target.actorId;
   approval.returnToLabel=target.label;
   approval.returnToName=target.name;

   current.approvals.push(approval);

   /*
    * 退回即取消当前版本已有的审批通过标记。
    * 财务退回法务后，需要法务、财务重新通过。
    */
   current.legalVersion=null;
   current.financeVersion=null;

   current.status=target.status;

   if(target.status==="assign"){
    // 回到主管，由主管重新选择承办法务。
    // 历史参与人仍保留，方便查看此前处理过的合同。
    current.assignee=null;
   }

   if(target.status==="legal"){
    current.assignee=target.actorId;
    current.participants=[
     ...new Set([
      ...(current.participants||[]),
      target.actorId
     ])
    ];
   }

   current.returnReason=
    `${node}退回至${target.label}（${target.name}）：`+
    approval.opinion;

   log(
    node+"退回",
    [
     `退回位置：${target.label} / ${target.name}`,
     `审批意见：${approval.opinion}`,
     attachment?`修改附件：${attachment.name}`:""
    ].filter(Boolean).join("\n"),
    current
   );

   qznNotifyReturn(current,approval);
  });

  if(ok)toast(pass?"审批已通过。":"已退回至所选环节。");

 }finally{
  if($("qznReviewForm")===form){
   form.dataset.busy="0";
   if(button)button.disabled=false;
  }
 }
}

 );

   preview?"预览审批修改附件":"下载审批修改附件",

  );

  return;

 modal(`
